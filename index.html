/* ---------- helpers ---------- */
const DAYS = ["M","T","W","TH","F","SA","SU"];
const fmt$ = (n,d=0) => (n<0?"-":"") + "$" + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtN = (n,d=0) => Number(n||0).toLocaleString(undefined,{maximumFractionDigits:d});
const pct  = n => Math.round(n*100)+"%";
const parseSTA = s => {
  if (s===""||s==null) return null;
  const m = String(s).trim().match(/^(\d+)\s*\+\s*(\d+(\.\d+)?)$/);
  if (m) return parseInt(m[1],10)*100 + parseFloat(m[2]);
  const n = parseFloat(String(s).replace(/,/g,""));
  return isNaN(n) ? null : n;
};
const staFmt = n => n==null ? "" : Math.floor(n/100) + "+" + String((n%100).toFixed(n%1?2:0)).padStart(2,"0");
const addDays = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const mondayOf = iso => { const d=new Date(iso+"T12:00:00"); const g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); return d.toISOString().slice(0,10); };
const dLabel = (wk,i) => { const d=new Date(addDays(wk,i)+"T12:00:00"); return d.getDate(); };
const longDate = iso => new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
const wkTitle = wk => {
  const a=new Date(wk+"T12:00:00"), b=new Date(addDays(wk,6)+"T12:00:00");
  const mo=d=>d.toLocaleDateString(undefined,{month:"short"});
  return `Week of ${mo(a)} ${a.getDate()} – ${mo(a)===mo(b)?"":mo(b)+" "}${b.getDate()}`;
};

/* ---------- field-voice EOS descriptions (Silas cadence) ---------- */
const stickLen = n => /arch pipe|reinforced concrete pipe|rcp\b/i.test(n)?8 : /hppp|polypropylene|pvc/i.test(n)?20 : /ductile|di water/i.test(n)?18 : 0;
function autoDesc(name, ts, logs, calc, isSub){
  if(!ts.length) return "";
  const t=ts[0], c=calc(t), lg=logs[t.id];
  const item=c.it[CI.TASK], um=c.it[CI.UM], cat=c.it[CI.CAT];
  const q = lg? c.actQty : t.qty;
  const sta = t.sta? ` from station ${staFmt(t.sta[0])} to station ${staFmt(t.sta[1])}` : "";
  if (isSub) return `${name} continued ${item.toLowerCase()}${q?`, placing ${fmtN(q)} ${um}`:""}${sta}.`;
  const sl = stickLen(item);
  let s;
  if (cat===0 && sl && um==="LF")
    s = `${name}'s crew continued mainline drainage work, laying ${Math.max(1,Math.round(q/sl))} sticks (${fmtN(q)} LF) of ${item}${sta}.`;
  else if (cat===0)
    s = `${name}'s crew continued drainage work, installing ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===1)
    s = `${name}'s crew continued water main work, running ${fmtN(q)} ${um} of ${item}${sta} and backfilling behind the pipe.`;
  else if (cat===2)
    s = `${name}'s crew continued sewer work, laying ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===3)
    s = `${name}'s crew set ${fmtN(q)}${um==="EACH"?"":" "+um+" of"} ${item}${sta}, then backfilled around the structure.`;
  else if (cat===4)
    s = `${name}'s crew formed and poured ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===5 && /fine grad/i.test(item))
    s = `${name}'s crew fine graded the ${item.toLowerCase()} to the correct elevation.`;
  else if (cat===5 && /dump and spread|base course/i.test(item))
    s = `${name}'s crew hauled in, spread, and compacted ${fmtN(q)} ${um} of ${item.toLowerCase()}.`;
  else if (cat===5)
    s = `${name}'s crew continued earthwork, placing ${fmtN(q)} ${um} of ${item.toLowerCase()}.`;
  else
    s = `${name}'s crew worked ${item.toLowerCase()}, completing ${fmtN(q)} ${um}.`;
  // production clause
  if (lg && t.qty){
    if (c.actQty >= t.qty) s = s.replace(/\.$/, ", meeting the day's planned production.");
    else s += ` The crew finished short of the planned ${fmtN(t.qty)} ${um}.`;
  }
  // extra tasks that day
  const verbs = {0:"laid",1:"ran",2:"laid",3:"set",4:"poured",5:"placed"};
  ts.slice(1).forEach(x=>{
    const cx=calc(x), lx=logs[x.id]; const qx=lx?cx.actQty:x.qty;
    s += ` They also ${verbs[cx.it[CI.CAT]]||"placed"} ${fmtN(qx)}${cx.it[CI.UM]==="EACH"?"":" "+cx.it[CI.UM]+" of"} ${cx.it[CI.TASK].toLowerCase()}.`;
  });
  // trucking clause
  const loads = ts.reduce((a,x)=>a+calc(x).loads,0);
  if (loads>=0.5){
    const trucks=Math.max(1,Math.ceil(loads/6));
    s += ` The crew ran ${trucks} truck${trucks>1?"s":""}, moving ${Math.round(loads)} load${Math.round(loads)>1?"s":""} of material.`;
  }
  return s;
}

function useIsMobile(){
  const q="(max-width:720px)";
  const [m,setM]=useState(()=> typeof window!=="undefined" && window.matchMedia(q).matches);
  useEffect(()=>{ const mq=window.matchMedia(q); const on=()=>setM(mq.matches); mq.addEventListener?.("change",on); return ()=>mq.removeEventListener?.("change",on); },[]);
  return m;
}

    const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");

      const light = theme==="light" || (theme==="system" && mq && mq.matches);
      document.documentElement.setAttribute("data-boot", light? "light":"dark");
      document.documentElement.style.colorScheme = light? "light":"dark";
      document.body.style.background = light? "#f4f5f6":"#000000";

  },[theme]);

  /* persistence */
  useEffect(()=>{ (async()=>{

        if (s.ctc) setCtc(s.ctc);

      }
    }catch(e){ /* first run — seeds stand */ }

  })(); },[]);
  const saveTimer = useRef(null);
  useEffect(()=>{

    }, 600);
  },[crews,siteRows,tasks,logs,notes,cfg,eosMeta,wk,umOverrides,equipment,eqHours,showOwned,showRental,ctc,baseline,milestones,reflowOn,loaded]);

  /* fonts */
  useEffect(()=>{
    const l=document.createElement("link"); l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Oswald:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
    document.head.appendChild(l); return ()=>document.head.removeChild(l);
  },[]);

  /* derived */
  const weekTasks = useMemo(()=>tasks.filter(t=>t.wk===wk),[tasks,wk]);
  const ctcOf = ci => ctc[(CATALOG[ci][CI.CC]||"").replace(/-/g,".")] || null;
  const loggedFor = ci => tasks.filter(t=>t.ci===ci).reduce((a,t)=>a+((logs[t.id]&&logs[t.id].qty)||0),0);
  // Installed baseline = CTC billed-to-date where the code is in the CTC export, else field/estimate baseline; session logging adds on top.
  const installedFor = ci => { const c=ctcOf(ci); const base = c ? (c.bq||0) : CATALOG[ci][CI.REP]; return base + loggedFor(ci); };
  const contractQtyFor = ci => { const c=ctcOf(ci); return (c && c.cq!=null) ? c.cq : (CATALOG[ci][CI.EST]||0); };
  const remainingFor = ci => { const c=ctcOf(ci); const logged=loggedFor(ci); if(c && c.rq!=null) return c.rq - logged; return (CATALOG[ci][CI.EST]||0) - installedFor(ci); };
  const actRate = ci => { // actual MH/unit from logged data (all weeks) — CTC live re-derive
    let q=0, m=0;
    tasks.forEach(t=>{ if(t.ci===ci && logs[t.id]){ q+=logs[t.id].qty||0; m+=logs[t.id].mh||0; }});
    return q>0 ? m/q : null;
  };
  const fcst = ci => {
    const it=CATALOG[ci], bud=unitCost(it), ar=actRate(ci);
    if (ar==null || !it[CI.MH]) return { uc:bud, drift:0 };
    const scale = ar/it[CI.MH];
    const uc = (it[CI.UL]+it[CI.UE])*scale + it[CI.UM$]+it[CI.US]+it[CI.UT]+it[CI.UX];
    return { uc, drift: uc-bud };
  };
  const taskCalc = t => {
    const it=CATALOG[t.ci];
    const planMH = t.qty*it[CI.MH];
    const lg = logs[t.id]||{};
    const loads = cfg.truckRate>0 ? (t.qty*it[CI.UT])/cfg.truckRate : 0;
    return { it, planMH, actQty:lg.qty||0, actMH:lg.mh||0, done:!!lg.done, loads,
      mat:t.qty*it[CI.UM$], budAmt:t.qty*it[CI.BID], budCost:t.qty*unitCost(it),
      earnMH:(lg.qty||0)*it[CI.MH] };
  };
  const kpi = useMemo(()=>{
    let p=0,a=0,e=0,cells=0,logged=0;
    weekTasks.forEach(t=>{ const c=taskCalc(t); p+=c.planMH; a+=c.actMH; e+=c.earnMH; cells++; if(logs[t.id]) logged++; });
    const ts = notes.filter(n=>n.level!=="info").length;
    return { p,a,e, pf: a>0? e/a : 0, cells, logged, ts };
  },[weekTasks,logs,notes,cfg]);

  /* mutations */
  const upTask = (id,patch)=> setTasks(ts=>ts.map(t=>t.id===id?{...t,...patch}:t));
  const moveTask = (id,res,day)=> setTasks(ts=>ts.map(t=>t.id===id?{...t,res,day}:t)); // drag / nudge to another day or crew
  const toggleSel = id => setSel(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  // Drop handler: a single card moves to the target day (+crew if given); a multi-
  // selection shifts every selected task by the same day delta, keeping each crew.
  const rescheduleDrop = (draggedId,targetRes,targetDay)=>{
    const clamp=v=>Math.max(0,Math.min(6,v));
    const multi = sel.has(draggedId) && sel.size>1;
    setTasks(ts=>{ const drag=ts.find(t=>t.id===draggedId); if(!drag) return ts;
      const group = multi ? sel : new Set([draggedId]); const delta = targetDay - drag.day;
      return ts.map(t=>{ if(!group.has(t.id)) return t;
        if(multi) return {...t, day:clamp(t.day+delta)};
        return {...t, day:targetDay, ...(targetRes!=null?{res:targetRes}:{})}; });
    });
    if(multi) setSel(new Set());
  };
  const rmTask = id => { setTasks(ts=>ts.filter(t=>t.id!==id)); setLogs(l=>{const c={...l}; delete c[id]; return c;}); setModal(null); };
  const saveLog = (id,qty,mh,done)=> setLogs(l=>({...l,[id]:{qty:+qty||0, mh:+mh||0, done}}));
  const addResource = (type,name,extra)=>{
    const id=(type==="site"?"n":type==="sub"?"s":"c")+Math.random().toString(36).slice(2,7);
    if(type==="site") setSiteRows(r=>[...r,{id,name}]);
    else setCrews(c=>[...c,{id,name,type}]);

  };
  const rmResource = id => {
    setCrews(c=>c.filter(x=>x.id!==id)); setSiteRows(r=>r.filter(x=>x.id!==id));
    setTasks(ts=>ts.filter(t=>t.res!==id)); setNotes(ns=>ns.filter(n=>n.row!==id));

  const rmEquip = id => { setEquipment(e=>e.filter(x=>x.id!==id)); setEqHours(h=>{const c={...h}; Object.keys(c).forEach(k=>{ if(k.startsWith(id+"_")) delete c[k]; }); return c;}); };
  const renameEquip = (id,name)=> setEquipment(e=>e.map(x=>x.id===id?{...x,name}:x));
  const setEqHrs = (id,val)=> setEqHours(h=>({...h,[id+"_"+wk]:val}));
  const eqProps = { equipment, eqHours, wk, showOwned, showRental, addEquip, rmEquip, renameEquip, setEqHrs };

  const crewsOnly = crews.filter(c=>c.type==="crew");
  const subsOnly  = crews.filter(c=>c.type==="sub");
  const takeSnapshot = ()=>{ const byTask={}; tasks.forEach(t=>{ byTask[t.id]={qty:t.qty,day:t.day,wk:t.wk}; }); setBaseline({takenAt:new Date().toISOString().slice(0,10), byTask}); };

          <img className="brandlogo lt" src="assets/rngd-black.png" alt="RNGD" draggable="false"/>

          <button onClick={()=>setModal({type:"milestones"})}>Milestones</button>
          <button className="themebtn" title={"Theme: "+theme+" — click to change"}
            onClick={()=>setTheme(t=>t==="system"?"light":t==="light"?"dark":"system")}>

          </button>

      {/* ============ KPI STRIP ============ */}
      {tab==="board" && <>

        <div className="kpi"><label>Actual MH</label><b>{fmtN(kpi.a)}</b></div>
        <div className="kpi"><label>Earned MH</label><b>{fmtN(kpi.e)}</b></div>

        <span><i style={{background:"#fbe08a"}}/>Subcontractor</span>

        <label className="switch"><input type="checkbox" checked={showRental} onChange={e=>setShowRental(e.target.checked)}/><i/><span>Rental</span></label>

                  {ms.map(m=><span key={m.id} className="msflag" title={m.label}>◆ {m.label.length>16?m.label.slice(0,15)+"…":m.label}</span>)}</th>;
              })}
            </tr>

      {modal?.type==="print"   && <PrintModal {...{crews,weekTasks,tasks,logs,notes,siteRows,taskCalc,installedFor,fcst,cfg,umOverrides,wk,close:()=>setModal(null)}}/>}
      {modal?.type==="data"    && <DataModal {...{cfg,setCfg,ctc,setCtc,close:()=>setModal(null)}}/>}
      {modal?.type==="milestones" && <MilestoneModal {...{milestones,setMilestones,close:()=>setModal(null)}}/>}

function computeReflow(tasks, logs, baseline, crews){
  const byTask={}, byCrew={};
  const capOf = id => { const c=crews.find(x=>x.id===id); return (c && c.capMH>0)? c.capMH : 68; };
  const groups={};
  tasks.forEach(t=>{ const k=t.res+"|"+t.ci; (groups[k]||(groups[k]=[])).push(t); });
  Object.entries(groups).forEach(([k,arr])=>{
    const res=k.slice(0,k.indexOf("|")); const cap=capOf(res);
    arr.sort((a,b)=> a.wk<b.wk?-1 : a.wk>b.wk?1 : a.day-b.day);
    const mhU = CATALOG[arr[0].ci][CI.MH];
    const capQ = mhU>0 ? cap/mhU : Infinity;
    let carry=0;
    arr.forEach(t=>{
      const bt = baseline && baseline.byTask && baseline.byTask[t.id];
      const planQ = (bt && bt.qty!=null) ? bt.qty : t.qty;
      const lg = logs[t.id];
      if(lg){ const actQ=lg.qty||0; carry=(planQ+carry)-actQ; byTask[t.id]={logged:true, planQ, actQ, reflowQ:actQ, reflowMH:(lg.mh||0), overCap:false}; }
      else {
        const want=Math.max(0, planQ+carry);
        const capped=Math.min(want, capQ);
        const reflowMH = mhU>0 ? want*mhU : 0;
        const overCap = mhU>0 && reflowMH > cap+1e-6;
        byTask[t.id]={logged:false, planQ, reflowQ:want, cappedQ:capped, reflowMH, overCap};
        carry = want-capped;
      }
    });
    const cur = byCrew[res] || (byCrew[res]={behindMH:0, over:false, cap});
    if(mhU>0 && carry>0.0001) cur.behindMH += carry*mhU;
    if(arr.some(t=>byTask[t.id] && byTask[t.id].overCap)) cur.over=true;
  });
  Object.values(byCrew).forEach(v=>{
    v.extraDays = v.behindMH>0.5 ? Math.ceil(v.behindMH/(v.cap||68)) : 0;
    v.status = v.behindMH>0.5 ? "behind" : v.over ? "over" : "on";
  });
  return {byTask, byCrew};
}
function MobileBoard({crewsOnly,subsOnly,siteRows,weekTasks,notes,setNotes,wk,taskCalc,setModal,eqProps,moveTask,sel,rescheduleDrop,milestones}){

  const [day,setDay]=useState(todayIdx);
  const showEq = eqProps && (eqProps.showOwned||eqProps.showRental);
  const crewBlock = (res,kind)=>{
    const tks = weekTasks.filter(t=>t.res===res.id && t.day===day);
    return (
      <div className="mcrew" key={res.id}>

          <button className={"chip "+kind} onClick={()=>setModal({type:"crew",id:res.id})}>{res.name}</button>

        </div>
        {tks.length ? tks.map(t=>
          <div className="mcard" key={t.id}>

              <button disabled={t.day===0} onClick={()=>moveTask(t.id,res.id,t.day-1)} aria-label="Move to previous day">‹ {t.day>0?DAYS[t.day-1]:""}</button>
              <span>move day</span>
              <button disabled={t.day===6} onClick={()=>moveTask(t.id,res.id,t.day+1)} aria-label="Move to next day">{t.day<6?DAYS[t.day+1]:""} ›</button>
            </div>
          </div>)
          : <div className="mempty">Nothing scheduled — tap Schedule.</div>}
        {showEq && <MobileEquip res={res} {...eqProps}/>}
      </div>
    );
  };
  return (
    <div className="mboard">
      <div className="mdaynav">
        <button className="mdaystep" onClick={()=>setDay(d=>Math.max(0,d-1))} disabled={day===0} aria-label="Previous day">‹</button>
        <div className="mdays">
          {DAYS.map((d,i)=>{
            const today = addDays(wk,i)===new Date().toISOString().slice(0,10);
            return <button key={d} className={"mday"+(i===day?" on":"")+(today?" today":"")+(i>4?" wknd":"")}
              onDragOver={e=>{e.preventDefault(); e.currentTarget.classList.add("dropday");}}
              onDragLeave={e=>e.currentTarget.classList.remove("dropday")}
              onDrop={e=>{e.preventDefault(); e.currentTarget.classList.remove("dropday"); const id=e.dataTransfer.getData("text/plain"); if(id){ rescheduleDrop(id,null,i); setDay(i); }}}
              onClick={()=>setDay(i)}><span>{d}</span><b>{dLabel(wk,i)}</b>{msFor(i).length>0 && <i className="msdot"/>}</button>;
          })}
        </div>
        <button className="mdaystep" onClick={()=>setDay(d=>Math.min(6,d+1))} disabled={day===6} aria-label="Next day">›</button>
      </div>
      {msFor(day).length>0 && <div className="msline">{msFor(day).map(m=>"◆ "+m.label).join("  ·  ")}</div>}
      <div className="msec">Crews</div>
      {crewsOnly.map(c=>crewBlock(c,"crew"))}
      <div className="msec">Subcontractors</div>
      {subsOnly.map(c=>crewBlock(c,"sub"))}
      <div className="msec">Site · Notes</div>
      {siteRows.map(r=>{
        const ns = notes.filter(n=>n.row===r.id && n.day===day);
        return (
          <div className="mcrew" key={r.id}>
            <div className="mcrewhead">
              <span className="chip site">{r.name}</span>
              <button className="mlog" onClick={()=>setModal({type:"note",row:r.id,day})}>＋ Note</button>
            </div>
            {ns.length ? ns.map(n=><button key={n.id} className={"note "+n.level} onClick={()=>setModal({type:"note",id:n.id,row:r.id,day})}>{n.level!=="info"?"⚠ ":""}{n.text}</button>)
              : <div className="mempty">No notes for this day.</div>}
          </div>
        );
      })}
    </div>

}
function Card({t,c,prev,onOpen,canDrag,selected,onSelect,rf,reflowOn}){
  const cat = CATS[c.it[CI.CAT]];
  const useRf = reflowOn && rf && !rf.logged;
  const qShown = useRf ? rf.reflowQ : t.qty, mhShown = useRf ? rf.reflowMH : c.planMH, bad = useRf && rf.overCap;
  return (
    <button className={"card"+(selected?" sel":"")} draggable={!!canDrag}
      onDragStart={canDrag?(e=>{ e.currentTarget.classList.add("dragging"); e.dataTransfer.setData("text/plain",t.id); e.dataTransfer.effectAllowed="move"; }):undefined}
      onDragEnd={e=>e.currentTarget.classList.remove("dragging")}
      style={{background:cat.bg,color:cat.tx}}
      onClick={e=>{ if(onSelect && (e.metaKey||e.ctrlKey||e.shiftKey)){ e.preventDefault(); onSelect(t.id); } else onOpen(); }}>
      <div className="cardtop">
        <span className="ct">{c.it[CI.TASK].length>30 ? c.it[CI.TASK].slice(0,29)+"…" : c.it[CI.TASK]}</span>
        {c.done && <span className="ck">✓</span>}
      </div>
      <div className="csub">{prev ? "→ cont." : (t.sta ? staFmt(t.sta[0])+"–"+staFmt(t.sta[1]) : c.it[CI.CC])}</div>
      <div className="cnums"><b className={bad?"cbad":""}>{fmtN(qShown,qShown%1?1:0)} {c.it[CI.UM]}</b><span className={bad?"cbad":""}>{fmtN(mhShown,mhShown%1?1:0)} MH{bad?" ▲":""}</span></div>
      {useRf && Math.abs(rf.reflowQ-rf.planQ)>0.5 && <div className="csub2">plan {fmtN(rf.planQ,rf.planQ%1?1:0)} → now {fmtN(rf.reflowQ,rf.reflowQ%1?1:0)}</div>}
    </button>
  );
}
function SiteRow({row,notes,setNotes,setModal}){

/* ============ TASK MODAL — tables, no loads field ============ */
function TaskModal({t,logs,saveLog,rmTask,upTask,cfg,installedFor,fcst,close}){
  const it = CATALOG[t.ci];
  const lg = logs[t.id]||{};
  const [qty,setQty]=useState(lg.qty??"");
  const [mh,setMh]=useState(lg.mh??"");
  const cat=CATS[it[CI.CAT]];
  const budUC=unitCost(it), f=fcst(t.ci);
  const inst=installedFor(t.ci), est=it[CI.EST]||0;
  const dayRate = it[CI.MH]>0 ? (cfg.crewSize*cfg.shiftHrs)/it[CI.MH] : t.qty;
  const loads = cfg.truckRate>0 ? (t.qty*it[CI.UT])/cfg.truckRate : 0;
  const fac=f.uc*est, budTot=budUC*est, cvar=budTot-fac;
  const margin=(it[CI.BID]-f.uc)*est;
  return (
    <Modal close={close} w={560}>
      <h3>{it[CI.TASK]}</h3>
      <div className="chiprow">
        <span className="pill" style={{background:cat.bg,color:cat.tx}}>{cat.name}</span>
        <span className="pill dim">Cost {it[CI.CC]}</span>
        <span className="pill dim">Pay {it[CI.PAY]}</span>
      </div>

      <table className="dt">
        <tbody>
          <tr><th>Rate</th><td>{fmtN(dayRate,dayRate<10?1:0)} {it[CI.UM]}/day</td><th>MH / {it[CI.UM]}</th><td>{fmtN(it[CI.MH],3)}</td></tr>
          <tr><th>Crew</th><td>{cfg.crewSize} @ {fmt$(cfg.laborRate)}/MH</td><th>Mat / {it[CI.UM]}</th><td>{fmt$(it[CI.UM$],2)}</td></tr>
          <tr><th>Trucking / {it[CI.UM]}</th><td>{fmt$(it[CI.UT],2)}</td><th>Est. loads (plan)</th><td>{loads?fmtN(loads,1):"—"}</td></tr>
        </tbody>
      </table>

      <table className="dt fcst">
        <tbody>
          <tr><th>Budget UC</th><td>{fmt$(budUC,2)}</td><th>Forecast UC</th><td className={f.drift>0.005?"neg":f.drift<-0.005?"pos":""}>{fmt$(f.uc,2)}</td></tr>
          <tr><th>Installed</th><td>{fmtN(inst)}/{fmtN(est)} {it[CI.UM]} ({est?pct(inst/est):"—"})</td><th>FAC</th><td>{fmt$(fac)}</td></tr>
          <tr><th>Cost var</th><td className={cvar<0?"neg":"pos"}>{fmt$(cvar)}</td><th>Pay / {it[CI.UM]}</th><td>{fmt$(it[CI.BID],2)}</td></tr>
          <tr><th>Proj. margin</th><td className={margin<0?"neg":"pos"} colSpan={3}>{fmt$(margin)}</td></tr>
        </tbody>
      </table>

      <div className="loghdr">Log — plan {fmtN(t.qty)} {it[CI.UM]} / {fmtN(t.qty*it[CI.MH])} MH</div>
      <div className="logrow">
        <label>Qty ({it[CI.UM]})<input type="number" value={qty} onChange={e=>setQty(e.target.value)}/></label>
        <label>Manhours<input type="number" value={mh} onChange={e=>setMh(e.target.value)}/></label>
      </div>
      <div className="btnrow">
        <button className="cta" onClick={()=>{saveLog(t.id,qty,mh,true); close();}}>Save</button>
        <button className="ghost" onClick={()=>{saveLog(t.id,qty,mh,false); close();}}>Save as in-progress</button>
        <span className="sp"/>
        <button className="danger" onClick={()=>rmTask(t.id)}>Delete task</button>
      </div>
    </Modal>
  );
}

  let tp=0,ta=0,tpm=0,tam=0,tem=0;
  const rows = mine.map(t=>{
    const c=taskCalc(t);
    tp+=t.qty; ta+=c.actQty; tpm+=c.planMH; tam+=c.actMH; tem+=c.earnMH;
    return { t,c };
  });
  const pf = tam>0? tem/tam : 0;
  return (
    <Modal close={close} w={680}>
      <div className="crewhead">

        <span className={"pill "+(pf>=1?"pgood":pf>0?"pbad":"dim")}>PF {pf?pf.toFixed(2):"—"}</span>
        <label className="capfield">Daily MH cap<input type="number" min="0" step="1" value={res.capMH??68}
          onChange={e=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,capMH:+e.target.value||0}:c))}/></label>
      </div>
      <table className="dt list">
        <thead><tr><th>Day</th><th>Item</th><th>CC</th><th className="r">Plan</th><th className="r">Actual</th><th className="r">PPC</th><th className="r">Plan MH</th><th className="r">Act MH</th></tr></thead>
        <tbody>
          {rows.length===0 && <tr><td colSpan={8} className="empty">Nothing scheduled this week — click an empty cell on the board.</td></tr>}
          {rows.map(({t,c})=>
            <tr key={t.id}>
              <td>{DAYS[t.day]}</td>
              <td>{c.it[CI.TASK].slice(0,34)}{c.it[CI.TASK].length>34?"…":""}</td>
              <td className="mono">{c.it[CI.CC]}</td>
              <td className="r">{fmtN(t.qty)} {c.it[CI.UM]}</td>
              <td className="r">{logs[t.id]?fmtN(c.actQty):"—"}</td>
              <td className={"r "+(logs[t.id]?(c.actQty>=t.qty?"pos":"neg"):"")}>{logs[t.id]&&t.qty?pct(c.actQty/t.qty):"—"}</td>
              <td className="r">{fmtN(c.planMH)}</td>
              <td className="r">{logs[t.id]?fmtN(c.actMH):"—"}</td>
            </tr>)}
        </tbody>
        {rows.length>0 && <tfoot><tr><th colSpan={3}>Week totals</th><th className="r">{fmtN(tp)}</th><th className="r">{fmtN(ta)}</th><th className="r">{tp?pct(ta/tp):"—"}</th><th className="r">{fmtN(tpm)}</th><th className="r">{fmtN(tam)}</th></tr></tfoot>}
      </table>
      <div className="btnrow"><span className="sp"/><button className="danger" onClick={()=>rmResource(res.id)}>Remove {res.type==="sub"?"subcontractor":"crew"}</button></div>
    </Modal>
  );
}

/* ============ SCHEDULE MODAL — search + station→qty (PPC logic) ============ */
function SchedModal({wk,crews,cfg,installedFor,preset,close,add}){
  const [q,setQ]=useState("");
  const [ci,setCi]=useState(preset.ci ?? null);
  const [res,setRes]=useState(preset.res ?? crews[0]?.id);
  const [day,setDay]=useState(preset.day ?? 0);
  const [mode,setMode]=useState("qty");
  const [qty,setQty]=useState("");
  const [s0,setS0]=useState(""); const [s1,setS1]=useState("");
  const [daysOv,setDaysOv]=useState("");

  const results = useMemo(()=>{
    const s=q.trim().toLowerCase(); if(!s) return [];
    return CATALOG.map((r,i)=>({r,i}))
      .filter(({r})=>r[CI.TASK].toLowerCase().includes(s)||r[CI.CC].toLowerCase().includes(s)||r[CI.PAY].toLowerCase().includes(s))
      .slice(0,30);
  },[q]);

  const it = ci!=null ? CATALOG[ci] : null;
  const a=parseSTA(s0), b=parseSTA(s1);
  const staQty = a!=null ? (b!=null ? Math.abs(b-a) : 1) : null; // one station given ⇒ assume 1
  const useQty = mode==="sta" ? (staQty??0) : (+qty||0);
  const dayRate = it && it[CI.MH]>0 ? (cfg.crewSize*cfg.shiftHrs)/it[CI.MH] : useQty||1;
  const nDays = daysOv? Math.max(1,+daysOv) : Math.max(1, Math.ceil(useQty/Math.max(dayRate,0.0001)));
  const perDay = useQty/nDays;
  const inst = it? installedFor(ci):0, est=it? it[CI.EST]:0;
  const remaining = Math.max(0, est-inst);
  const loadsDay = it&&cfg.truckRate>0 ? (perDay*it[CI.UT])/cfg.truckRate : 0;

  return (
    <Modal close={close} w={620}>
      <h3>Schedule work</h3>
      {!it && <>
        <input autoFocus className="search" placeholder="Search item, cost code, or pay item — e.g. 51x31, HPPP, 33.40" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="results">
          {results.map(({r,i})=>
            <button key={i} onClick={()=>setCi(i)}>
              <i style={{background:CATS[r[CI.CAT]].bg}}/>
              <span>{r[CI.TASK]}</span>
              <em>{r[CI.CC]} · {r[CI.PAY]} · {r[CI.UM]}</em>
            </button>)}
          {q && results.length===0 && <div className="empty">No catalog match — try part of the cost code or pay item.</div>}
          {!q && <div className="empty">319 items loaded from QPC (MHs + tracking account).</div>}
        </div>
      </>}

      {it && <>
        <div className="selitem">
          <div><b>{it[CI.TASK]}</b><em>{it[CI.CC]} · Pay {it[CI.PAY]} · {fmtN(it[CI.MH],3)} MH/{it[CI.UM]}</em></div>
          <button className="ghost sm" onClick={()=>setCi(null)}>Change</button>
        </div>

        <div className="budbar">
          <label>Budget {fmtN(est)} {it[CI.UM]} · Installed {fmtN(inst)} ({est?pct(inst/est):"—"}) · Remaining {fmtN(remaining)}</label>
          <div className="bar"><i style={{width:Math.min(100,est?inst/est*100:0)+"%"}}/>
            {useQty>0 && <u style={{left:Math.min(100,est?inst/est*100:0)+"%", width:Math.min(100-(est?inst/est*100:0), est?useQty/est*100:0)+"%"}}/>}
          </div>
          {useQty>remaining&&remaining>0 && <div className="warnline">⚠ Plan exceeds remaining budget qty by {fmtN(useQty-remaining)} {it[CI.UM]}</div>}
        </div>

        <div className="qmode">
          <button className={mode==="qty"?"on":""} onClick={()=>setMode("qty")}>Direct qty</button>
          <button className={mode==="sta"?"on":""} onClick={()=>setMode("sta")}>Station numbers</button>
        </div>
        {mode==="qty" ?
          <div className="logrow"><label>Quantity ({it[CI.UM]})<input type="number" autoFocus value={qty} onChange={e=>setQty(e.target.value)}/></label></div> :
          <div className="logrow">
            <label>Start STA<input placeholder="115+15.66" value={s0} onChange={e=>setS0(e.target.value)}/></label>
            <label>End STA<input placeholder="118+40 (blank ⇒ qty 1)" value={s1} onChange={e=>setS1(e.target.value)}/></label>
            <div className="gen">Generated qty<b>{staQty!=null?fmtN(staQty,staQty%1?2:0):"—"} {staQty!=null?it[CI.UM]:""}</b></div>
          </div>}

        <div className="logrow">
          <label>Crew / sub<select value={res} onChange={e=>setRes(e.target.value)}>{crews.map(c=><option key={c.id} value={c.id}>{c.name}{c.type==="sub"?" (sub)":""}</option>)}</select></label>
          <label>Start day<select value={day} onChange={e=>setDay(+e.target.value)}>{DAYS.map((d,i)=><option key={d} value={i}>{d} {dLabel(wk,i)}</option>)}</select></label>
          <label>Days ({fmtN(dayRate,dayRate<10?1:0)} {it[CI.UM]}/d)<input type="number" placeholder={String(nDays)} value={daysOv} onChange={e=>setDaysOv(e.target.value)}/></label>
        </div>

        {useQty>0 && <table className="dt">
          <tbody>
            <tr><th>Per day</th><td>{fmtN(perDay,perDay<10?1:0)} {it[CI.UM]} · {fmtN(perDay*it[CI.MH])} MH · {loadsDay?fmtN(loadsDay,1)+" loads":"no hauling"}</td></tr>
            <tr><th>Material (plan)</th><td>{fmt$(useQty*it[CI.UM$])}</td></tr>
            <tr><th>Budget amount</th><td>{fmt$(useQty*it[CI.BID])} <em className="dim2">@ {fmt$(it[CI.BID],2)}/{it[CI.UM]}</em></td></tr>
            <tr><th>Budget cost</th><td>{fmt$(useQty*unitCost(it))} <em className="dim2">@ {fmt$(unitCost(it),2)}/{it[CI.UM]}</em></td></tr>
          </tbody>
        </table>}

        <div className="btnrow">
          <button className="cta" disabled={!useQty} onClick={()=>{
            const list=[]; let left=useQty, cursor=(mode==="sta"&&a!=null&&b!=null)?Math.min(a,b):null;
            for(let i=0;i<nDays;i++){
              const dq=Math.min(left, Math.round(perDay*100)/100); left-=dq;
              const sta = cursor!=null? [cursor, cursor+dq] : null; if(cursor!=null) cursor+=dq;
              list.push({ id:tid(), res, ci, day:Math.min(6,day+i), qty:dq, sta, wk });
            }
            add(list);
          }}>Add {nDays>1?nDays+" days":"to board"}</button>
          <button className="ghost" onClick={close}>Cancel</button>
        </div>
      </>}
    </Modal>
  );
}

/* ============ EOS — follows EOS.pdf format exactly ============ */
function EOSModal({wk,day:d0,crews,weekTasks,logs,taskCalc,eosMeta,setEosMeta,cfg,close}){
  const [day,setDay]=useState(d0);

  const dayTasks = res => weekTasks.filter(t=>t.res===res && t.day===day);
  const crewDesc = (id,fallback)=> eosMeta.descs[id+"_"+day] ?? fallback;

  const truckLine = useMemo(()=>{
    const per = crews.map(c=>{
      const loads = dayTasks(c.id).reduce((a,t)=>a+taskCalc(t).loads,0);
      return {name:c.name, trucks:Math.ceil(loads/6)}; // ~6 loads per truck-day
    }).filter(x=>x.trucks>0);
    const total = per.reduce((a,x)=>a+x.trucks,0);
    return total? `${total} trucks requested for today's operation (${per.map(x=>`${x.name} - ${x.trucks}`).join(", ")}).` : "No trucking requested for today's operation.";
  },[weekTasks,day,crews,cfg]);

  const text = useMemo(()=>{
    const L=[];
    L.push(longDate(addDays(wk,day)));
    L.push("");
    L.push("Project: 2124013 - DPS 01 Watershed");
    L.push("Superintendent: Brett Leonhard");
    L.push("");
    L.push("Safety:"); L.push(eosMeta.safety); L.push("");
    L.push("Quality:"); L.push(eosMeta.quality); L.push("");
    L.push("Weather:"); L.push(eosMeta.weather); L.push("");
    L.push("Trucking:"); L.push(truckLine); L.push("");
    L.push("Production - Self Perform Crews:"); L.push("");
    crews.filter(c=>c.type==="crew").forEach(c=>{
      const ts=dayTasks(c.id); if(!ts.length) return;
      L.push(c.name);
      ts.forEach(t=>{
        const cc=taskCalc(t);
        const lg=logs[t.id];
        L.push(`Planned - ${cc.it[CI.CC]} ${cc.it[CI.TASK]}`);
        L.push(`Planned Production: ${fmtN(t.qty)} ${cc.it[CI.UM]}`);
        L.push(`Actual Production: ${lg?fmtN(cc.actQty):"0"} ${cc.it[CI.UM]}`);
        L.push(`PPC: ${lg&&t.qty?Math.round(cc.actQty/t.qty*100):0}%`);
      });
      L.push("Description:");
      L.push(crewDesc(c.id, autoDesc(c.name, ts, logs, taskCalc, false)));
      L.push("");
    });
    L.push("Production - Subcontractor Crews:"); L.push("");
    crews.filter(c=>c.type==="sub").forEach(c=>{
      const ts=dayTasks(c.id); if(!ts.length && !eosMeta.descs[c.id+"_"+day]) return;
      L.push(c.name);
      L.push("Description:");
      L.push(crewDesc(c.id, autoDesc(c.name, ts, logs, taskCalc, true)));
      L.push("");
    });
    L.push("—");
    L.push("Preliminary end-of-shift figures based on field counts at time of send; quantities subject to survey verification and final reconciliation.");
    return L.join("\n");
  },[wk,day,crews,weekTasks,logs,eosMeta,truckLine]);

  const active = crews.filter(c=>dayTasks(c.id).length>0);
  return (
    <Modal close={close} w={720}>
      <div className="crewhead">
        <h3 style={{margin:0}}>End of Shift — {longDate(addDays(wk,day))}</h3>
        <select value={day} onChange={e=>setDay(+e.target.value)}>{DAYS.map((x,i)=><option key={x} value={i}>{x} {dLabel(wk,i)}</option>)}</select>
      </div>
      <div className="eosgrid">
        <label>Safety<input value={eosMeta.safety} onChange={e=>setEosMeta(m=>({...m,safety:e.target.value}))}/></label>
        <label>Quality<input value={eosMeta.quality} onChange={e=>setEosMeta(m=>({...m,quality:e.target.value}))}/></label>
        <label className="full">Weather<input value={eosMeta.weather} onChange={e=>setEosMeta(m=>({...m,weather:e.target.value}))}/></label>
        {active.map(c=>
          <label key={c.id} className="full">{c.name} — description
            <textarea rows={2} placeholder="Auto-generated from the board — type to override"
              value={eosMeta.descs[c.id+"_"+day]??""}
              onChange={e=>setEosMeta(m=>({...m,descs:{...m.descs,[c.id+"_"+day]:e.target.value}}))}/>
          </label>)}
        <label className="full">Send to<input value={eosMeta.to} onChange={e=>setEosMeta(m=>({...m,to:e.target.value}))}/></label>
      </div>
      <pre className="eosprev">{text}</pre>
      <div className="btnrow">
        <button className="cta" onClick={()=>{navigator.clipboard?.writeText(text); setCopied(true); setTimeout(()=>setCopied(false),1500);}}>{copied?"Copied ✓":"Copy summary"}</button>
        <a className="btn ghost" href={`mailto:${encodeURIComponent(eosMeta.to)}?subject=${encodeURIComponent(`2124013 DPS 01 Watershed - EOS - ${addDays(wk,day).slice(5).replace("-",".")}.${addDays(wk,day).slice(0,4)}`)}&body=${encodeURIComponent(text)}`}>Open in email</a>
        <span className="sp"/><em className="dim2">Cost data is deliberately excluded.</em>

  );
}

/* ============ COMMAND CENTER (Earned-Value) ============ */
function evTone(v){ return v>=1 ? "good" : v>=0.9 ? "warn" : "bad"; }
function Tile({label,value,sub,tone,big}){
  return <div className={"evtile"+(big?" big":"")+(tone?" "+tone:"")}>
    <label>{label}</label><b>{value}</b>{sub!=null&&<span>{sub}</span>}
  </div>;
}
function SCurve({data}){
  const [hi,setHi]=useState(null);
  const n=data.length;
  if(n===0) return <div className="empty">No production logged yet — the burn-up curve builds as crews report quantities.</div>;
  const W=820,H=300,padL=52,padR=16,padT=16,padB=34;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxY=Math.max(1,...data.map(d=>Math.max(d.pv,d.ev,d.ac)));
  const X=i=> n===1? padL+iw/2 : padL+i*iw/(n-1);
  const Y=v=> padT+(1-v/maxY)*ih;
  const path=key=>data.map((d,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(d[key]).toFixed(1)).join(" ");
  const area=key=>path(key)+` L ${X(n-1).toFixed(1)} ${Y(0).toFixed(1)} L ${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(maxY*f));
  const H0=hi==null?null:data[hi];
  return (
    <div className="scurve">
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet"
        onMouseLeave={()=>setHi(null)}
        onMouseMove={e=>{ const r=e.currentTarget.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W;
          let best=0,bd=1e9; for(let i=0;i<n;i++){const d=Math.abs(X(i)-x); if(d<bd){bd=d;best=i;}} setHi(best); }}>
        {ticks.map((t,i)=><g key={i}>
          <line x1={padL} x2={W-padR} y1={Y(t)} y2={Y(t)} className="grid"/>
          <text x={padL-8} y={Y(t)+4} className="axt" textAnchor="end">{fmtN(t)}</text>
        </g>)}
        <path d={area("ev")} className="ar ev"/>
        <path d={path("pv")} className="ln pv"/>
        <path d={path("ac")} className="ln ac"/>
        <path d={path("ev")} className="ln ev"/>
        {["pv","ac","ev"].map(k=>data.map((d,i)=><circle key={k+i} cx={X(i)} cy={Y(d[k])} r={n===1?4.5:3} className={"pt "+k}/>))}
        {data.map((d,i)=>(i%Math.ceil(n/8||1)===0||i===n-1)&&<text key={i} x={X(i)} y={H-12} className="axt" textAnchor="middle">{d.label}</text>)}
        {hi!=null&&<g>
          <line x1={X(hi)} x2={X(hi)} y1={padT} y2={padT+ih} className="guide"/>
          <circle cx={X(hi)} cy={Y(H0.pv)} r="3.5" className="dot pv"/>
          <circle cx={X(hi)} cy={Y(H0.ev)} r="3.5" className="dot ev"/>
          <circle cx={X(hi)} cy={Y(H0.ac)} r="3.5" className="dot ac"/>
        </g>}
      </svg>
      <div className="sclegend">
        <span><i className="pv"/>Planned {H0&&"· "+fmtN(H0.pv)}</span>
        <span><i className="ev"/>Earned {H0&&"· "+fmtN(H0.ev)}</span>
        <span><i className="ac"/>Actual {H0&&"· "+fmtN(H0.ac)}</span>
        <span className="scwk">{H0? H0.label : "cumulative man-hours"}</span>
      </div>
    </div>
  );
}
function CommandCenter({crews,tasks,logs,notes,taskCalc,fcst,installedFor,wk,setWk,setTab,setModal}){
  const [scope,setScope]=useState("week"); // leaderboard scope: week | season

  const ev = useMemo(()=>{
    let PV=0,EV=0,AC=0;
    tasks.forEach(t=>{ const c=taskCalc(t); PV+=c.planMH; EV+=c.earnMH; AC+=c.actMH; });
    let BACmh=0,BAC$=0;
    CATALOG.forEach(r=>{ const est=r[CI.EST]||0; BACmh+=est*r[CI.MH]; BAC$+=est*unitCost(r); });
    const CPI=AC>0?EV/AC:0, SPI=PV>0?EV/PV:0;
    const EACmh=CPI>0?BACmh/CPI:BACmh, EAC$=CPI>0?BAC$/CPI:BAC$;
    return { PV,EV,AC, CPI,SPI, CV:EV-AC, SV:EV-PV, BACmh,BAC$, EACmh, VACmh:BACmh-EACmh, VAC$:BAC$-EAC$, pctC:BACmh>0?EV/BACmh:0 };
  },[tasks,logs]);

  const curve = useMemo(()=>{
    const set=[...new Set(tasks.map(t=>t.wk))].sort();
    let pv=0,ev=0,ac=0;
    return set.map(w=>{
      tasks.filter(t=>t.wk===w).forEach(t=>{const c=taskCalc(t); pv+=c.planMH; ev+=c.earnMH; ac+=c.actMH;});
      return { label:w.slice(5).replace("-","/"), pv,ev,ac };
    });
  },[tasks,logs]);

  const board = useMemo(()=>{
    const src = scope==="week" ? tasks.filter(t=>t.wk===wk) : tasks;
    return crews.map(c=>{
      let p=0,a=0,e=0;
      src.filter(t=>t.res===c.id).forEach(t=>{const x=taskCalc(t); p+=x.planMH; a+=x.actMH; e+=x.earnMH;});
      return {c,p,a,e,pf:a>0?e/a:0};
    }).filter(r=>r.p>0||r.a>0).sort((x,y)=>y.pf-x.pf);
  },[crews,tasks,logs,scope,wk]);

  const alerts = useMemo(()=>{
    const out=[];
    const cis=[...new Set(tasks.map(t=>t.ci))];
    cis.forEach(ci=>{
      const it=CATALOG[ci], f=fcst(ci), est=it[CI.EST]||0, inst=installedFor(ci);
      if(f.drift>0.03*Math.max(1,unitCost(it)) && f.drift>0.5)
        out.push({sev:2,tag:"COST",text:`${it[CI.TASK].slice(0,42)} forecasting ${fmt$(f.uc,2)}/${it[CI.UM]} — ${fmt$(f.drift,2)} over budget UC.`,go:()=>setTab("catalog")});
      if(est>0 && inst>est)
        out.push({sev:1,tag:"QTY",text:`${it[CI.TASK].slice(0,42)} installed ${fmtN(inst)} of ${fmtN(est)} ${it[CI.UM]} — over budget qty.`,go:()=>setTab("catalog")});
    });
    tasks.filter(t=>t.wk===wk&&logs[t.id]).forEach(t=>{
      const c=taskCalc(t); if(t.qty>0 && c.actQty/t.qty<0.9)
        out.push({sev:1,tag:"PROD",text:`${(crews.find(x=>x.id===t.res)?.name||"?")}: ${c.it[CI.TASK].slice(0,34)} at ${pct(c.actQty/t.qty)} of plan.`,go:()=>setTab("board")});
    });
    board.forEach(r=>{ if(r.a>0 && r.pf<0.9) out.push({sev:1,tag:"PF",text:`${r.c.name} PF ${r.pf.toFixed(2)} — below target.`,go:()=>setTab("board")}); });
    notes.filter(n=>n.level!=="info").forEach(n=>
      out.push({sev:n.level==="crit"?2:1,tag:n.level==="crit"?"CRIT":"NOTE",text:n.text,go:()=>setTab("board")}));
    return out.sort((a,b)=>b.sev-a.sev).slice(0,14);
  },[tasks,logs,notes,wk,board]);

  const cpiTxt=ev.CPI?ev.CPI.toFixed(2):"—", spiTxt=ev.SPI?ev.SPI.toFixed(2):"—";
  return (
    <div className="page cc">
      <div className="cchead">
        <div><h2>Command Center</h2><p className="dim2">Earned-value performance across the job — live from field-reported quantities.</p></div>
        <div className="ccpct"><b>{pct(ev.pctC)}</b><label>Job earned</label></div>
      </div>

      <div className="evgrid">
        <Tile big label="CPI · Cost performance" value={cpiTxt} tone={ev.CPI?evTone(ev.CPI):""} sub={ev.CPI?(ev.CPI>=1?"Under budget on labor":"Over budget on labor"):"awaiting data"}/>
        <Tile big label="SPI · Schedule performance" value={spiTxt} tone={ev.SPI?evTone(ev.SPI):""} sub={ev.SPI?(ev.SPI>=1?"Ahead of plan":"Behind plan"):"awaiting data"}/>
        <Tile label="Earned MH (EV)" value={fmtN(ev.EV)} sub={"of "+fmtN(ev.BACmh)+" budget"}/>
        <Tile label="Actual MH (AC)" value={fmtN(ev.AC)} sub={"planned "+fmtN(ev.PV)}/>
        <Tile label="Cost var (CV)" value={fmtN(ev.CV)+" MH"} tone={ev.CV>=0?"good":"bad"} sub={ev.CV>=0?"earned ≥ spent":"spent > earned"}/>
        <Tile label="Schedule var (SV)" value={fmtN(ev.SV)+" MH"} tone={ev.SV>=0?"good":"bad"} sub={ev.SV>=0?"ahead":"behind"}/>
        <Tile label="EAC · Forecast MH" value={fmtN(ev.EACmh)} tone={ev.EACmh<=ev.BACmh?"good":"bad"} sub={"budget "+fmtN(ev.BACmh)}/>
        <Tile label="VAC · Forecast $" value={fmt$(ev.VAC$)} tone={ev.VAC$>=0?"good":"bad"} sub={ev.VAC$>=0?"projected savings":"projected overrun"}/>
      </div>

      <div className="ccrow">
        <div className="panel cc-curve">
          <div className="ph">Burn-up — planned vs earned vs actual (MH)</div>
          <SCurve data={curve}/>
        </div>
        <div className="panel cc-alerts">
          <div className="ph">Attention feed <em className="dim2">— {alerts.length}</em></div>
          <div className="alerts">
            {alerts.length? alerts.map((a,i)=>
              <button key={i} className={"alert sev"+a.sev} onClick={a.go}>
                <span className="atag">{a.tag}</span><span className="atx">{a.text}</span>
              </button>)
              : <div className="empty">All clear — no items need attention.</div>}
          </div>
        </div>
      </div>

    </div>
  );
}

/* ============ TRENDS ============ */
function Trends({crews,tasks,logs,taskCalc,wk}){
  const weeks = useMemo(()=>{
    const set=[...new Set(tasks.map(t=>t.wk))].sort();
    return set.map(w=>{
      const rows = crews.map(c=>{
        let p=0,a=0,e=0;
        tasks.filter(t=>t.wk===w&&t.res===c.id).forEach(t=>{const x=taskCalc(t); p+=x.planMH; a+=x.actMH; e+=x.earnMH;});
        return {c,p,a,e,pf:a>0?e/a:0};
      }).filter(r=>r.p>0||r.a>0);
      return {w,rows};
    });
  },[crews,tasks,logs]);
  return (
    <div className="page">
      <h2>Productivity trends</h2>
      {weeks.map(({w,rows})=>
        <div key={w} className="panel">
          <div className="ph">{wkTitle(w)}{w===wk?" · current":""}</div>
          <table className="dt list">
            <thead><tr><th>Crew</th><th className="r">Plan MH</th><th className="r">Actual MH</th><th className="r">Earned MH</th><th className="r">PF</th><th style={{width:"34%"}}>Earned vs actual</th></tr></thead>
            <tbody>{rows.map(r=>
              <tr key={r.c.id}>
                <td>{r.c.name}{r.c.type==="sub"?" (sub)":""}</td>
                <td className="r">{fmtN(r.p)}</td><td className="r">{fmtN(r.a)}</td><td className="r">{fmtN(r.e)}</td>
                <td className={"r "+(r.pf>=1?"pos":r.pf>0?"neg":"")}>{r.pf?r.pf.toFixed(2):"—"}</td>
                <td><div className="tbar"><i style={{width:Math.min(100,(r.a? r.e/Math.max(r.a,r.e):0)*100)+"%"}}/><u style={{width:Math.min(100,(r.e? r.a/Math.max(r.a,r.e):0)*100)+"%"}}/></div></td>
              </tr>)}
            </tbody>
          </table>
        </div>)}
      <p className="dim2">Weeks accumulate as you schedule and log — use ‹ › on the board to plan ahead; history stays here.</p>
    </div>
  );
}

/* Report presets choose a default set of columns; every column is individually
   toggleable afterwards. Columns reuse the same live calcs as the rest of the app
   (taskCalc / fcst / installedFor / unitCost). Suffixes: (wk)=this week per task,
   (td)=item to-date from logged data (live CTC), (item)=whole pay item / budget. */
function PrintModal({crews,weekTasks,tasks,logs,notes,siteRows,taskCalc,installedFor,fcst,cfg,umOverrides,wk,close}){
  const REPORTS = {
    quantities:{label:"Quantities — plan vs actual", cols:["day","crew","pay","desc","loc","planq","actq","qvar","pct"]},
    cost:{label:"Cost — budget vs actual vs forecast", cols:["day","crew","pay","desc","buduc","fuc","actd","budi","cvar","fac"]},
    field:{label:"Field — installed vs plan", cols:["day","crew","pay","desc","loc","planq","actq","pct","planmh","actmh"]},
  };
  const [report,setReport]=useState("quantities");
  const [sel,setSel]=useState(()=>new Set(REPORTS.quantities.cols));
  const [inclCrews,setInclCrews]=useState(true);
  const [inclSubs,setInclSubs]=useState(true);
  const [inclNotes,setInclNotes]=useState(true);
  const pick = r => { setReport(r); setSel(new Set(REPORTS[r].cols)); };
  const toggle = k => setSel(s=>{ const n=new Set(s); n.has(k)?n.delete(k):n.add(k); return n; });

  // item-to-date aggregates from all logged work (matches fcst's live-CTC basis)
  const tdMap = useMemo(()=>{
    const m={};
    tasks.forEach(t=>{ const l=logs[t.id]; if(l){ (m[t.ci]=m[t.ci]||{qty:0,mh:0}); m[t.ci].qty+=l.qty||0; m[t.ci].mh+=l.mh||0; } });
    Object.keys(m).forEach(ci=>{ const it=CATALOG[ci]; m[ci].actCost = m[ci].mh*cfg.laborRate + m[ci].qty*(it[CI.UM$]+it[CI.UT]); });
    return m;
  },[tasks,logs,cfg]);

  const COLS = [
    {k:"day",   label:"Day",              get:r=>DAYS[r.t.day]},
    {k:"crew",  label:"Crew / Sub",       get:r=>r.crew},
    {k:"phase", label:"Phase Code",       get:r=>r.it[CI.CC]},
    {k:"loc",   label:"Location",         get:r=>r.sta},
    {k:"pay",   label:"Pay Item",         get:r=>r.it[CI.PAY]},
    {k:"desc",  label:"Description",      get:r=>r.it[CI.TASK]},
    {k:"planq", label:"Plan Qty (wk)",  n:1, get:r=>fmtN(r.t.qty)+" "+r.um},
    {k:"actq",  label:"Actual Qty (wk)",n:1, get:r=>r.lg?fmtN(r.c.actQty):"—"},
    {k:"qvar",  label:"Qty Var",        n:1, get:r=>r.lg?fmtN(r.c.actQty-r.t.qty):"—"},
    {k:"rem",   label:"Remaining (task)",n:1, get:r=>fmtN((r.it[CI.EST]||0)-installedFor(r.ci))},
    {k:"pct",   label:"%",              n:1, get:r=>r.lg&&r.t.qty?pct(r.c.actQty/r.t.qty):"—"},
    {k:"planmh",label:"Plan MH (wk)",   n:1, get:r=>fmtN(r.c.planMH)},
    {k:"actmh", label:"Actual MH (wk)", n:1, get:r=>r.lg?fmtN(r.c.actMH):"—"},
    {k:"pf",    label:"PF",             n:1, get:r=>r.c.actMH?(r.c.earnMH/r.c.actMH).toFixed(2):"—"},
    {k:"buduc", label:"Budget UC",      n:1, get:r=>fmt$(unitCost(r.it),2)},
    {k:"fuc",   label:"Fcst UC",        n:1, get:r=>fmt$(r.f.uc,2)},
    {k:"aucd",  label:"Actual UC (td)", n:1, get:r=>r.td.qty?fmt$(r.td.actCost/r.td.qty,2):"—"},
    {k:"budi",  label:"Budget $ (item)",n:1, get:r=>fmt$(unitCost(r.it)*(r.it[CI.EST]||0))},
    {k:"actd",  label:"Actual $ (td)",  n:1, get:r=>(r.td.qty||r.td.mh)?fmt$(r.td.actCost):"—"},
    {k:"earnp", label:"Earned Pay (td)",n:1, get:r=>fmt$(r.td.qty*r.it[CI.BID])},
    {k:"fac",   label:"FAC",            n:1, get:r=>fmt$(r.fac)},
    {k:"cvar",  label:"Cost Var",       n:1, get:r=>fmt$(unitCost(r.it)*(r.it[CI.EST]||0)-r.fac)},
  ];

  const rows = weekTasks.slice().sort((a,b)=>a.day-b.day).map(t=>{
    const c=taskCalc(t), it=c.it, ci=t.ci, cr=crews.find(x=>x.id===t.res);
    const f=fcst(ci), td=tdMap[ci]||{qty:0,mh:0,actCost:0};
    return { t, c, it, ci, lg:logs[t.id], crew:cr?.name||"?", ctype:cr?.type||"crew",
      um:umOverrides[ci] ?? it[CI.UM],
      sta:t.sta?`${fmtN(t.sta[0],2)}–${fmtN(t.sta[1],2)}`:"—",
      f, td, fac:f.uc*(it[CI.EST]||0) };
  }).filter(r=> (r.ctype==="crew"&&inclCrews) || (r.ctype==="sub"&&inclSubs));

  const active = COLS.filter(c=>sel.has(c.k));
  const rowName = id => (siteRows.find(s=>s.id===id)||crews.find(c=>c.id===id)||{}).name || "";
  const noteList = inclNotes ? notes.slice().sort((a,b)=>a.day-b.day) : [];

  return (
    <Modal close={close} w={860}>
      <div className="prcfg no-print">
        <div className="crewhead"><h3 style={{margin:0}}>Print / export to PDF — {wkTitle(wk)}</h3></div>
        <div className="repbtns">
          {Object.entries(REPORTS).map(([k,v])=>
            <button key={k} className={report===k?"on":""} onClick={()=>pick(k)}>{v.label}</button>)}
        </div>
        <div className="colhdr">Columns</div>
        <div className="colgrid">
          {COLS.map(c=>
            <label key={c.k}><input type="checkbox" checked={sel.has(c.k)} onChange={()=>toggle(c.k)}/>{c.label}</label>)}
        </div>
        <div className="rowtoggles">
          <label><input type="checkbox" checked={inclCrews} onChange={e=>setInclCrews(e.target.checked)}/>Crews</label>
          <label><input type="checkbox" checked={inclSubs} onChange={e=>setInclSubs(e.target.checked)}/>Subcontractors</label>
          <label><input type="checkbox" checked={inclNotes} onChange={e=>setInclNotes(e.target.checked)}/>Notes / deliveries</label>
        </div>
        <p className="dim2" style={{fontSize:12,margin:"10px 0 0"}}>Report covers the week on screen. Qty/MH = this week; UC / FAC / earned = item to-date (live CTC). Save as PDF from the browser dialog (landscape).</p>
        <div className="btnrow">
          <button className="cta" onClick={()=>window.print()}>Generate &amp; print</button>
          <button className="ghost" onClick={close}>Cancel</button>
        </div>
      </div>

      <div className="printarea">
        <div className="ptitle">DPW547 · Job 2124013 — Look-Ahead · {wkTitle(wk)} · {REPORTS[report].label}</div>
        <table className="dt list">
          <thead><tr>{active.map(c=><th key={c.k} className={c.n?"r":""}>{c.label}</th>)}</tr></thead>
          <tbody>{rows.length? rows.map(r=>
            <tr key={r.t.id}>{active.map(c=><td key={c.k} className={c.n?"r":""}>{c.get(r)}</td>)}</tr>)
            : <tr><td colSpan={Math.max(1,active.length)} className="empty">No matching tasks scheduled this week.</td></tr>}
          </tbody>
        </table>
        {inclNotes && noteList.length>0 && <>
          <div className="ptitle" style={{marginTop:16}}>Notes &amp; Deliveries</div>
          <table className="dt list">
            <thead><tr><th>Day</th><th>Where</th><th>Note</th></tr></thead>
            <tbody>{noteList.map(n=>
              <tr key={n.id}><td>{DAYS[n.day]}</td><td>{rowName(n.row)}</td><td>{n.text}</td></tr>)}
            </tbody>
          </table>
        </>}
      </div>
    </Modal>
  );
}

function DataModal({cfg,setCfg,ctc,setCtc,close}){
  const F=(k,label,step=1)=><label>{label}<input type="number" step={step} value={cfg[k]} onChange={e=>setCfg(c=>({...c,[k]:+e.target.value||0}))}/></label>;
  const [msg,setMsg]=useState("");
  const nCtc=Object.keys(ctc||{}).length;
  const num=x=>{const n=parseFloat(x); return isFinite(n)?Math.round(n*100)/100:null;};
  const doExport=()=>{
    const blob=new Blob([JSON.stringify({version:"ctc-v1",exportedAt:new Date().toISOString(),cfg,ctc},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="watershed_board_data.json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  };
  const ensureXLSX=()=>new Promise((res,rej)=>{ if(window.XLSX) return res(window.XLSX);
    const el=document.createElement("script"); el.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    el.onload=()=>res(window.XLSX); el.onerror=()=>rej(new Error("could not load the spreadsheet reader (offline?) — import a .json instead")); document.head.appendChild(el); });
  const parseWB=(XLSX,buf)=>{ const wb=XLSX.read(buf,{type:"array"}); const ws=wb.Sheets["CTC by Cost Code"]||wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1}); const out={};
    for(let i=4;i<rows.length;i++){ const r=rows[i]||[]; const code=(r[0]==null?"":(""+r[0])).trim(); if(!/^\d/.test(code)) continue;
      out[code.replace(/-/g,".")]={u:(r[2]==null?"":(""+r[2]).trim()),cq:num(r[4]),bq:num(r[7]),rq:num(r[13]),up:num(r[3]),bd:num(r[8]),cd:num(r[9]),gp:num(r[11])}; }
    return out; };
  const onFile=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return; setMsg("Reading "+f.name+"…");
    try{
      if(/\.json$/i.test(f.name)){ const j=JSON.parse(await f.text()); const map=j.ctc||j;
        if(typeof map!=="object"||Array.isArray(map)) throw new Error("unrecognized JSON shape");
        setCtc(map); if(j.cfg) setCfg(c=>({...c,...j.cfg})); setMsg("Imported "+Object.keys(map).length+" CTC codes from JSON."); }
      else if(/\.xlsx$/i.test(f.name)){ const XLSX=await ensureXLSX(); const map=parseWB(XLSX,await f.arrayBuffer());
        if(!Object.keys(map).length) throw new Error("no phase-code rows on 'CTC by Cost Code'"); setCtc(map);
        setMsg("Imported "+Object.keys(map).length+" CTC codes from "+f.name+"."); }
      else setMsg("Unsupported file — use the CTC .xlsx export or a .json.");
    }catch(err){ setMsg("Import failed: "+err.message); }
    e.target.value="";
  };
  return (
    <Modal close={close} w={480}>
      <h3>Data & assumptions</h3>
      <div className="logrow">{F("crewSize","Crew size")}{F("shiftHrs","Shift hours")}</div>
      <div className="logrow">{F("laborRate","Labor $/MH")}{F("truckRate","Trucking $/load")}</div>
      <div className="loghdr">CTC dataset — {nCtc} cost codes (billed vs forecast)</div>
      <p className="dim2">Import next month's <b>CTC by Cost Code</b> export (.xlsx) to refresh billed-to-date &amp; forecast quantities across the whole board, or a previously exported .json. Export saves the current dataset + assumptions.</p>
      <div className="btnrow">
        <label className="btn cta" style={{cursor:"pointer"}}>Import CTC / JSON<input type="file" accept=".xlsx,.json" onChange={onFile} style={{display:"none"}}/></label>
        <button className="btn" onClick={doExport}>Export data</button>
      </div>
      {msg && <p className="dim2" style={{marginTop:8}}>{msg}</p>}
      <div className="btnrow"><button className="cta" onClick={close}>Done</button></div>
    </Modal>
  );
}
function CheatSheetModal({wk,weekTasks,taskCalc,crews,cfg,close}){
  const [copied,setCopied]=useState(false);
  const TON_PER_CY=1.35; // rough aggregate density for tonnage estimate
  const groups = useMemo(()=>{
    const g={};
    weekTasks.forEach(t=>{ const c=taskCalc(t); const k=t.ci;
      (g[k]||(g[k]={it:c.it, qty:0, loads:0, days:new Set(), crews:new Set()}));
      g[k].qty+=t.qty; g[k].loads+=c.loads; g[k].days.add(t.day);
      const cr=crews.find(x=>x.id===t.res); if(cr) g[k].crews.add(cr.name);
    });
    return Object.values(g).map(x=>{
      const pay=x.it[CI.PAY], cd=CD_CYT[pay];
      const cyt = (cd && cd.um===x.it[CI.UM]) ? x.qty*cd.cytU : 0; // only when estimate UM matches scheduled UM
      const isPipe = x.it[CI.UM]==="LF" && /pipe|hppp|pvc|dip|rcpa|liner/i.test(x.it[CI.TASK]);
      return {...x, pay, um:x.it[CI.UM], desc:x.it[CI.TASK], cyt, isPipe};
    }).sort((a,b)=> (b.isPipe-a.isPipe) || b.cyt-a.cyt);
  },[weekTasks,cfg]);

  const tot = groups.reduce((a,g)=>{ a.cyt+=g.cyt; a.loads+=g.loads; if(g.isPipe)a.pipe+=g.qty; return a; },{cyt:0,loads:0,pipe:0});
  const truckDays = Math.ceil(tot.loads/6);
  const pipeItems = groups.filter(g=>g.isPipe);
  const aggItems  = groups.filter(g=>g.cyt>0);

  const text = useMemo(()=>{
    const L=[`WATERSHED LOOK-AHEAD — MATERIALS & TRUCKING CHEAT SHEET`, wkTitle(wk), "", "PIPE / STRUCTURES TO STAGE:"];
    (pipeItems.length?pipeItems:[{desc:"— none scheduled",qty:0,um:""}]).forEach(g=>L.push(`  • ${fmtN(g.qty)} ${g.um}  ${g.desc}`));
    L.push("", "AGGREGATE / HAUL:");
    aggItems.forEach(g=>L.push(`  • ${g.desc}: ${fmtN(g.qty)} ${g.um} → ~${fmtN(g.cyt)} CYT haul`));
    L.push("", `TOTAL PIPE: ${fmtN(tot.pipe)} LF`,
      `TRUCKING: ~${fmtN(tot.loads)} loads  =  ${truckDays} truck-day(s) @ 6 loads/day`,
      `AGGREGATE (estimate takeoff, matched haul items): ~${fmtN(tot.cyt)} CYT  (~${fmtN(tot.cyt*TON_PER_CY)} tons)`,
      "", "Compare against yard inventory before ordering; book trucks to the peak day.");
    return L.join("\n");
  },[groups]);

  return (
    <Modal close={close} w={640}>
      <div className="crewhead"><h3 style={{margin:0}}>Week cheat sheet — {wkTitle(wk)}</h3></div>
      <p className="dim2">Foreman reference for the week on screen — pipe &amp; materials to stage, and trucking to book. Loads/truck-days from live trucking rates (all items); aggregate CYT from the estimate takeoff (haul items where the unit matches).</p>
      <div className="kpis" style={{padding:"4px 0 10px"}}>
        <div className="kpi"><label>Pipe</label><b>{fmtN(tot.pipe)} LF</b></div>
        <div className="kpi"><label>Loads</label><b>{fmtN(tot.loads)}</b></div>
        <div className="kpi"><label>Truck-days</label><b>{truckDays}</b></div>
        <div className="kpi"><label>Aggregate</label><b>{fmtN(tot.cyt)} CYT</b></div>
      </div>
      <div className="loghdr">Pipe &amp; structures to stage</div>
      <table className="dt list"><thead><tr><th>Item</th><th className="r">Scheduled</th><th>Crew</th></tr></thead>
        <tbody>{pipeItems.length? pipeItems.map((g,i)=><tr key={i}><td>{g.desc.slice(0,46)}</td><td className="r">{fmtN(g.qty)} {g.um}</td><td className="dim2">{[...g.crews].join(", ")}</td></tr>)
          : <tr><td colSpan={3} className="empty">No pipe scheduled this week.</td></tr>}</tbody></table>
      <div className="loghdr">Aggregate &amp; haul</div>
      <table className="dt list"><thead><tr><th>Item</th><th className="r">Scheduled</th><th className="r">Haul CYT</th><th className="r">Loads</th></tr></thead>
        <tbody>{aggItems.length? aggItems.map((g,i)=><tr key={i}><td>{g.desc.slice(0,40)}</td><td className="r">{fmtN(g.qty)} {g.um}</td><td className="r">{fmtN(g.cyt)}</td><td className="r">{fmtN(g.loads)}</td></tr>)
          : <tr><td colSpan={4} className="empty">No haul-driving items scheduled.</td></tr>}</tbody></table>
      <div className="btnrow">
        <button className="cta" onClick={()=>{navigator.clipboard?.writeText(text); setCopied(true); setTimeout(()=>setCopied(false),1500);}}>{copied?"Copied ✓":"Copy cheat sheet"}</button>
        <span className="sp"/><em className="dim2">Estimate-based planning figures — verify against inventory.</em>
      </div>
    </Modal>
  );
}
function Modal({children,close,w=520}){
  return (
    <div className="ovl" onMouseDown={e=>{if(e.target===e.currentTarget) close();}}>
      <div className="modal" style={{maxWidth:w}} role="dialog">
        <button className="x" onClick={close} aria-label="Close">✕</button>
        {children}
      </div>
    </div>
  );
}

.printarea .dt th,.printarea .dt td{border-color:#ddd;color:#111}
.printarea .dt th{color:#555}
.ptitle{font:700 15px "Saira Condensed";margin-bottom:6px}
.repbtns{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
.repbtns button{background:var(--pn2);border:1px solid var(--ln);color:var(--dm);border-radius:9px;padding:8px 14px;font:600 14px "Saira Condensed";letter-spacing:.03em;cursor:pointer}
.repbtns button.on{border-color:var(--acc);color:var(--acc)}
.colhdr{font-family:"Saira Condensed";font-weight:700;color:var(--dm);text-transform:uppercase;letter-spacing:.1em;font-size:12px;margin:2px 0 6px}
.colgrid{columns:2;column-gap:28px;margin-bottom:8px}
.colgrid label{display:flex;gap:9px;align-items:center;break-inside:avoid;padding:4px 0;font:15px "Saira Condensed";color:var(--tx);text-transform:none;letter-spacing:0;cursor:pointer}
.colgrid input,.rowtoggles input{width:16px;height:16px;accent-color:var(--acc);cursor:pointer;flex:none}
.rowtoggles{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--ln);padding-top:12px;margin-top:6px}
.rowtoggles label{display:flex;gap:8px;align-items:center;font:15px "Saira Condensed";color:var(--tx);cursor:pointer}

/* ===== Command Center ===== */
.cc{max-width:1280px}
.cchead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.cchead h2{margin:0;font-size:30px;text-transform:uppercase;letter-spacing:.04em}
.cchead p{margin:2px 0 0}
.ccpct{text-align:right;line-height:1}
.ccpct b{font:800 40px "Saira Condensed";color:var(--lime);display:block}
.la-root[data-theme="light"] .ccpct b{color:var(--brand)}
@media (prefers-color-scheme: light){.la-root[data-theme="system"] .ccpct b{color:var(--brand)}}
.ccpct label{color:var(--dm);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.evgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.evtile{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.evtile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dm2)}
.evtile.good:before{background:var(--good)} .evtile.warn:before{background:var(--lime)} .evtile.bad:before{background:var(--bad)}
.evtile label{display:block;color:var(--dm);font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.evtile b{display:block;font:600 26px "IBM Plex Mono";margin-top:4px;color:var(--tx)}
.evtile.big b{font-size:40px;line-height:1}
.evtile.good b{color:var(--good)} .evtile.warn b{color:var(--lime)} .evtile.bad b{color:var(--bad)}
.la-root[data-theme="light"] .evtile.warn b{color:var(--warn)}
@media (prefers-color-scheme: light){.la-root[data-theme="system"] .evtile.warn b{color:var(--warn)}}
.evtile span{display:block;color:var(--dm2);font-size:11.5px;margin-top:3px;font-family:"Montserrat"}
.evtile.big{grid-column:span 2}
.ccrow{display:grid;grid-template-columns:1.7fr 1fr;gap:12px;margin-bottom:14px}
.cc-curve,.cc-alerts{margin-bottom:0}
.scurve svg{width:100%;height:auto;display:block}
.scurve .grid{stroke:var(--ln);stroke-width:1;opacity:.55}
.scurve .axt{fill:var(--dm2);font:11px "IBM Plex Mono"}
.scurve .guide{stroke:var(--dm);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.scurve .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.scurve .ln.pv{stroke:var(--dm2);stroke-dasharray:5 4;stroke-width:2}
.scurve .ln.ev{stroke:var(--brand)}
.scurve .ln.ac{stroke:var(--lime)}
.la-root[data-theme="light"] .scurve .ln.ac{stroke:#a08a00}
.scurve .ar.ev{fill:var(--brand);opacity:.10;stroke:none}
.scurve .dot{stroke:var(--pn);stroke-width:2}
.scurve .dot.pv{fill:var(--dm2)} .scurve .dot.ev{fill:var(--brand)} .scurve .dot.ac{fill:var(--lime)}
.scurve .pt.pv{fill:var(--dm2)} .scurve .pt.ev{fill:var(--brand)} .scurve .pt.ac{fill:var(--lime)}
.la-root[data-theme="light"] .scurve .pt.ac{fill:#a08a00}
.sclegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;color:var(--dm);font-size:12px;font-weight:600}
.sclegend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.sclegend i.pv{background:var(--dm2)} .sclegend i.ev{background:var(--brand)} .sclegend i.ac{background:var(--lime)}
.sclegend .scwk{margin-left:auto;color:var(--dm2);text-transform:uppercase;letter-spacing:.08em}
.alerts{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.alert{display:flex;gap:9px;align-items:flex-start;text-align:left;background:var(--pn2);border:1px solid var(--ln);border-left-width:3px;border-radius:9px;padding:8px 10px;color:var(--tx);cursor:pointer;font-family:"Montserrat"}
.alert:hover{border-color:var(--dm2)}
.alert.sev2{border-left-color:var(--bad)} .alert.sev1{border-left-color:var(--lime)} .alert.sev0{border-left-color:var(--brand)}
.atag{font:700 10px "Saira Condensed";letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--pn);color:var(--dm);flex:none;margin-top:1px}
.alert.sev2 .atag{background:var(--bad);color:#fff} .alert.sev1 .atag{background:var(--lime);color:#111314}
.atx{font-size:12.5px;line-height:1.35}
.lbhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qmode.sm button{padding:3px 10px;font-size:12px}
.lboard{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.lbcard{display:flex;align-items:center;gap:12px;background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.lbcard .rank{font:800 22px "Saira Condensed";width:30px;text-align:center;color:var(--dm2)}
.lbcard.good .rank{color:var(--good)} .lbcard.warn .rank{color:var(--lime)} .lbcard.bad .rank{color:var(--bad)}
.lbmain{flex:1;min-width:0}
.lbmain b{display:block;font-size:17px}
.lbbar{flex:1.2;height:8px;background:var(--bg);border:1px solid var(--ln);border-radius:5px;overflow:hidden;min-width:60px}
.lbbar i{display:block;height:100%;background:var(--dm2)}
.lbcard.good .lbbar i{background:var(--good)} .lbcard.warn .lbbar i{background:var(--lime)} .lbcard.bad .lbbar i{background:var(--bad)}
.lbpf{text-align:right;min-width:78px}
.lbpf b{font:600 18px "IBM Plex Mono"}
.lbpf span{display:block;color:var(--dm2);font-size:10.5px;font-family:"IBM Plex Mono"}
@media(max-width:900px){.evgrid{grid-template-columns:repeat(2,1fr)}.evtile.big{grid-column:span 2}.ccrow{grid-template-columns:1fr}.lboard{grid-template-columns:1fr}}

/* ===== switch toggle + equipment rows ===== */
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--tx);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch i{width:34px;height:19px;border-radius:20px;background:var(--pn2);border:1px solid var(--ln);position:relative;transition:background .15s,border-color .15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dm);transition:transform .15s,background .15s}
.switch input:checked + i{background:var(--brand);border-color:var(--brand)}
.switch input:checked + i:after{transform:translateX(15px);background:#fff}
.switch input:focus-visible + i{outline:2px solid var(--lime);outline-offset:2px}
.eqrow td{border-bottom:1px solid var(--cellln);background:color-mix(in srgb,var(--pn) 55%,transparent)}
.eqlabel{font:700 10px "Saira Condensed";letter-spacing:.12em;text-transform:uppercase;color:var(--dm2);vertical-align:middle}
.eqwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 4px}
.eqchip{display:inline-flex;align-items:center;gap:6px;background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:3px 6px 3px 8px}
.eqchip .eqdot{width:8px;height:8px;border-radius:2px;background:var(--brand);flex:none}
.eqchip.rental .eqdot{background:var(--lime)}
.eqname{background:none;border:0;color:var(--tx);font:600 12.5px "Montserrat";width:120px;padding:2px}
.eqname:focus{outline:none;border-bottom:1px solid var(--acc)}
.eqhrs{width:48px;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:3px 5px;font:12px "IBM Plex Mono";text-align:right}
.eqhrs:focus{outline:none;border-color:var(--acc)}
.eqchip .equ{color:var(--dm2);font-size:10.5px;font-family:"IBM Plex Mono"}
.eqx{background:none;border:0;color:var(--dm2);cursor:pointer;font-size:11px;padding:2px 3px}
.eqx:hover{color:var(--bad)}
.eqadd{background:transparent;border:1px dashed var(--ln);color:var(--dm);border-radius:8px;padding:3px 10px;font:600 12px "Saira Condensed";letter-spacing:.04em;cursor:pointer}
.eqadd:hover{color:var(--brand);border-color:var(--brand)}
.eqadd.rental:hover{color:var(--lime);border-color:var(--lime)}

/* ===== mobile day-view board ===== */
.mboard{padding:0 12px 40px}
.mdaynav{display:flex;align-items:stretch;gap:6px;background:var(--bg);padding:6px 0 10px;border-bottom:1px solid var(--ln);margin-bottom:4px}
.mdaystep{background:var(--pn2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;min-width:38px;font-size:18px;cursor:pointer}
.mdaystep:disabled{opacity:.35}
.mdays{display:flex;gap:6px;overflow-x:auto;flex:1;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.mday{scroll-snap-align:center;flex:0 0 auto;min-width:52px;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:6px 4px;color:var(--dm);text-align:center;cursor:pointer;line-height:1.1}
.mday span{display:block;font:700 11px "Saira Condensed";letter-spacing:.06em}
.mday b{display:block;font:600 16px "IBM Plex Mono";color:var(--tx)}
.mday.on{background:var(--brand);border-color:var(--brand)}
.mday.on span,.mday.on b{color:#fff}
.mday.today:not(.on) b{color:var(--brand)}
.mday.wknd:not(.on){opacity:.7}
.msec{font:700 11px "Saira Condensed";letter-spacing:.14em;text-transform:uppercase;color:var(--dm2);margin:16px 0 8px}
.mcrew{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.mcrewhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mlog{background:transparent;border:1px dashed var(--ln);color:var(--brand);border-radius:9px;padding:6px 12px;font:600 13px "Saira Condensed";letter-spacing:.04em;cursor:pointer;min-height:38px}
.mempty{color:var(--dm2);font-size:13px;padding:6px 2px}
.mcrew .card{margin-bottom:6px}
.meq{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--cellln)}
.meqlbl{font:700 10px "Saira Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--dm2);width:100%}

/* ===== responsive (phones/tablets ≤760px) ===== */
@media (max-width:760px){
 .top{gap:10px;padding:10px 12px 8px}
 .brandlogo{height:22px}
 .proj{font-size:12.5px;max-width:220px}
 .proj em{display:none}
 .tabs{order:3;width:100%;overflow-x:auto;border-radius:10px}
 .tabs button{flex:1 0 auto;white-space:nowrap;min-height:40px}
 .weeknav{order:2;margin-left:0;width:100%;justify-content:space-between}
 .weeknav span{min-width:0;flex:1;font-size:15px}
 .weeknav button,.actions button,.btn{min-height:40px}
 .actions{order:4;width:100%;flex-wrap:wrap}
 .actions button{flex:1 1 auto}
 .kpis{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 12px 6px;-webkit-overflow-scrolling:touch}
 .kpi{flex:0 0 auto;scroll-snap-align:start}
 .legend{padding:8px 12px;gap:10px}
 .page{padding:14px 12px}
 .cc{max-width:100%}
 .cchead{flex-direction:column;align-items:flex-start;gap:8px}
 .cchead h2{font-size:24px}
 .ccpct{text-align:left}
 .evgrid{grid-template-columns:1fr 1fr;gap:8px}
 .evtile.big{grid-column:span 2}
 .evtile b{font-size:22px} .evtile.big b{font-size:32px}
 .ccrow{grid-template-columns:1fr}
 .lboard{grid-template-columns:1fr}
 .page h2{font-size:22px}
 /* modals become bottom sheets */
 .ovl{padding:0;align-items:flex-end}
 .modal{max-width:100%!important;width:100%;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
 .logrow{flex-direction:column;gap:8px}
 .eosgrid{grid-template-columns:1fr}
 .colgrid{columns:1}
 .btnrow{flex-wrap:wrap}
 /* 16px form controls prevent iOS zoom-on-focus */
 .logrow input,.logrow select,.eosgrid input,.eosgrid textarea,.modal textarea,.search,.namein{font-size:16px}
 .card{padding:8px 10px}
 .chip{min-height:34px}
}
@media (max-width:420px){
 .evgrid{grid-template-columns:1fr}
 .evtile.big{grid-column:span 1}
}

@media print{
 body *{visibility:hidden} .ovl,.ovl *{visibility:visible}
 .ovl{position:absolute;inset:0;background:#fff;padding:0}
 .modal{box-shadow:none;border:0;max-width:100%!important;background:#fff;color:#111}
 .modal .x,.btnrow,.crewhead select,.crewhead .cta,.prcfg{display:none!important}
 .prcfg,.prcfg *{visibility:hidden}
 .printarea{max-height:none;overflow:visible}
}
`;

const b = document.getElementById('boot'); if(b) b.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<LookAhead/>);

/* Offline PWA — register the service worker over https/localhost (skip file://). */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
