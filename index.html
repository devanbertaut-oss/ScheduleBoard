function DataModal({cfg,setCfg,ctc,setCtc,close}){
  const F=(k,label,step=1)=><label>{label}<input type="number" step={step} value={cfg[k]} onChange={e=>setCfg(c=>({...c,[k]:+e.target.value||0}))}/></label>;
  const [msg,setMsg]=useState("");
  const nCtc=Object.keys(ctc||{}).length;
  const nLaborCtc=Object.keys(ctc||{}).filter(isLaborCode).length;
  const nOverhead=nCtc-nLaborCtc;
  const num=x=>{const n=parseFloat(x); return isFinite(n)?Math.round(n*100)/100:null;};
  const doExport=()=>{
    const blob=new Blob([JSON.stringify({version:"ctc-v1",exportedAt:new Date().toISOString(),cfg,ctc},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="watershed_board_data.json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  };
  const ensureXLSX=()=>new Promise((res,rej)=>{ if(window.XLSX) return res(window.XLSX);
    const el=document.createElement("script"); el.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    el.onload=()=>res(window.XLSX); el.onerror=()=>rej(new Error("could not load the spreadsheet reader (offline?) — import a .json instead")); document.head.appendChild(el); });
  const parseWB=(XLSX,buf)=>{ const wb=XLSX.read(buf,{type:"array"}); const ws=wb.Sheets["CTC by Cost Code"]||wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1}); const out={};
    for(let i=4;i<rows.length;i++){ const r=rows[i]||[]; const code=(r[0]==null?"":(""+r[0])).trim(); if(!/^\d/.test(code)) continue;
      out[code.replace(/-/g,".")]={u:(r[2]==null?"":(""+r[2]).trim()),cq:num(r[4]),bq:num(r[7]),rq:num(r[13]),up:num(r[3]),bd:num(r[8]),cd:num(r[9]),gp:num(r[11])}; }
    return out; };
  const onFile=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return; setMsg("Reading "+f.name+"…");
    try{
      if(/\.json$/i.test(f.name)){ const j=JSON.parse(await f.text()); const map=j.ctc||j;
        if(typeof map!=="object"||Array.isArray(map)) throw new Error("unrecognized JSON shape");
        setCtc(map); if(j.cfg) setCfg(c=>({...c,...j.cfg})); setMsg("Imported "+Object.keys(map).length+" CTC codes from JSON."); }
      else if(/\.xlsx$/i.test(f.name)){ const XLSX=await ensureXLSX(); const map=parseWB(XLSX,await f.arrayBuffer());
        if(!Object.keys(map).length) throw new Error("no phase-code rows on 'CTC by Cost Code'"); setCtc(map);
        setMsg("Imported "+Object.keys(map).length+" CTC codes from "+f.name+"."); }
      else setMsg("Unsupported file — use the CTC .xlsx export or a .json.");
    }catch(err){ setMsg("Import failed: "+err.message); }
    e.target.value="";
  };
  return (
    <Modal close={close} w={480}>
      <h3>Data & assumptions</h3>
      <div className="logrow">{F("crewSize","Crew size")}{F("shiftHrs","Shift hours")}</div>
      <div className="logrow">{F("laborRate","Labor $/MH")}{F("truckRate","Trucking $/load")}</div>
      <div className="loghdr">CTC dataset — {nLaborCtc} labor cost codes{nOverhead>0?` · ${nOverhead} non-labor filtered`:""}</div>
      <p className="dim2">Import next month's <b>CTC by Cost Code</b> export (.xlsx) to refresh billed-to-date &amp; forecast quantities across the whole board, or a previously exported .json. Export saves the current dataset + assumptions. Non-labor codes — leave/holiday (50.50.x), misc/overhead (99.x), fuel &amp; consumables, sales tax — are filtered from production tracking; the <b>Catalog / CTC</b> tab's <b>Labor codes only</b> switch controls this.</p>
      <div className="btnrow">
        <label className="btn cta" style={{cursor:"pointer"}}>Import CTC / JSON<input type="file" accept=".xlsx,.json" onChange={onFile} style={{display:"none"}}/></label>
        <button className="btn" onClick={doExport}>Export data</button>
      </div>
      {msg && <p className="dim2" style={{marginTop:8}}>{msg}</p>}
      <div className="btnrow"><button className="cta" onClick={close}>Done</button></div>
    </Modal>
  );
}
function CheatSheetModal({wk,weekTasks,taskCalc,crews,cfg,close}){
  const [copied,setCopied]=useState(false);
  const TON_PER_CY=1.35; // rough aggregate density for tonnage estimate
  const groups = useMemo(()=>{
    const g={};
    weekTasks.forEach(t=>{ const c=taskCalc(t); const k=t.ci;
      (g[k]||(g[k]={it:c.it, qty:0, loads:0, days:new Set(), crews:new Set()}));
      g[k].qty+=t.qty; g[k].loads+=c.loads; g[k].days.add(t.day);
      const cr=crews.find(x=>x.id===t.res); if(cr) g[k].crews.add(cr.name);
    });
    return Object.values(g).map(x=>{
      const pay=x.it[CI.PAY], cd=CD_CYT[pay];
      const cyt = (cd && cd.um===x.it[CI.UM]) ? x.qty*cd.cytU : 0; // only when estimate UM matches scheduled UM
      const isPipe = x.it[CI.UM]==="LF" && /pipe|hppp|pvc|dip|rcpa|liner/i.test(x.it[CI.TASK]);
      const bed = bedForItem(x.it[CI.CC], x.it[CI.TASK], x.it[CI.UM]); // SWB-spec bedding takeoff
      const bedCy = bed ? x.qty*bed.cyPer : 0, bedTon = bed ? x.qty*bed.tonPer : 0;
      return {...x, pay, um:x.it[CI.UM], desc:x.it[CI.TASK], cyt, isPipe, bed, bedCy, bedTon};
    }).sort((a,b)=> (b.isPipe-a.isPipe) || b.cyt-a.cyt);
  },[weekTasks,cfg]);

  const STONE_TON_LOAD = 16; // legal tri-axle stone load
  const tot = groups.reduce((a,g)=>{ a.cyt+=g.cyt; a.loads+=g.loads; a.bedCy+=g.bedCy; a.bedTon+=g.bedTon; if(g.isPipe)a.pipe+=g.qty; return a; },{cyt:0,loads:0,pipe:0,bedCy:0,bedTon:0});
  const bedLoads = tot.bedTon/STONE_TON_LOAD;
  const truckDays = Math.ceil((tot.loads+bedLoads)/6);
  const pipeItems = groups.filter(g=>g.isPipe);
  const aggItems  = groups.filter(g=>g.cyt>0);
  const bedItems  = groups.filter(g=>g.bedCy>0);

  const text = useMemo(()=>{
    const L=[`WATERSHED LOOK-AHEAD — MATERIALS & TRUCKING CHEAT SHEET`, wkTitle(wk), "", "PIPE / STRUCTURES TO STAGE:"];
    (pipeItems.length?pipeItems:[{desc:"— none scheduled",qty:0,um:""}]).forEach(g=>L.push(`  • ${fmtN(g.qty)} ${g.um}  ${g.desc}`));
    L.push("", "BEDDING & EMBEDMENT (#610 crushed stone, per SWB drawings):");
    (bedItems.length?bedItems:[{desc:"— none scheduled",bedCy:0,bedTon:0,bed:{spec:""}}]).forEach(g=>L.push(`  • ${g.desc.slice(0,42)}: ${fmtN(g.qty)} ${g.um} → ${fmtN(g.bedCy,1)} CY (${fmtN(g.bedTon,1)} tn) [${g.bed?g.bed.spec:""}]`));
    L.push("", "AGGREGATE / HAUL:");
    aggItems.forEach(g=>L.push(`  • ${g.desc}: ${fmtN(g.qty)} ${g.um} → ~${fmtN(g.cyt)} CYT haul`));
    L.push("", `TOTAL PIPE: ${fmtN(tot.pipe)} LF`,
      `BEDDING STONE: ${fmtN(tot.bedCy,1)} CY  (~${fmtN(tot.bedTon)} tons ≈ ${fmtN(bedLoads,1)} loads)`,
      `TRUCKING: ~${fmtN(tot.loads+bedLoads)} loads  =  ${truckDays} truck-day(s) @ 6 loads/day`,
      `AGGREGATE (estimate takeoff, matched haul items): ~${fmtN(tot.cyt)} CYT  (~${fmtN(tot.cyt*TON_PER_CY)} tons)`,
      "", "Compare against yard inventory before ordering; book trucks to the peak day.");
    return L.join("\n");
  },[groups]);

  return (
    <Modal close={close} w={640}>
      <div className="crewhead"><h3 style={{margin:0}}>Week cheat sheet — {wkTitle(wk)}</h3></div>
      <p className="dim2">Foreman reference for the week on screen — pipe &amp; materials to stage, and trucking to book. Bedding stone (#610) is computed from the governing SWB standard drawings (arch pipe D-3933, round RCP D-3810, HPPP embedment, structure bases) by trench width × bedding depth × scheduled quantity, and rolled into the truck-day count. Aggregate CYT from the estimate takeoff (haul items where the unit matches).</p>
      <div className="kpis" style={{padding:"4px 0 10px"}}>
        <div className="kpi"><label>Pipe</label><b>{fmtN(tot.pipe)} LF</b></div>
        <div className="kpi"><label>Loads</label><b>{fmtN(tot.loads)}</b></div>
        <div className="kpi"><label>Bedding stone</label><b>{fmtN(tot.bedTon)} tn</b></div>
        <div className="kpi"><label>Truck-days</label><b>{truckDays}</b></div>
        <div className="kpi"><label>Aggregate</label><b>{fmtN(tot.cyt)} CYT</b></div>
      </div>
      <div className="loghdr">Pipe &amp; structures to stage</div>
      <table className="dt list"><thead><tr><th>Item</th><th className="r">Scheduled</th><th>Crew</th></tr></thead>

          : <tr><td colSpan={4} className="empty">No haul-driving items scheduled.</td></tr>}</tbody></table>
      <div className="btnrow">
        <button className="cta" onClick={()=>{navigator.clipboard?.writeText(text); setCopied(true); setTimeout(()=>setCopied(false),1500);}}>{copied?"Copied ✓":"Copy cheat sheet"}</button>
        <span className="sp"/><em className="dim2">Estimate-based planning figures — verify against inventory.</em>
      </div>
    </Modal>
  );
}
function TruckingView({truckDay,setTruckDay,savings,setSavings}){
  const today = new Date().toISOString().slice(0,10);
  const day = truckDay.date===today ? truckDay : {date:today,trucks:[],loads:[]};
  const upDay = fn => setTruckDay(d=>fn(d.date===today?{...d}:{date:today,trucks:[],loads:[]}));
  const pitKeys = Object.keys(TRUCK_BASE.pits);

  // ===== Fleet balancer =====
  const [cyc,setCyc]=useState(TRUCK_BASE.minLoad);
  const [loadT,setLoadT]=useState(6);
  const [have,setHave]=useState(3);
  const [tRate,setTRate]=useState(105);
  const [idle,setIdle]=useState(240);
  const need = Math.max(1, Math.ceil((+cyc + +loadT)/Math.max(1,+loadT)));
  const scen = n => { const C=+cyc,L=+loadT,R=+tRate,I=+idle;
    const arriv=(C+L)/n, exUtil=Math.min(1,L/arriv);
    const lph=Math.min(n*60/(C+L), 60/L);
    const truckCost=n*R, crewIdle=I*(1-exUtil);
    const truckUtil=Math.min(1,need/n), truckIdle=R*n*(1-truckUtil);
    const total=truckCost+crewIdle;
    return {n,lph,exUtil,truckCost,crewIdle,truckIdle,total,perLoad:lph>0?total/lph:1e9}; };
  const scens=[]; for(let n=Math.max(1,need-2);n<=need+2;n++) scens.push(scen(n));
  const best=scens.reduce((a,b)=>b.perLoad<a.perLoad?b:a,scens[0]);
  const haveN=Math.max(1,+have||1), haveS=scen(haveN);
  const tgt=best.n;
  const gap = haveN<tgt ? ("Under-trucked — excavator idles ~"+fmt$(haveS.crewIdle)+"/hr. Add "+(tgt-haveN)+" truck"+(tgt-haveN>1?"s":"")+" (cost-optimal "+tgt+").")
            : haveN>tgt ? ("Over-trucked — ~"+fmt$(haveS.truckIdle)+"/hr of trucks waiting. Drop "+(haveN-tgt)+" (cost-optimal "+tgt+").")
            : "Balanced at "+tgt+" trucks — lowest $/load.";

  // ===== Sign-out / staging optimizer =====
  const matKeys=Object.keys(TRUCK_BASE.rates).filter(k=>typeof TRUCK_BASE.rates[k]==="object");
  const [mat,setMat]=useState("Sand");
  const [pit,setPit]=useState(pitKeys[0]);
  const [bed,setBed]=useState(18);
  const [loads,setLoads]=useState(1);
  const [rt,setRt]=useState(TRUCK_BASE.pits[pitKeys[0]]);
  const [hRate,setHRate]=useState(105);
  const mr=TRUCK_BASE.rates[mat]||{r:8.5,u:"CY"};
  const hold=(+rt/60)*(+hRate)*(+loads);
  const byload = mr.u==="CY" ? (+loads)*(+bed)*mr.r : (+loads)*(+bed)*1.4*mr.r;
  const cheaper = hold<=byload ? "hold" : "byload";
  const save=Math.abs(hold-byload);

  // ===== Bedding quick-calc (SWB spec) =====
  const bedFams={"Arch pipe (D-3933)":{tbl:ARCH_BED,arch:true},"Round RCP (D-3810)":{tbl:RCP_BED},"HPPP (embedment)":{tbl:HPPP_SPEC,hppp:true}};
  const [bfam,setBfam]=useState("Arch pipe (D-3933)");
  const [bsz,setBsz]=useState(42);
  const [blf,setBlf]=useState(100);
  const bfamO=bedFams[bfam];
  const bszKeys=Object.keys(bfamO.tbl).map(Number).sort((a,b)=>a-b);
  const bs=bfamO.tbl[bsz]||bfamO.tbl[bszKeys[0]];
  const bCyLf = bfamO.hppp ? (bs.tw*(bs.bed+bs.od)-Math.PI*bs.od*bs.od/4)/144/27 : bs.tw*bs.bed/27;
  const bTwFt = bfamO.hppp ? bs.tw/12 : bs.tw;
  const bTot=(+blf||0)*bCyLf, bTon=bTot*STONE_TON_PER_CY, bLoads=bTon/16;

  // ===== Live tracker =====
  const addTruck=()=>upDay(d=>({...d,trucks:[...d.trucks,{id:"3C",mode:"hourly",inT:new Date().toTimeString().slice(0,5)}]}));
  const upTruck=(i,k,v)=>upDay(d=>({...d,trucks:d.trucks.map((t,j)=>j===i?{...t,[k]:v}:t)}));
  const rmTruck=i=>upDay(d=>({...d,trucks:d.trucks.filter((_,j)=>j!==i)}));
  const addLoad=()=>upDay(d=>({...d,loads:[...d.loads,{truck:(d.trucks[0]&&d.trucks[0].id)||"",material:"Sand",pit:pitKeys[0],qty:1,time:new Date().toTimeString().slice(0,5)}]}));
  const upLoad=(i,k,v)=>upDay(d=>({...d,loads:d.loads.map((t,j)=>j===i?{...t,[k]:v}:t)}));
  const rmLoad=i=>upDay(d=>({...d,loads:d.loads.filter((_,j)=>j!==i)}));
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const inMins=day.trucks.map(t=>{const p=(t.inT||"").split(":");return p.length===2?(+p[0]*60+ +p[1]):NaN;}).filter(x=>!isNaN(x));
  const firstIn=inMins.length?Math.min(...inMins):null;
  const elapsedHr=firstIn!=null?Math.max(0.1,(nowMin-firstIn)/60):0;
  const totLoads=day.loads.reduce((a,l)=>a+(+l.qty||0),0);
  const lphNow=elapsedHr>0?totLoads/elapsedHr:0;
  const hourlyN=day.trucks.filter(t=>t.mode==="hourly").length;
  const runCost=hourlyN*elapsedHr*105;
  const truckHrs = day.trucks.reduce((a,t)=>{ const q=(t.inT||"").split(":"); if(q.length!==2) return a; const mins=nowMin-(+q[0]*60+ +q[1]); return a+(mins>0?mins/60:0); },0);
  const obsCycle = (totLoads>0 && truckHrs>0) ? Math.round(60/(totLoads/truckHrs)) : null;
  const lphTone = !lphNow?"":lphNow>=TRUCK_BASE.loadsHr?"good":lphNow>=TRUCK_BASE.loadsHr*0.8?"warn":"bad";

  const num=(v,set,w=64,step=1)=><input type="number" step={step} value={v} onChange={e=>set(e.target.value)} style={{width:w}}/>;

  return (
    <div className="page trk">
      <div className="cchead"><div><h2>Trucking</h2><p className="dim2">Cycle-time baselines, live load tracking, and the fleet-balance / sign-out optimizer — keep the excavator fed without paying trucks to sit.</p></div></div>

      {/* Bedding quick-calc */}
      <div className="panel">
        <div className="ph">Bedding stone (#610) — SWB standard drawings</div>

          <label>Pipe family
            <select value={bfam} onChange={e=>{setBfam(e.target.value); const ks=Object.keys(bedFams[e.target.value].tbl).map(Number); if(!ks.includes(bsz)) setBsz(ks[Math.floor(ks.length/2)]);}}>
              {Object.keys(bedFams).map(k=><option key={k}>{k}</option>)}</select></label>
          <label>Size (in){" "}
            <select value={bsz} onChange={e=>setBsz(+e.target.value)}>{bszKeys.map(k=><option key={k} value={k}>{k}"{bfamO.arch&&bfamO.tbl[k].od?` (${bfamO.tbl[k].od})`:""}</option>)}</select></label>
          <label>Length (LF){num(blf,setBlf)}</label>
        </div>
        <table className="dt list">
          <thead><tr><th>Trench width</th><th className="r">Stone CY/LF</th><th className="r">Total CY</th><th className="r">Tons</th><th className="r">≈ Loads</th></tr></thead>
          <tbody><tr><td>{fmtN(bTwFt,2)} ft</td><td className="r">{fmtN(bCyLf,3)}</td><td className="r"><b>{fmtN(bTot,1)}</b></td><td className="r"><b>{fmtN(bTon,1)}</b></td><td className="r">{fmtN(bLoads,1)}</td></tr></tbody>
        </table>
        <p className="dim2" style={{margin:"6px 2px 0"}}>Bedding = compacted #610 crushed stone below the pipe; backfill above is pumped sand (owner-pumped). Stone loads ≈ 16 tn tri-axle. Falls back to these specs whenever a plan sheet doesn't define the trench.</p>
      </div>

      {/* Fleet balancer */}
      <div className="panel">
        <div className="ph">Fleet balancer — trucks to keep one excavator working</div>
        <div className="trkrow">
          <label>Round-trip cycle (min){num(cyc,setCyc)}</label>
          <label>Load + spot (min){num(loadT,setLoadT)}</label>
          <label>Truck $/hr{num(tRate,setTRate)}</label>
          <label>Crew idle $/hr{num(idle,setIdle)}</label>
          <label>Trucks you have{num(have,setHave)}</label>
          {obsCycle && <button className="ghost sm" style={{alignSelf:"flex-end"}} onClick={()=>setCyc(obsCycle)} title="Set the round-trip cycle from the loads logged below">Use today's actual: {obsCycle}m</button>}
        </div>
        <table className="dt list">
          <thead><tr><th>Trucks</th><th className="r">Loads/hr</th><th className="r">Excavator util</th><th className="r">Truck $/hr</th><th className="r">Crew-idle $/hr</th><th className="r">$/load</th><th/></tr></thead>
          <tbody>{scens.map(x=>{
            const isBest=x.n===best.n, isNeed=x.n===need, isHave=x.n===haveN;
            return <tr key={x.n} className={isBest?"trkbest":""}>
              <td><b>{x.n}</b>{isNeed?" ◄ match":""}{isHave?" (you)":""}</td>
              <td className="r">{fmtN(x.lph,1)}</td>
              <td className={"r "+(x.exUtil>=.98?"pos":x.exUtil<.85?"neg":"")}>{pct(x.exUtil)}</td>
              <td className="r">{fmt$(x.truckCost)}</td>
              <td className={"r "+(x.crewIdle>1?"neg":"")}>{x.crewIdle>1?fmt$(x.crewIdle):"—"}</td>
              <td className="r"><b>{fmt$(x.perLoad)}</b></td>
              <td>{isBest?<span className="cstat on">optimal</span>:""}</td>
            </tr>;})}
          </tbody>
        </table>
        <p className={"trkcall "+(haveN===tgt?"ok":"warn")}>{gap} <em className="dim2">Optimal ≈ {best.n} trucks at {fmt$(best.perLoad)}/load.</em></p>
      </div>

      {/* Sign-out / staging optimizer */}
      <div className="panel">
        <div className="ph">Sign-out &amp; staging — hourly hold vs by-load delivery</div>
        <div className="trkrow">
          <label>Material<select value={mat} onChange={e=>setMat(e.target.value)}>{matKeys.map(k=><option key={k}>{k}</option>)}</select></label>
          <label>Source pit<select value={pit} onChange={e=>{setPit(e.target.value); setRt(TRUCK_BASE.pits[e.target.value]);}}>{pitKeys.map(k=><option key={k}>{k}</option>)}</select></label>
          <label>Bed (CY){num(bed,setBed)}</label>
          <label>Loads{num(loads,setLoads)}</label>
          <label>Round-trip (min){num(rt,setRt)}</label>
          <label>Hourly $/hr{num(hRate,setHRate)}</label>

          </div>
          <div className={"trkopt"+(cheaper==="byload"?" win":"")}>
            <label>By-load delivery</label><b>{fmt$(byload)}</b>
            <span>order a 6:30 delivery ({loads} × {bed} {mr.u} × {fmt$(mr.r,2)}{mr.u==="TN"?" @1.4 t/CY":""})</span>
          </div>
        </div>
        <p className="trkcall ok"><b>{cheaper==="hold"?"Hold the hourly truck":"Order the by-load delivery"}</b> — saves {fmt$(save)} in trucking. Staging aggregate by-load for later days also frees your hourly trucks for haul-out (no excavator wait). Material cost is the same either way.</p>
        <div className="btnrow"><button className="cta" disabled={save<=0} onClick={()=>setSavings&&setSavings(v=>[...(v||[]),{id:"s"+Math.random().toString(36).slice(2,7),date:new Date().toISOString().slice(0,10),amount:Math.round(save),note:(cheaper==="hold"?"Held hourly truck":"By-load delivery")+" — "+mat}])}>Log {fmt$(save)} saved</button><span className="sp"/><em className="dim2">Feeds the &ldquo;$ saved this week&rdquo; ticker on Command.</em></div>
      </div>

      {/* Live daily tracker */}
      <div className="panel">
        <div className="ph lbhead">Today&rsquo;s trucks &amp; loads <em className="dim2">— {day.date}</em>
          <div className="kpis" style={{padding:0,gap:8}}>
            <div className="kpi"><label>Loads</label><b>{fmtN(totLoads)}</b></div>
            <div className="kpi"><label>Loads/hr</label><b className={lphTone}>{lphNow?fmtN(lphNow,1):"—"}</b></div>
            <div className="kpi"><label>Hourly $</label><b>{fmt$(runCost)}</b></div>

          <input type="time" value={t.inT} onChange={e=>upTruck(i,"inT",e.target.value)}/>
          <span className="dim2">in</span><button className="eqx" onClick={()=>rmTruck(i)}>✕</button>
        </div>)}
        <div className="trksub">Loads delivered <button className="ghost sm" onClick={addLoad} disabled={!day.trucks.length}>+ load</button></div>
        {day.loads.map((l,i)=><div className="trkline" key={i}>
          <select value={l.truck} onChange={e=>upLoad(i,"truck",e.target.value)}>{day.trucks.map((t,j)=><option key={j} value={t.id}>{t.id}</option>)}</select>
          <select value={l.material} onChange={e=>upLoad(i,"material",e.target.value)}>{matKeys.map(k=><option key={k}>{k}</option>)}</select>
          <select value={l.pit} onChange={e=>upLoad(i,"pit",e.target.value)}>{pitKeys.map(k=><option key={k}>{k}</option>)}</select>
          <input type="number" value={l.qty} onChange={e=>upLoad(i,"qty",e.target.value)} style={{width:56}}/>
          <input type="time" value={l.time} onChange={e=>upLoad(i,"time",e.target.value)}/>
          <button className="eqx" onClick={()=>rmLoad(i)}>✕</button>
        </div>)}
        {!day.loads.length && <div className="rlempty">No loads logged yet.</div>}
      </div>

      {/* Baselines reference */}
      <div className="panel">
        <div className="ph">Cycle-time baselines <em className="dim2">— from DPW547 timesheet history</em></div>
        <div className="trkrow">
          <div className="kpi"><label>Overall cycle</label><b>{TRUCK_BASE.minLoad} min/load</b></div>
          <div className="kpi"><label>Loads/hr</label><b>{TRUCK_BASE.loadsHr}</b></div>
          <div className="kpi"><label>Range</label><b>{TRUCK_BASE.minLoadLo}–{TRUCK_BASE.minLoadHi} min</b></div>
        </div>
        <p className="dim2" style={{fontSize:12}}>Per-pit round-trips (field estimates — edit in the optimizer): {pitKeys.map(k=>k+" "+TRUCK_BASE.pits[k]+"m").join(" · ")}. Rates: triaxle {fmt$(105)}/hr, quad {fmt$(120)}/hr; sand {fmt$(8.5,2)}/CY, dirt {fmt$(10,2)}/CY, limestone {fmt$(7.5,2)}/TN.</p>
      </div>
    </div>
  );
}
function celebrate(msg){
  try{
    const layer=document.createElement("div"); layer.className="confetti";
    const cols=["#00833e","#dce442","#ffffff","#2fbf6b"];
    for(let i=0;i<52;i++){ const c=document.createElement("i"); c.style.left=(Math.random()*100)+"%"; c.style.background=cols[i%4]; c.style.animationDelay=(Math.random()*0.35)+"s"; c.style.setProperty("--r",(Math.random()*360)+"deg"); layer.appendChild(c); }
    document.body.appendChild(layer);
    const t=document.createElement("div"); t.className="toast"; t.textContent="🎉 "+msg; document.body.appendChild(t);

  }catch(e){}
}

          {f.length===0 && <div className="empty">No match.</div>}
        </div>
      </div>
    </div>

      <div className="qlplan">Plan {fmtN(t.qty)} {it[CI.UM]} · {fmtN(t.qty*it[CI.MH])} MH{t.loc?" · "+t.loc:""}</div>
      <div className="logrow">
        <label>Actual qty ({it[CI.UM]})<input type="number" inputMode="decimal" autoFocus value={qty} onChange={e=>setQty(e.target.value)}/></label>
        <label>Manhours<input type="number" inputMode="decimal" value={mh} onChange={e=>setMh(e.target.value)}/></label>
      </div>
      <button className="qlfill" onClick={()=>{ setQty(String(t.qty)); setMh(String(fmtN(t.qty*it[CI.MH],1))); }}>Hit plan ✓</button>
      <div className="btnrow">
        <button className="cta big" onClick={()=>{saveLog(t.id,qty,mh,true); close();}}>Save — done ✓</button>
        <button className="ghost" onClick={()=>{saveLog(t.id,qty,mh,false); close();}}>In-progress</button>
      </div>
      <button className="qlmore" onClick={openFull}>Full details &amp; cost →</button>
    </Modal>
  );
}
/* Board key prompt — shown when the sync endpoint answers 401 (BOARD_KEY set on the site). */
function BoardKeyModal({close,onSet}){
  const [v,setV]=useState(syncLS.key());
  const go=()=>{ onSet(v.trim()); close(); };
  return (
    <Modal close={close} w={400}>
      <h3>Board sync key</h3>
      <p className="dim2" style={{fontSize:13,margin:"0 0 10px"}}>This board requires a key to sync (the BOARD_KEY set on the Netlify site). Enter it once — it's remembered on this device.</p>
      <input className="search" type="password" autoFocus placeholder="Board key" value={v}
        onChange={e=>setV(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") go(); }}/>
      <div className="btnrow">
        <button className="cta" onClick={go}>Save &amp; sync</button>
        <button className="ghost" onClick={close}>Cancel</button>
      </div>
    </Modal>
  );
}
function Modal({children,close,w=520}){
  return (
    <div className="ovl" onMouseDown={e=>{if(e.target===e.currentTarget) close();}}>
      <div className="modal" style={{maxWidth:w}} role="dialog">
        <button className="x" onClick={close} aria-label="Close">✕</button>
        {children}
      </div>
    </div>
  );
}

.atx{font-size:12.5px;line-height:1.35}
.lbhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qmode.sm button{padding:3px 10px;font-size:12px}
.lboard{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.lbcard{display:flex;align-items:center;gap:12px;background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.lbcard .rank{font:800 22px "Saira Condensed";width:30px;text-align:center;color:var(--dm2)}
.lbcard.good .rank{color:var(--good)} .lbcard.warn .rank{color:var(--lime)} .lbcard.bad .rank{color:var(--bad)}
.lbmain{flex:1;min-width:0}
.lbmain b{display:block;font-size:17px}
.lbbar{flex:1.2;height:8px;background:var(--bg);border:1px solid var(--ln);border-radius:5px;overflow:hidden;min-width:60px}
.lbbar i{display:block;height:100%;background:var(--dm2)}
.lbcard.good .lbbar i{background:var(--good)} .lbcard.warn .lbbar i{background:var(--lime)} .lbcard.bad .lbbar i{background:var(--bad)}
.lbpf{text-align:right;min-width:78px}
.lbpf b{font:600 18px "IBM Plex Mono"}
.lbpf span{display:block;color:var(--dm2);font-size:10.5px;font-family:"IBM Plex Mono"}
@media(max-width:900px){.evgrid{grid-template-columns:repeat(2,1fr)}.evtile.big{grid-column:span 2}.ccrow{grid-template-columns:1fr}.lboard{grid-template-columns:1fr}}

/* ===== switch toggle + equipment rows ===== */
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--tx);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch i{width:34px;height:19px;border-radius:20px;background:var(--pn2);border:1px solid var(--ln);position:relative;transition:background .15s,border-color .15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dm);transition:transform .15s,background .15s}
.switch input:checked + i{background:var(--brand);border-color:var(--brand)}
.switch input:checked + i:after{transform:translateX(15px);background:#fff}
.switch input:focus-visible + i{outline:2px solid var(--lime);outline-offset:2px}
.eqrow td{border-bottom:1px solid var(--cellln);background:color-mix(in srgb,var(--pn) 55%,transparent)}
.eqlabel{font:700 10px "Saira Condensed";letter-spacing:.12em;text-transform:uppercase;color:var(--dm2);vertical-align:middle}
.eqwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 4px}
.eqchip{display:inline-flex;align-items:center;gap:6px;background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:3px 6px 3px 8px}
.eqchip .eqdot{width:8px;height:8px;border-radius:2px;background:var(--brand);flex:none}
.eqchip.rental .eqdot{background:var(--lime)}
.eqname{background:none;border:0;color:var(--tx);font:600 12.5px "Montserrat";width:120px;padding:2px}
.eqname:focus{outline:none;border-bottom:1px solid var(--acc)}
.eqhrs{width:48px;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:3px 5px;font:12px "IBM Plex Mono";text-align:right}
.eqhrs:focus{outline:none;border-color:var(--acc)}
.eqchip .equ{color:var(--dm2);font-size:10.5px;font-family:"IBM Plex Mono"}
.eqx{background:none;border:0;color:var(--dm2);cursor:pointer;font-size:11px;padding:2px 3px}
.eqx:hover{color:var(--bad)}
.eqadd{background:transparent;border:1px dashed var(--ln);color:var(--dm);border-radius:8px;padding:3px 10px;font:600 12px "Saira Condensed";letter-spacing:.04em;cursor:pointer}
.eqadd:hover{color:var(--brand);border-color:var(--brand)}
.eqadd.rental:hover{color:var(--lime);border-color:var(--lime)}

/* ===== mobile day-view board ===== */
.mboard{padding:0 12px 40px}
.mdaynav{display:flex;align-items:stretch;gap:6px;background:var(--bg);padding:6px 0 10px;border-bottom:1px solid var(--ln);margin-bottom:4px;position:sticky;top:0;z-index:20}
.mdaystep{background:var(--pn2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;min-width:44px;font-size:20px;cursor:pointer}
.mdaystep:disabled{opacity:.35}
.mdays{display:flex;gap:6px;overflow-x:auto;flex:1;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.mday{scroll-snap-align:center;flex:0 0 auto;min-width:56px;min-height:48px;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 5px;color:var(--dm);text-align:center;cursor:pointer;line-height:1.1}
.mday span{display:block;font:700 11px "Saira Condensed";letter-spacing:.06em}
.mday b{display:block;font:600 16px "IBM Plex Mono";color:var(--tx)}
.mday.on{background:var(--brand);border-color:var(--brand)}
.mday.on span,.mday.on b{color:#fff}
.mday.today:not(.on) b{color:var(--brand)}
.mday.wknd:not(.on){opacity:.7}
.msec{font:700 11px "Saira Condensed";letter-spacing:.14em;text-transform:uppercase;color:var(--dm2);margin:16px 0 8px}
.mcrew{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.mcrewhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mlog{background:transparent;border:1px dashed var(--ln);color:var(--brand);border-radius:9px;padding:6px 12px;font:600 13px "Saira Condensed";letter-spacing:.04em;cursor:pointer;min-height:38px}
.mempty{color:var(--dm2);font-size:13px;padding:6px 2px}
.mcrew .card{margin-bottom:6px}
.meq{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--cellln)}
.meqlbl{font:700 10px "Saira Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--dm2);width:100%}

/* ===== responsive (phones/tablets ≤760px) ===== */
@media (max-width:760px){
 .top{gap:10px;padding:10px 12px 8px}
 .brandlogo{height:22px}
 .proj{font-size:12.5px;max-width:220px}
 .proj em{display:none}
 .tabs{order:3;width:100%;overflow-x:auto;border-radius:10px}
 .tabs button{flex:1 0 auto;white-space:nowrap;min-height:40px}
 .weeknav{order:2;margin-left:0;width:100%;justify-content:space-between}
 .weeknav span{min-width:0;flex:1;font-size:15px}
 .weeknav button,.actions button,.btn{min-height:40px}
 .actions{order:4;width:100%;flex-wrap:wrap}
 .actions button{flex:1 1 auto}
 .actions .syncpill{flex:0 0 auto}
 .kpis{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 12px 6px;-webkit-overflow-scrolling:touch}
 .kpi{flex:0 0 auto;scroll-snap-align:start}
 .legend{padding:8px 12px;gap:10px}
 .page{padding:14px 12px}
 .cc{max-width:100%}
 .cchead{flex-direction:column;align-items:flex-start;gap:8px}
 .cchead h2{font-size:24px}
 .ccpct{text-align:left}
 .evgrid{grid-template-columns:1fr 1fr;gap:8px}
 .evtile.big{grid-column:span 2}
 .evtile b{font-size:22px} .evtile.big b{font-size:32px}
 .ccrow{grid-template-columns:1fr}
 .lboard{grid-template-columns:1fr}
 .page h2{font-size:22px}
 /* modals become bottom sheets */
 .ovl{padding:0;align-items:flex-end}
 .modal{max-width:100%!important;width:100%;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
 .logrow{flex-direction:column;gap:8px}
 .eosgrid{grid-template-columns:1fr}
 .colgrid{columns:1}
 .btnrow{flex-wrap:wrap}
 /* 16px form controls prevent iOS zoom-on-focus */
 .logrow input,.logrow select,.eosgrid input,.eosgrid textarea,.modal textarea,.search,.namein{font-size:16px}
 .card{padding:8px 10px}
 .chip{min-height:34px}
}
@media (max-width:420px){
 .evgrid{grid-template-columns:1fr}
 .evtile.big{grid-column:span 1}
}

/* --- 4x4 card export (Print Cards) --- */
.cardsheets{display:none}                        /* body-level print copy: hidden on screen */
.cardsheets.prev{display:block;zoom:.5}          /* modal preview: zoomed to fit */
.cardprev{overflow:auto;max-height:420px;border:1px solid var(--ln);border-radius:10px;background:var(--pn2);padding:12px}
.cardpage{position:relative;background:#fff}
.cardsheets.prev .cardpage{margin:0 auto 24px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.cardsheets.prev .cardpage.pl{width:8in;min-height:10.5in}    /* letter content area @ .25in margins */
.cardsheets.prev .cardpage.pt{width:10.5in;min-height:16.5in} /* 11x17 content area */
.pgrid{position:relative;margin:0 auto;width:8in;display:grid;grid-template-columns:4in 4in}
.cut{position:absolute;background:#000;opacity:.7;pointer-events:none}
.cut.v{width:.5pt;top:0;bottom:0}
.cut.h{height:.5pt;left:0;right:0}
.pcard{width:4in;height:4in;box-sizing:border-box;padding:.2in .3in .28in;color:#000;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}/* corners · logo · body · foot(pinned) */
.pcorners{display:flex;justify-content:space-between;align-items:flex-start;min-height:.38in}
.pcv{font:600 11pt "IBM Plex Mono",monospace}
.pcv.pday{transform:rotate(-4deg);transform-origin:left top}
.pcv.pmh{transform:rotate(4deg);transform-origin:right top}
.pwm{text-align:center;margin:0 0 .22in}
.pwm img{height:.5in;width:auto;vertical-align:top}
.pbody{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.12in}
.pbody>div{display:flex;gap:.12in;align-items:baseline}
.pbody>div.pitem{flex:1}
.pbody label{font-weight:700;font-size:12.5pt;letter-spacing:.01em;flex:none}
.pbody span{font:500 10.5pt "IBM Plex Mono",monospace;flex:1;min-width:0;overflow-wrap:anywhere}
.pbody>div.psta{margin-top:-.05in}
.pbody>div.psta label{visibility:hidden}   /* hidden "Goal:" spacer aligns STA under the Goal values */
.psp{flex:1.6}
.pfoot{display:flex;padding-top:.05in}
.pfoot>div{flex:1;display:flex;gap:.12in;align-items:baseline;min-width:0}
.pfoot label{font-weight:700;font-size:12.5pt}
.pfoot span{font:500 10.5pt "IBM Plex Mono",monospace;overflow-wrap:anywhere}
/* Merged card values stack one code/goal/station per line under a single label. */
.pline{display:block;overflow-wrap:anywhere}
.pline+.pline{margin-top:.03in}
/* Merged card (same crew+day): tighten so multiple item/station lines fit the fixed 4x4 box. */
.pcard.merged .pbody{gap:.07in}
.pcard.merged .pbody label{font-size:12pt}
.pcard.merged .pbody span{font-size:10pt}
.pcard.merged .pbody>div.pitem{flex:0 1 auto}   /* cluster item+goal near the top */
.pcard.merged .psp{flex:1}                       /* one writing-space gap above the pinned foot */
/* 3 codes: only a slight step down from 2 so the extra lines fit while still filling the box. */
.pcard.n3 .pbody{gap:.05in}
.pcard.n3 .pbody label{font-size:11pt}
.pcard.n3 .pbody span{font-size:9pt}
.pcard.n3 .pline+.pline{margin-top:.03in}
.pcard.n3 .pwm{margin-bottom:.14in}
.swatchrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.swatch{border:2px solid transparent;border-radius:9px;padding:7px 12px;font:700 13px "Saira Condensed";cursor:pointer;letter-spacing:.04em}
.swatch.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--acc)}

/* --- Field tools: printable legend, quick-log, Procore snapshot header --- */
.legendgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:4px 0 12px}
.legrow{display:flex;align-items:center;gap:9px}
.legsw{flex:none;width:38px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:800 11px "Saira Condensed";letter-spacing:.04em;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.legsw.dia{width:20px;height:20px;background:var(--lime);transform:rotate(45deg);margin:0 9px}
.legname{font-size:13px}
.tenfoot{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--dm);margin-bottom:12px}
.qlhead{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.qlhead .cscope{padding:2px 6px;border-radius:4px;font:800 11px "Saira Condensed";print-color-adjust:exact}
.qlplan{font-size:12.5px;color:var(--dm);margin-bottom:10px}
.qlfill{background:var(--pn2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:6px 12px;font:700 12px "Saira Condensed";cursor:pointer;margin-bottom:10px}
.cta.big{font-size:15px;padding:12px 16px;flex:1}
.qlmore{width:100%;margin-top:10px;background:none;border:0;color:var(--dm);font:600 12.5px "Saira Condensed";cursor:pointer}
.print-only{display:none}
.boardprinthdr{padding:0 18px 8px}
.bphtitle{font:800 16px "Saira Condensed";letter-spacing:.03em;margin-bottom:4px}
.bphleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px}
.bphleg span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;print-color-adjust:exact;-webkit-print-color-adjust:exact}

@media print{
 /* MODE 1 — report / legend modal (Print / PDF, Scope legend): print the open modal */
 body:not(.print-cards):not(.board-print) *{visibility:hidden}
 body:not(.print-cards):not(.board-print) .ovl,body:not(.print-cards):not(.board-print) .ovl *{visibility:visible}
 body:not(.print-cards):not(.board-print) .ovl{position:absolute;inset:0;background:#fff;padding:0}
 .modal{box-shadow:none;border:0;max-width:100%!important;background:#fff;color:#111}
 .modal .x,.btnrow,.crewhead select,.crewhead .cta,.prcfg{display:none!important}
 .prcfg,.prcfg *{visibility:hidden}
 .printarea{max-height:none;overflow:visible}
 /* MODE 2 — card-sheet path (Print Cards): show only the body-level 4x4 sheet copy */
 body.print-cards .la-root{padding:0!important;margin:0!important;background:#fff}
 body.print-cards .la-root>*{display:none!important}
 body.print-cards .la-root>.cardsheets{display:block!important}
 .cardpage{page-break-after:always;break-after:page;margin:0 auto}
 .cardpage:last-child{page-break-after:auto;break-after:auto}
 .pcard{break-inside:avoid}
 /* MODE 3 — Procore board snapshot: print the board grid, landscape, colors kept */
 @page{size:landscape}
 body.board-print .no-print,body.board-print .ovl{display:none!important}
 body.board-print .print-only{display:block!important}
 body.board-print .la-root{background:#fff;color:#111}
 body.board-print .board,body.board-print .card,body.board-print .cscope,body.board-print .msflag,body.board-print .msdiamond{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 body.board-print .card{break-inside:avoid}
}
`;

const b = document.getElementById('boot'); if(b) b.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<LookAhead/>);

/* Offline PWA — register the service worker over https/localhost (skip file://). */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
