/* Scheduling Board SOP scope-color system — bold "readable from 10 feet" colors,
   one per real-world trade scope, each with a redundant color-blind letter code.
   Color is derived FRESH from the cost-code prefix (scopeKeyOf), not the old
   hand-assigned CI.CAT bucket (which mixed trades). "gen" is the non-SOP fallback
   for anything without a matching prefix. This is the single source of card/legend/
   catalog/print coloring; CATS/CI.CAT are kept only for seed data + overrides. */
const SCOPES = {
  drainage:{name:"Drainage",             code:"DRN", bg:"#F58A2E", tx:"#3a2205"},
  base:    {name:"Base",                 code:"BSE", bg:"#8B63E0", tx:"#ffffff"},
  water:   {name:"Water",                code:"WTR", bg:"#2F82DB", tx:"#ffffff"},
  sewer:   {name:"Sewer",                code:"SWR", bg:"#12A150", tx:"#ffffff"},
  struct:  {name:"Structural Concrete",  code:"STR", bg:"#A6CF3A", tx:"#26330a"},
  earth:   {name:"Earthwork",            code:"ERT", bg:"#A56A3C", tx:"#ffffff"},
  sub:     {name:"Subcontractor",        code:"SUB", bg:"#F0C22E", tx:"#3a2f05"},
  elec:    {name:"Electrical",           code:"ELE", bg:"#E24C4B", tx:"#ffffff"},
  survey:  {name:"Survey",               code:"SUR", bg:"#F183B7", tx:"#3d1029"},
  pile:    {name:"Pile Driving",         code:"PIL", bg:"#5FBCE0", tx:"#0e2a3a"},
  gen:     {name:"General",              code:"GEN", bg:"#c3c9d8", tx:"#1e2330"},
};
function scopeKeyOf(cc){
  const c=(cc||"").replace(/-/g,".");
  if(/^33\.40\./.test(c)) return "drainage";
  if(/^33\.10\./.test(c)) return "water";
  if(/^(33\.30|33\.43)\./.test(c)) return "sewer";
  if(/^33\.49\./.test(c)) return "struct";
  if(/^32\.07\./.test(c)) return "base";
  if(/^(31\.23|02\.45)\./.test(c)) return "earth";
  if(/^26\./.test(c)) return "elec";
  if(/^(01\.18\.34|01\.19)\./.test(c)) return "survey";
  if(/pile/i.test(cc||"")) return "pile";
  return "gen";
}
/* Subcontractor-performed work always shows Subcontractor color, regardless of trade. */
function scopeFor(cc,resId,crews){
  const res=(crews||[]).find(x=>x.id===resId);
  if(res && res.type==="sub") return "sub";
  return scopeKeyOf(cc);
}
const unitCost = it => it[CI.UL]+it[CI.UE]+it[CI.UM$]+it[CI.US]+it[CI.UT]+it[CI.UX];
/* Unit taxonomy for station-to-station takeoff. A station range yields a length in feet.
   - LF quantifies directly (run length = qty).
   - area/volume/weight pay items need extra dimensions to turn that run length into their unit.
   - everything else (EACH counts, VF vertical feet, LS, ...) is a "callout": the station is a
     location reference only and does NOT quantify the pay item — qty is entered manually.
   Width & depth are entered in feet; density in TON/CY (matches STONE_TON_PER_CY / TON_PER_CY). */
const UNIT_KIND = { LF:"lin", SY:"area", SF:"area", CY:"vol", CF:"vol", TON:"wt", TN:"wt" };
const unitKind  = um => UNIT_KIND[String(um||"").toUpperCase()] || "callout";
// Convert station length (feet) + dimensions to a quantity in the item's unit.
// Returns null when a required dimension is missing (so the UI shows "—" and blocks Add) or when
// the unit is a callout (station never sets the quantity for EACH/VF/LS/etc.).
function staGenQty(um, len, w, d, dens){
  if(len==null) return null;
  const k = unitKind(um), U = String(um||"").toUpperCase();
  if(k==="lin") return len;                                                       // LF: run length = qty
  if(k==="area"){ if(!(w>0)) return null; return len*w/(U==="SY"?9:1); }          // ft² → SY (÷9) or SF
  if(k==="vol"){  if(!(w>0&&d>0)) return null; return len*w*d/(U==="CY"?27:1); }   // ft³ → CY (÷27) or CF
  if(k==="wt"){   if(!(w>0&&d>0&&dens>0)) return null; return len*w*d/27*dens; }    // ft³ → CY → TON
  return null; // callout units: station is a location callout, not a quantity
}

const itemFor = t => {
  const base = CATALOG[t.ci];

  const it = base.slice();
  Object.keys(OV_MAP).forEach(k=>{ const v=t.ov[k]; if(v!=null && v!=="") it[OV_MAP[k]]=v; });

};

  : cfg;

const scopeOf = (t,crews) => (t && t.ov && t.ov.scope) ? t.ov.scope : scopeFor(itemFor(t)[CI.CC], t && t.res, crews);

  const fa=a.res===newRes?0:1, fb=b.res===newRes?0:1; if(fa!==fb) return fa-fb;
  const pa=a.finishWdi<=newStartWdi?0:1, pb=b.finishWdi<=newStartWdi?0:1; if(pa!==pb) return pa-pb;

const stickLen = n => /arch pipe|reinforced concrete pipe|rcp\b/i.test(n)?8 : /hppp|polypropylene|pvc/i.test(n)?20 : /ductile|di water/i.test(n)?18 : 0;
function autoDesc(name, ts, logs, calc, isSub){
  if(!ts.length) return "";
  const t=ts[0], c=calc(t), lg=logs[t.id];
  const item=c.it[CI.TASK], um=c.it[CI.UM], cat=c.it[CI.CAT];
  const q = lg? c.actQty : t.qty;
  const sta = t.sta? ` from station ${staFmt(t.sta[0])} to station ${staFmt(t.sta[1])}` : "";
  if (isSub) return `${name} continued ${item.toLowerCase()}${q?`, placing ${fmtN(q)} ${um}`:""}${sta}.`;
  const sl = stickLen(item);
  let s;
  if (cat===0 && sl && um==="LF")
    s = `${name}'s crew continued mainline drainage work, laying ${Math.max(1,Math.round(q/sl))} sticks (${fmtN(q)} LF) of ${item}${sta}.`;
  else if (cat===0)
    s = `${name}'s crew continued drainage work, installing ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===1)
    s = `${name}'s crew continued water main work, running ${fmtN(q)} ${um} of ${item}${sta} and backfilling behind the pipe.`;
  else if (cat===2)
    s = `${name}'s crew continued sewer work, laying ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===3)
    s = `${name}'s crew set ${fmtN(q)}${um==="EACH"?"":" "+um+" of"} ${item}${sta}, then backfilled around the structure.`;
  else if (cat===4)
    s = `${name}'s crew formed and poured ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===5 && /fine grad/i.test(item))
    s = `${name}'s crew fine graded the ${item.toLowerCase()} to the correct elevation.`;
  else if (cat===5 && /dump and spread|base course/i.test(item))
    s = `${name}'s crew hauled in, spread, and compacted ${fmtN(q)} ${um} of ${item.toLowerCase()}.`;
  else if (cat===5)
    s = `${name}'s crew continued earthwork, placing ${fmtN(q)} ${um} of ${item.toLowerCase()}.`;
  else
    s = `${name}'s crew worked ${item.toLowerCase()}, completing ${fmtN(q)} ${um}.`;
  // production clause
  if (lg && t.qty){
    if (c.actQty >= t.qty) s = s.replace(/\.$/, ", meeting the day's planned production.");
    else s += ` The crew finished short of the planned ${fmtN(t.qty)} ${um}.`;
  }
  // extra tasks that day
  const verbs = {0:"laid",1:"ran",2:"laid",3:"set",4:"poured",5:"placed"};
  ts.slice(1).forEach(x=>{
    const cx=calc(x), lx=logs[x.id]; const qx=lx?cx.actQty:x.qty;
    s += ` They also ${verbs[cx.it[CI.CAT]]||"placed"} ${fmtN(qx)}${cx.it[CI.UM]==="EACH"?"":" "+cx.it[CI.UM]+" of"} ${cx.it[CI.TASK].toLowerCase()}.`;
  });
  // trucking clause
  const loads = ts.reduce((a,x)=>a+calc(x).loads,0);
  if (loads>=0.5){
    const trucks=Math.max(1,Math.ceil(loads/6));
    s += ` The crew ran ${trucks} truck${trucks>1?"s":""}, moving ${Math.round(loads)} load${Math.round(loads)>1?"s":""} of material.`;
  }
  return s;
}

    setModal(null);
  };
  const addDep = (depKey,predKey)=> setDeps(d=>{ if(depKey===predKey) return d; const cur=d[depKey]||[]; return cur.includes(predKey)?d:{...d,[depKey]:[...cur,predKey]}; });
  const rmDep  = (depKey,predKey)=> setDeps(d=>{ const cur=(d[depKey]||[]).filter(p=>p!==predKey); const c={...d}; if(cur.length) c[depKey]=cur; else delete c[depKey]; return c; });
  /* Re-slice a whole run when its plan changes. edit = {end} (extend/shrink stations at constant
     rate), {perDay} or {days} (change avg production, same total). Completed (logged) days are kept
     byte-for-byte; only the open tail re-slices. The run START (min working-day) never moves — so it
     composes with the predecessor auto-reschedule pinning. Mirrors SchedModal's rounding + Fri→Mon roll. */
  const resliceRun = (t, edit) => {
    const k = runKey(t), EPS = 1e-6;
    setTasks(ts => {
      const members = ts.filter(x=>runKey(x)===k).slice().sort((a,b)=>wdi(a.wk,a.day)-wdi(b.wk,b.day));
      if(!members.length) return ts;
      const it = itemFor(members[0]), kindL = unitKind(it[CI.UM]);
      const isSta = kindL!=="callout" && members.every(m=>m.sta);
      const S0 = members[0].sta ? members[0].sta[0] : null;
      const last = members[members.length-1], Ecur = last.sta ? last.sta[1] : null;
      const dir = (Ecur!=null && S0!=null) ? (Math.sign(Ecur-S0)||1) : 0;
      const Ltot = (Ecur!=null && S0!=null) ? Math.abs(Ecur-S0) : 0;
      const Qtot = members.reduce((s,m)=>s+(+m.qty||0),0), N = members.length;
      const runStartWdi = wdi(members[0].wk, members[0].day);
      const along = x => (x-S0)*dir, staAt = a => S0 + dir*a;
      const rho = (isSta && Ltot>EPS) ? Qtot/Ltot : null;
      const stepFt = (isSta && Ltot>EPS) ? Ltot/N : null, perDayQ = Qtot/N;
      const locked = members.filter(m=>logs[m.id]!=null), open = members.filter(m=>logs[m.id]==null);
      if(!open.length) return ts;                                   // all logged → no-op
      const lockedWdis = new Set(locked.map(m=>wdi(m.wk,m.day)));
      const lockedQty = locked.reduce((s,m)=>s+(+m.qty||0),0);
      const lastLocked = locked.length ? locked.reduce((a,b)=>wdi(a.wk,a.day)>wdi(b.wk,b.day)?a:b) : null;
      const openStartSta = (lastLocked && lastLocked.sta) ? lastLocked.sta[1] : S0;
      const openStartAlong = isSta ? along(openStartSta) : 0;
      const freeSlots = count => { const out=[]; let n=runStartWdi; while(out.length<count){ if(!lockedWdis.has(n)) out.push(n); n++; } return out; };
      let nOpen, targetOpenQty, endAlong, stepA, isEnd=false;
      if(edit.end!=null && isSta && rho!=null){
        isEnd=true;
        endAlong = Math.max(along(edit.end), openStartAlong);       // never trim locked / cross start
        const openLen = endAlong - openStartAlong;
        const nFull = Math.floor(openLen/stepFt + EPS), rem = openLen - nFull*stepFt;
        nOpen = nFull + (rem>EPS?1:0);
        if(nOpen===0 && !locked.length) nOpen=1;
        if(nOpen===0) return [...ts.filter(x=>runKey(x)!==k), ...locked];  // shrank to locked only
        targetOpenQty = rho*openLen; stepA = stepFt;
      } else if(edit.perDay!=null || edit.days!=null){
        const openQty = Qtot - lockedQty;
        if(openQty<=EPS) return ts;
        if(edit.perDay!=null){ const p=+edit.perDay; if(!(p>0)) return ts; nOpen=Math.max(1,Math.ceil(openQty/p)); }
        else { const dd=Math.round(+edit.days); if(!(dd>0)) return ts; nOpen=Math.max(1, dd-locked.length); }
        targetOpenQty = openQty; endAlong = isSta ? along(Ecur) : null;
        stepA = isSta ? (endAlong-openStartAlong)/nOpen : null;
      } else return ts;
      const slots = freeSlots(nOpen), rate = isEnd ? perDayQ : targetOpenQty/nOpen;
      let cursorA = openStartAlong, left = Math.round(targetOpenQty*100)/100;
      const newOpen = [];
      for(let i=0;i<nOpen;i++){
        let sta=null;
        if(isSta){ const nextA = isEnd ? Math.min(cursorA+stepA, endAlong) : (i===nOpen-1?endAlong:cursorA+stepA);
          sta=[staAt(cursorA), staAt(nextA)]; cursorA=nextA; }
        else if(kindL==="callout" && members[0].sta){ sta = members[0].sta.slice(); }
        const dq = Math.min(left, Math.round(rate*100)/100); left = Math.round((left-dq)*100)/100;
        const reuse = open[i], base = reuse || open[open.length-1] || lastLocked || members[0], w = fromWdi(slots[i]);
        newOpen.push({ ...base, id: reuse?reuse.id:tid(), day:w.day, wk:w.wk, qty:dq, sta });
      }
      return [...ts.filter(x=>runKey(x)!==k), ...locked, ...newOpen];
    });
  };
  const saveLog = (id,qty,mh,done)=> setLogs(l=>({...l,[id]:{qty:+qty||0, mh:+mh||0, done}}));
  const addResource = (type,name,extra)=>{
    const id=(type==="site"?"n":type==="sub"?"s":"c")+Math.random().toString(36).slice(2,7);
    if(type==="site") setSiteRows(r=>[...r,{id,name}]);
    else setCrews(c=>[...c,{id,name,type}]);
    setAddingIn(null);
  };
  const rmResource = id => {
    setCrews(c=>c.filter(x=>x.id!==id)); setSiteRows(r=>r.filter(x=>x.id!==id));
    setTasks(ts=>ts.filter(t=>t.res!==id)); setNotes(ns=>ns.filter(n=>n.row!==id));
    setEquipment(e=>e.filter(x=>x.res!==id));
    setModal(null);
  };
  /* equipment mutations */
  const addEquip = (res,kind)=> setEquipment(e=>[...e,{id:"e"+Math.random().toString(36).slice(2,7),res,kind,name:kind==="rental"?"Rental unit":"Equipment"}]);
  const rmEquip = id => { setEquipment(e=>e.filter(x=>x.id!==id)); setEqHours(h=>{const c={...h}; Object.keys(c).forEach(k=>{ if(k.startsWith(id+"_")) delete c[k]; }); return c;}); };
  const renameEquip = (id,name)=> setEquipment(e=>e.map(x=>x.id===id?{...x,name}:x));
  const setEqHrs = (id,val)=> setEqHours(h=>({...h,[id+"_"+wk]:val}));
  const eqProps = { equipment, eqHours, wk, showOwned, showRental, addEquip, rmEquip, renameEquip, setEqHrs };

  const pinSort = (a,b)=> (b.pinned?1:0)-(a.pinned?1:0); // pinned crews float to the top (IKEA-effect ownership)
  const crewsOnly = crews.filter(c=>c.type==="crew").slice().sort(pinSort);
  const subsOnly  = crews.filter(c=>c.type==="sub").slice().sort(pinSort);
  const takeSnapshot = ()=>{ const byTask={}; tasks.forEach(t=>{ byTask[t.id]={qty:t.qty,day:t.day,wk:t.wk}; }); setBaseline({takenAt:new Date().toISOString().slice(0,10), byTask}); };
  /* Board Snapshot for Procore — print just the board grid (landscape) to save as a
     PDF for the weekly Procore photo album. Uses the browser print dialog, no library. */
  const snapshotBoard = ()=>{
    setTab("board");
    const prevTitle = document.title;
    document.title = "DPW547_Board_"+wk;
    document.body.classList.add("board-print");
    const done = ()=>{ document.body.classList.remove("board-print"); document.title = prevTitle; window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    setTimeout(()=>window.print(), 80);
  };
  const reflow = useMemo(()=> reflowOn ? computeReflow(tasks, logs, baseline, crews, cfg) : {byTask:{},byCrew:{}}, [reflowOn,tasks,logs,baseline,crews,cfg]);

  return (
    <div className="la-root" data-theme={theme}>
      <style>{CSS}</style>

      {/* ============ TOP BAR ============ */}
      <header className="top no-print">
        <div className="brand" onMouseEnter={()=>setLogoHover(true)} onMouseLeave={()=>setLogoHover(false)}>
          <span className="brandsweep" style={{animation:anim("brandSweep",".8s","cubic-bezier(.25,.7,.2,1)")}}/>
          <div className="brandmark">
            <img className="brandlogo dk" src="assets/rngd-white.png" alt="RNGD" draggable="false" style={{animation:anim("markSnap",".55s","cubic-bezier(.2,1.5,.35,1)","both")}}/>
            <img className="brandlogo lt" src="assets/rngd-black.png" alt="RNGD" draggable="false" style={{animation:anim("markSnap",".55s","cubic-bezier(.2,1.5,.35,1)","both")}}/>
            <span className="brandmicro" style={{animation:anim("microReveal",".6s","ease","both")}}>Renegade Thinking. · Revolutionary Results.</span>
          </div>
          <span className="brandbar" style={{animation:anim("barFlare",".6s","cubic-bezier(.2,1.3,.4,1)","both")}}/>
          <span className="proj" style={{animation:anim("projShift",".6s","ease","both")}}>
            Look Ahead: Built by the Watershed Project Team<em>DPW547 · Job 2124013</em>
            <span className="projul" style={{animation:anim("ulGrow",".5s","cubic-bezier(.2,.7,.2,1)",".08s both")}}/>
          </span>
        </div>
        <nav className="tabs">
          {[["dash","Command"],["board","Board"],["trends","Trends"],["catalog","Catalog / CTC"],["trucking","Trucking"]].map(([k,l])=>
            <button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>)}
        </nav>
        <div className="weeknav">
          <button onClick={()=>setWk(addDays(wk,-7))} aria-label="Previous week">‹</button>
          <span>{wkTitle(wk)}</span>
          <button onClick={()=>setWk(addDays(wk,7))} aria-label="Next week">›</button>
          <button className="ghost" onClick={()=>setWk(mondayOf(new Date().toISOString().slice(0,10)))}>Today</button>
        </div>
        <div className="actions">
          <button className="cta" onClick={()=>setModal({type:"sched"})}>+ Schedule</button>
          <button onClick={()=>setModal({type:"eos", day: Math.min(3,(new Date().getDay()+6)%7)})}>EOS Summary</button>
          <button onClick={()=>setModal({type:"cheat"})}>Cheat Sheet</button>
          <button onClick={snapshotBoard} title="Print the board grid for the Procore album (Save as PDF)">Snapshot</button>
          <button onClick={()=>setModal({type:"print"})}>Print / PDF</button>
          <button onClick={()=>setModal({type:"cards"})}>Print Cards</button>
          <button onClick={()=>setModal({type:"data"})}>Data</button>
          <button onClick={()=>setModal({type:"milestones"})}>Milestones</button>
          {installEvt && <button className="cta hot" onClick={async()=>{ try{ installEvt.prompt(); await installEvt.userChoice; }catch(e){} setInstallEvt(null); }} title="Install RNGD Look-Ahead on this device">⬇ Install</button>}
          <button className={"pill syncpill "+(sync.status==="synced"?"pgood":(sync.status==="key"||sync.status==="error")?"pbad":"dim")}
            onClick={()=>setSyncPop(v=>!v)}
            title={SYNC_LABEL[sync.status]+(sync.at? " · "+new Date(sync.at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"")}>

          </button>
          {syncPop && <div className="syncpop" onMouseLeave={()=>setSyncPop(false)}>

            <div className="spline">Last contact: {sync.at? new Date(sync.at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : "—"}</div>
            <div className="spline">Device {syncLS.device()}</div>
            {sync.detail && <div className="spline">{sync.detail}</div>}
            <div className="btnrow" style={{marginTop:8}}>
              <button className="ghost sm" onClick={()=>{ syncRef.current.nextPollAt=0; pullNow(true); const S=syncRef.current; if(S.latestJson && S.latestJson!==S.lastSyncedJson) pushNow(); }}>Sync now</button>
              <button className="ghost sm" onClick={()=>{ setSyncPop(false); setModal({type:"boardkey"}); }}>Board key</button>
            </div>
          </div>}
          <button className="themebtn" title={"Theme: "+theme+" — click to change"}
            onClick={()=>setTheme(t=>t==="system"?"light":t==="light"?"dark":"system")}>
            {theme==="light"?"☀":theme==="dark"?"☾":"⚙"} {theme[0].toUpperCase()+theme.slice(1)}
          </button>
        </div>
      </header>

      {digest && <div className="digest no-print">
        <span className="dgtag">Standup</span>
        <span className="dgtxt">{digest.todayTasks} task{digest.todayTasks!==1?"s":""} on today{digest.yUnlogged>0?` · ${digest.yUnlogged} from yesterday still unlogged`:""}{digest.msSoon>0?` · ${digest.msSoon} milestone${digest.msSoon>1?"s":""} within 7 days`:""}{digest.savWk>0?` · ${fmt$(digest.savWk)} saved this week`:""}.</span>
        <button className="dgx" onClick={()=>{ try{localStorage.setItem("lafable-digest",new Date().toISOString().slice(0,10));}catch(e){} setDigest(null); }}>Got it</button>
      </div>}

      {(tab==="board"||tab==="dash") && <RhythmBanner lastUpdated={lastUpdated} setModal={setModal}/>}

      {/* ============ KPI STRIP ============ */}
      {tab==="board" && <>
      <div className="kpis no-print">
        <div className="kpi"><label>Planned MH</label><b>{fmtN(kpi.p)}</b></div>
        <div className="kpi"><label>Actual MH</label><b>{fmtN(kpi.a)}</b></div>
        <div className="kpi"><label>Earned MH</label><b>{fmtN(kpi.e)}</b></div>
        <div className="kpi"><label>PF</label><b className={kpi.pf>=1?"good":kpi.pf>0?"bad":""}>{kpi.pf?kpi.pf.toFixed(2):"—"}</b></div>
        <div className="kpi"><label>Days Logged</label><b>{kpi.logged}/{kpi.cells}</b></div>
        <div className="kpi" title="Percent Plan Complete = tasks done ÷ tasks committed this week. SOP target ≥ 80%; below triggers a team review."><label>PPC {kpi.done}/{kpi.cells}</label><b className={kpi.cells===0?"":kpi.ppc>=0.8?"good":"bad"}>{kpi.cells?pct(kpi.ppc):"—"}{kpi.cells>0&&kpi.ppc<0.8?" ⚠":""}</b></div>
        <div className={"kpi ts"+(kpi.ts?" hot":"")}><label>Time-Sensitive</label><b>{kpi.ts} {kpi.ts>0&&"⚠"}</b></div>
      </div>
      <div className="weekprog no-print" title="How staged this week is — crews with scheduled work vs total crews.">
        <div className="wpbar"><i style={{width:Math.round(weekPlan.pctPlan*100)+"%"}}/></div>
        <span className="wptxt"><b>This week is {pct(weekPlan.pctPlan)} planned</b> — {weekPlan.staged} of {weekPlan.crewN} crews staged{weekPlan.ms>0?" · "+weekPlan.ms+" milestone"+(weekPlan.ms>1?"s":""):""}. Keep sequencing 4–5 weeks out.</span>
      </div>

      <div className="legend no-print">
        {Object.keys(SCOPES).filter(k=>k!=="gen").map(k=><span key={k}><i style={{background:SCOPES[k].bg}}/><em className="lgcode">{SCOPES[k].code}</em>{SCOPES[k].name}</span>)}
        <button className="legendbtn" onClick={()=>setModal({type:"legend"})} title="Full SOP color-coding standard — printable">Scope legend ↗</button>
        <label className="switch"><input type="checkbox" checked={showOwned} onChange={e=>setShowOwned(e.target.checked)}/><i/><span>Equipment</span></label>
        <label className="switch"><input type="checkbox" checked={showRental} onChange={e=>setShowRental(e.target.checked)}/><i/><span>Rental</span></label>
        <label className="switch"><input type="checkbox" checked={reflowOn} onChange={e=>setReflowOn(e.target.checked)}/><i/><span>Re-flow</span></label>
        <span className="viewseg" title="Card view — HQ: labor $ vs pay · Field: qty & MH · Ops: loads & bedding tons">
          {["HQ","Field","Ops"].map(v=><button key={v} className={boardView===v?"on":""} onClick={()=>setBoardView(v)}>{v}</button>)}
        </span>
        <span className="tagswitch"><label>Tag style</label>
          <span className="viewseg">
            {[["bold","Bold sticky"],["highlighter","Highlight"],["flat","Flat brand"]].map(([k,l])=><button key={k} className={cardStyle===k?"on":""} onClick={()=>setCardStyle(k)}>{l}</button>)}
          </span>
        </span>
        <button className="snapbtn" onClick={takeSnapshot} title="Freeze the current plan as the baseline">{baseline?("Baseline "+baseline.takenAt.slice(5)):"Take snapshot"}</button>
        <span className="hint">drag a card to move it · ⌘/Ctrl-click to multi-select · Re-flow forecasts catch-up vs each crew's MH cap</span>
      </div>

      {sel.size>0 && <div className="selbar no-print"><b>{sel.size}</b> task{sel.size>1?"s":""} selected — drag any selected card to move the group (same day shift); drop on a day. <button onClick={()=>setSel(new Set())}>Clear</button></div>}
      <div className="boardprinthdr print-only">
        <div className="bphtitle">DPW547 · Job 2124013 — Look-Ahead Board · {wkTitle(wk)}</div>
        <div className="bphleg">{Object.keys(SCOPES).filter(k=>k!=="gen").map(k=><span key={k}><i style={{background:SCOPES[k].bg}}/>{SCOPES[k].code} {SCOPES[k].name}</span>)}</div>
      </div>
      {/* ============ BOARD GRID ============ */}
      {isMobile ? <MobileBoard {...{crewsOnly,subsOnly,siteRows,weekTasks,notes,setNotes,wk,taskCalc,setModal,eqProps,moveTask,sel,rescheduleDrop,milestones,boardView,setBoardView,cardStyle,depMap}}/> :
      <div className="boardmain">
      <div className="boardwrap">
        <table className="board">
          <thead>
            <tr>
              <th className="rescol">Resource</th>
              {DAYS.map((d,i)=>{
                const date=addDays(wk,i); const today = date===new Date().toISOString().slice(0,10);
                const ms = milestones.filter(m=>m.date===date);
                return <th key={d} className={(i>4?"wknd ":"")+(today?"today":"")}><span>{d}</span><b>{dLabel(wk,i)}</b>
                  {ms.map(m=><span key={m.id} className="msflag" title={m.label}><i className="msdiamond"/>{m.label.length>16?m.label.slice(0,15)+"…":m.label}</span>)}</th>;
              })}
            </tr>
          </thead>
          <tbody>
            <SectionRow label="Crews" onAdd={()=>setAddingIn("crew")} />
            {addingIn==="crew" && <AddRow ph="Foreman / crew name" onAdd={n=>addResource("crew",n)} onX={()=>setAddingIn(null)} />}
            {crewsOnly.map(c=><ResRow key={c.id} res={c} kind="crew" {...{wk,weekTasks,logs,cfg,setModal,taskCalc,eqProps,sel,toggleSel,rescheduleDrop,reflow,reflowOn,boardView,cardStyle,depMap}}/>)}

            <SectionRow label="Subcontractors" onAdd={()=>setAddingIn("sub")} />
            {addingIn==="sub" && <AddRow ph="Subcontractor name" onAdd={n=>addResource("sub",n)} onX={()=>setAddingIn(null)} />}
            {subsOnly.map(c=><ResRow key={c.id} res={c} kind="sub" {...{wk,weekTasks,logs,cfg,setModal,taskCalc,eqProps,sel,toggleSel,rescheduleDrop,reflow,reflowOn,boardView,cardStyle,depMap}}/>)}

            <SectionRow label="Site" onAdd={()=>setAddingIn("site")} />
            {addingIn==="site" && <AddRow ph="New site row (e.g. Deliveries, Inspections)" onAdd={n=>addResource("site",n)} onX={()=>setAddingIn(null)} />}
            {siteRows.map(r=><SiteRow key={r.id} row={r} notes={notes} setNotes={setNotes} setModal={setModal}/>)}
          </tbody>
        </table>
      </div>
      <CrewRail {...{crewsOnly,subsOnly,weekTasks,taskCalc,reflow,reflowOn,setModal}}/>
      </div>}
      </>}

      {tab==="dash" && <CommandCenter {...{crews,tasks,logs,notes,taskCalc,fcst,installedFor,wk,setWk,setTab,setModal,savings,cfg}}/>}
      {tab==="trends" && <Trends {...{crews,tasks,logs,taskCalc,wk}}/>}
      {tab==="trucking" && <TruckingView {...{truckDay,setTruckDay,savings,setSavings}}/>}
      {tab==="catalog" && (catalogOK
        ? <CatalogView installedFor={installedFor} fcst={fcst} ctcOf={ctcOf} remainingFor={remainingFor} contractQtyFor={contractQtyFor} umOverrides={umOverrides} setUmOverrides={setUmOverrides} openSched={ci=>setModal({type:"sched",ci})}/>
        : <CatalogGate onUnlock={()=>{ setCatalogOK(true); try{sessionStorage.setItem("catUnlock","1");}catch(e){} }}/>)}

      {/* ============ MODALS ============ */}
      {modal?.type==="task"    && <TaskModal t={tasks.find(x=>x.id===modal.id)} {...{logs,saveLog,rmTask,rmRun,resliceRun,upTask,cfg,installedFor,fcstFor,crews,tasks,deps,addDep,rmDep,wk,close:()=>setModal(null)}}/>}
      {modal?.type==="crew"    && <CrewModal res={crews.find(c=>c.id===modal.id)} {...{weekTasks,logs,taskCalc,setCrews,rmResource,close:()=>setModal(null)}}/>}
      {modal?.type==="sched"   && <SchedModal {...{wk,crews,cfg,installedFor,preset:modal, lastRes:(tasks.length?tasks[tasks.length-1].res:null), tasks, addDep, close:()=>setModal(null), add:(list)=>{setTasks(t=>[...t,...list]); setModal(null);} }}/>}
      {modal?.type==="eos"     && <EOSModal {...{wk,day:modal.day,crews,weekTasks,logs,taskCalc,eosMeta,setEosMeta,cfg,close:()=>setModal(null)}}/>}
      {modal?.type==="cheat"   && <CheatSheetModal {...{wk,weekTasks,taskCalc,crews,cfg,close:()=>setModal(null)}}/>}
      {modal?.type==="print"   && <PrintModal {...{crews,weekTasks,tasks,logs,notes,siteRows,taskCalc,installedFor,fcst,cfg,umOverrides,wk,close:()=>setModal(null)}}/>}
      {modal?.type==="cards"   && <CardExportModal {...{weekTasks,crews,taskCalc,cfg,wk,close:()=>setModal(null)}}/>}
      {modal?.type==="legend"  && <LegendModal close={()=>setModal(null)}/>}
      {modal?.type==="qlog"    && (()=>{ const t=tasks.find(x=>x.id===modal.id); return t && <QuickLogModal t={t} c={taskCalc(t)} lg={logs[t.id]||{}} saveLog={saveLog} openFull={()=>setModal({type:"task",id:t.id})} close={()=>setModal(null)}/>; })()}
      {modal?.type==="data"    && <DataModal {...{cfg,setCfg,ctc,setCtc,close:()=>setModal(null)}}/>}
      {modal?.type==="boardkey" && <BoardKeyModal close={()=>setModal(null)}
          onSet={k=>{ syncLS.setKey(k); const S=syncRef.current; S.keyPrompted=false; S.nextPollAt=0; pullNow(true); }}/>}
      {modal?.type==="milestones" && <MilestoneModal {...{milestones,setMilestones,close:()=>setModal(null)}}/>}
      {modal?.type==="note"    && <NoteModal note={notes.find(n=>n.id===modal.id)} rowId={modal.row} day={modal.day}
          save={(n)=>{ setNotes(ns=> n.id? ns.map(x=>x.id===n.id?n:x) : [...ns,{...n,id:"nn"+Math.random().toString(36).slice(2,7)}]); setModal(null);}}
          del={id=>{setNotes(ns=>ns.filter(x=>x.id!==id)); setModal(null);}} close={()=>setModal(null)}/>}
    </div>
  );
}

/* ============ BOARD PIECES ============ */
function SectionRow({label,onAdd}){
  return <tr className="secrow"><td colSpan={8}><span>{label}</span><button className="addbtn no-print" onClick={onAdd}>+ Add</button></td></tr>;
}
function AddRow({ph,onAdd,onX}){

function computeReflow(tasks, logs, baseline, crews, cfg){
  const byTask={}, byCrew={}, crewDayLoads={};
  const truckRate = (cfg && cfg.truckRate>0) ? cfg.truckRate : 220;
  const LOADS_PER_TRUCK_DAY = TRUCK_BASE.loadsHr * 8; // ~18 loads/truck/day
  const capOf = id => { const c=crews.find(x=>x.id===id); return (c && c.capMH>0)? c.capMH : 68; };
  const groups={};
  tasks.forEach(t=>{ const k=t.res+"|"+t.ci; (groups[k]||(groups[k]=[])).push(t); });
  Object.entries(groups).forEach(([k,arr])=>{
    const res=k.slice(0,k.indexOf("|")); const cap=capOf(res);
    arr.sort((a,b)=> a.wk<b.wk?-1 : a.wk>b.wk?1 : a.day-b.day);
    // Group MH/unit from the first task's effective row; mixed per-task ov.mh in one group is approximated.
    const mhU = itemFor(arr[0])[CI.MH];
    const capQ = mhU>0 ? cap/mhU : Infinity;
    let carry=0;
    arr.forEach(t=>{
      const bt = baseline && baseline.byTask && baseline.byTask[t.id];
      const planQ = (bt && bt.qty!=null) ? bt.qty : t.qty;
      const lg = logs[t.id];
      let dayQ;
      if(lg){ const actQ=lg.qty||0; carry=(planQ+carry)-actQ; byTask[t.id]={logged:true, planQ, actQ, reflowQ:actQ, reflowMH:(lg.mh||0), overCap:false}; dayQ=actQ; }
      else {
        const want=Math.max(0, planQ+carry);
        const capped=Math.min(want, capQ);
        const reflowMH = mhU>0 ? want*mhU : 0;
        const overCap = mhU>0 && reflowMH > cap+1e-6;
        byTask[t.id]={logged:false, planQ, reflowQ:want, cappedQ:capped, reflowMH, overCap};
        carry = want-capped; dayQ=want;
      }
      const ut = itemFor(t)[CI.UT] || 0;
      if(ut>0){ const loads=dayQ*ut/truckRate; const dk=t.wk+"_"+t.day;
        (crewDayLoads[res]||(crewDayLoads[res]={}))[dk]=(crewDayLoads[res][dk]||0)+loads; }
    });
    const cur = byCrew[res] || (byCrew[res]={behindMH:0, over:false, cap});
    if(mhU>0 && carry>0.0001) cur.behindMH += carry*mhU;
    if(arr.some(t=>byTask[t.id] && byTask[t.id].overCap)) cur.over=true;
  });
  Object.values(byCrew).forEach(v=>{
    v.extraDays = v.behindMH>0.5 ? Math.ceil(v.behindMH/(v.cap||68)) : 0;
    v.status = v.behindMH>0.5 ? "behind" : v.over ? "over" : "on";
  });
  Object.keys(crewDayLoads).forEach(res=>{
    const peak = Math.max(0, ...Object.values(crewDayLoads[res]));
    const c = crews.find(x=>x.id===res); const avail = (c && c.trucks>0)? c.trucks : 0;
    const cur = byCrew[res] || (byCrew[res]={behindMH:0,over:false,status:"on",extraDays:0});
    cur.peakLoads = Math.round(peak);
    cur.trucksNeeded = peak>0 ? Math.ceil(peak/LOADS_PER_TRUCK_DAY) : 0;
    cur.trucksAvail = avail;
    cur.truckShort = avail>0 && cur.trucksNeeded>avail;
  });
  return {byTask, byCrew};
}

              onDragOver={e=>{e.preventDefault(); e.currentTarget.classList.add("dropday");}}

/* Weekly-rhythm banner — loss-framed nudge when the board has gone stale (a shared
   board that no one has touched in 3+ days is drifting from the field), else a calm
   strip showing the SOP touchpoints. lastUpdated is the shared last-edit timestamp. */
function RhythmBanner({lastUpdated,setModal}){

  if(stale) return (
    <div className="rhythm loss no-print">
      <span className="rdot"/>

      <span className="rstep">Wed 2 PM · board → Procore</span>
      <span className="rstep">AM · safety huddle</span>
      <span className="rstep">PM · end-of-shift log</span>

    </div>
  );
}
/* Card tag treatments — Bold sticky (solid scope fill) / Highlight (dark panel +
   colored left border) / Flat brand (tinted panel). Container paint only — the
   Ops/Field/HQ content layout is governed separately by boardView. */
function cardVisual(scope, style){
  const s = scope || SCOPES.gen, bg=s.bg;
  if(style==="highlighter")
    return { css:{background:"#15181a",color:"#e9ebec",borderLeft:"5px solid "+bg,boxShadow:"0 2px 5px rgba(0,0,0,.35)"}, titleColor:bg, subColor:"#9aa0a3", subOpacity:1, chipBg:bg, chipTx:s.tx };
  if(style==="flat")
    return { css:{background:"color-mix(in srgb,"+bg+" 20%, #0f1214)",color:"#e9ebec",border:"1px solid color-mix(in srgb,"+bg+" 42%, #23282a)",borderLeft:"4px solid "+bg}, titleColor:bg, subColor:"#9aa0a3", subOpacity:1, chipBg:bg, chipTx:s.tx };
  return { css:{background:bg,color:s.tx,borderTop:"2px solid color-mix(in srgb,"+bg+" 72%, #000)",boxShadow:"0 1px 0 rgba(0,0,0,.18), 0 4px 9px rgba(0,0,0,.32)"}, titleColor:s.tx, subColor:s.tx, subOpacity:.72, chipBg:"rgba(0,0,0,.16)", chipTx:s.tx };
}
function Card({t,c,prev,onOpen,canDrag,selected,onSelect,rf,reflowOn,boardView,run,resKind,cardStyle,dep}){

        </> : <>
