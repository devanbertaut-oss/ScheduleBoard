/* Scheduling Board SOP scope-color system — bold "readable from 10 feet" colors,
   one per real-world trade scope, each with a redundant color-blind letter code.
   Color is derived FRESH from the cost-code prefix (scopeKeyOf), not the old
   hand-assigned CI.CAT bucket (which mixed trades). "gen" is the non-SOP fallback
   for anything without a matching prefix. This is the single source of card/legend/
   catalog/print coloring; CATS/CI.CAT are kept only for seed data + overrides. */
const SCOPES = {
  drainage:{name:"Drainage",             code:"DRN", bg:"#F58A2E", tx:"#3a2205"},
  base:    {name:"Base",                 code:"BSE", bg:"#8B63E0", tx:"#ffffff"},
  water:   {name:"Water",                code:"WTR", bg:"#2F82DB", tx:"#ffffff"},
  sewer:   {name:"Sewer",                code:"SWR", bg:"#12A150", tx:"#ffffff"},
  struct:  {name:"Structural Concrete",  code:"STR", bg:"#A6CF3A", tx:"#26330a"},
  earth:   {name:"Earthwork",            code:"ERT", bg:"#A56A3C", tx:"#ffffff"},
  sub:     {name:"Subcontractor",        code:"SUB", bg:"#F0C22E", tx:"#3a2f05"},
  elec:    {name:"Electrical",           code:"ELE", bg:"#E24C4B", tx:"#ffffff"},
  survey:  {name:"Survey",               code:"SUR", bg:"#F183B7", tx:"#3d1029"},
  pile:    {name:"Pile Driving",         code:"PIL", bg:"#5FBCE0", tx:"#0e2a3a"},
  gen:     {name:"General",              code:"GEN", bg:"#c3c9d8", tx:"#1e2330"},
};
function scopeKeyOf(cc){
  const c=(cc||"").replace(/-/g,".");
  if(/^33\.40\./.test(c)) return "drainage";
  if(/^33\.10\./.test(c)) return "water";
  if(/^(33\.30|33\.43)\./.test(c)) return "sewer";
  if(/^33\.49\./.test(c)) return "struct";
  if(/^32\.07\./.test(c)) return "base";
  if(/^(31\.23|02\.45)\./.test(c)) return "earth";
  if(/^26\./.test(c)) return "elec";
  if(/^(01\.18\.34|01\.19)\./.test(c)) return "survey";
  if(/pile/i.test(cc||"")) return "pile";
  return "gen";
}
/* Subcontractor-performed work always shows Subcontractor color, regardless of trade. */
function scopeFor(cc,resId,crews){
  const res=(crews||[]).find(x=>x.id===resId);
  if(res && res.type==="sub") return "sub";
  return scopeKeyOf(cc);
}
const unitCost = it => it[CI.UL]+it[CI.UE]+it[CI.UM$]+it[CI.US]+it[CI.UT]+it[CI.UX];
/* Unit taxonomy for station-to-station takeoff. A station range yields a length in feet.
   - LF quantifies directly (run length = qty).
   - area/volume/weight pay items need extra dimensions to turn that run length into their unit.
   - everything else (EACH counts, VF vertical feet, LS, ...) is a "callout": the station is a
     location reference only and does NOT quantify the pay item — qty is entered manually.
   Width & depth are entered in feet; density in TON/CY (matches STONE_TON_PER_CY / TON_PER_CY). */
const UNIT_KIND = { LF:"lin", SY:"area", SF:"area", CY:"vol", CF:"vol", TON:"wt", TN:"wt" };
const unitKind  = um => UNIT_KIND[String(um||"").toUpperCase()] || "callout";
// Convert station length (feet) + dimensions to a quantity in the item's unit.
// Returns null when a required dimension is missing (so the UI shows "—" and blocks Add) or when
// the unit is a callout (station never sets the quantity for EACH/VF/LS/etc.).
function staGenQty(um, len, w, d, dens){
  if(len==null) return null;
  const k = unitKind(um), U = String(um||"").toUpperCase();
  if(k==="lin") return len;                                                       // LF: run length = qty
  if(k==="area"){ if(!(w>0)) return null; return len*w/(U==="SY"?9:1); }          // ft² → SY (÷9) or SF
  if(k==="vol"){  if(!(w>0&&d>0)) return null; return len*w*d/(U==="CY"?27:1); }   // ft³ → CY (÷27) or CF
  if(k==="wt"){   if(!(w>0&&d>0&&dens>0)) return null; return len*w*d/27*dens; }    // ft³ → CY → TON
  return null; // callout units: station is a location callout, not a quantity
}

const itemFor = t => {
  const base = CATALOG[t.ci];

  const it = base.slice();
  Object.keys(OV_MAP).forEach(k=>{ const v=t.ov[k]; if(v!=null && v!=="") it[OV_MAP[k]]=v; });

};

  : cfg;

const scopeOf = (t,crews) => (t && t.ov && t.ov.scope) ? t.ov.scope : scopeFor(itemFor(t)[CI.CC], t && t.res, crews);

/* One cycle basis, shared by truckModel and routePlan so their truck counts agree. Round-trip

function trafficOf(src){ const v=+(src&&src.traffic); return v>0 ? v : 1; }   // per-route congestion multiplier (default 1×)
// Per-route stops: wait at the jobsite + stop at the pit/dump. Each source may set its own
// siteMin/stopMin; a blank field falls back to the global default (loadSpot / tipMin).
function siteStopOf(c,key){ const s=(c.sources||{})[key]||{}; return +s.siteMin>0 ? +s.siteMin : (+c.loadSpot||6); }
function endStopOf(c,key){  const s=(c.sources||{})[key]||{}; return +s.stopMin>0 ? +s.stopMin : (+c.tipMin||3); }

const FAM_DEPTH = { "Water pipe":4, "Sewer pipe":6 };
// Depth used for the trucking calc, in priority: a card's hard-keyed depth → the per-size assumed
// depth (global, set per pipe size next to trench width/foundation) → the discipline default →

function resolveDig(item,taskDig,cfg){
  if(taskDig!=null && taskDig!=="") return +taskDig;
  const T=(cfg&&cfg.truck)||{};
  if(item){ const g=bedForItem(item[CI.CC], item[CI.TASK], item[CI.UM], null);

// Guard against a mis-set / auto-filled far source silently collapsing trips-per-truck: the effective
// one-way leg (drive × traffic) used for cycles is clamped to maxLegMin (default 60). Beyond that you
// stage/pre-haul the material rather than sending one truck per load on a 2-hour round trip.
function legClamp(c){ const m=+c.maxLegMin>0?+c.maxLegMin:60; return leg=>Math.min(leg,m); }
function truckCycles(c){
  const S=c.sources||{}, clamp=legClamp(c);
  const cyc=(key,flat)=>{ const s=S[key]||{}, v=+s.oneWayMin; return v>0 ? (2*clamp(v*trafficOf(s))+siteStopOf(c,key)+endStopOf(c,key)) : flat; };
  return { spoil:cyc("dump",c.cycSpoil), stone:cyc("stone",c.cycStone), sand:cyc("sand",c.cycSand), base:cyc("base",c.cycBase) };
}
/* Roadway / earthwork item recognizer (Phase 6). Excavation (CY) hauls spoil OUT; base
   course & bridging aggregate haul IN from the stone pit (#610 by the ton, #57/#8 by CY);
   "unsuitable subgrade" also brings sand IN. Fine grading is labor only (no haul → null). */
function roadForItem(cc, desc, um){
  const code=(cc||"").replace(/-/g,"."), d=desc||"";
  if(/fine grading/i.test(d)) return null;
  if(/base course|bridging course|aggregate/i.test(d) || /^32\.07\.13|^32\.05\.59|^01\.55\.13/.test(code)){
    let material="#610 base"; if(/no\.?\s*57|#57/i.test(d)) material="#57 stone"; else if(/no\.?\s*8\b|#8/i.test(d)) material="#8 stone";
    return {kind:"base", material, um};

  if(/excavation/i.test(d) || /^31\.23\.|^02\.61\./.test(code))
    return {kind:"exc", material:"excavation", sandFill:/sand fill/i.test(d), um};
  return null;

/* Physical per-item, per-day trucking model. Drainage pipe (LF) → three streams from the
   trench geometry; roadway/earthwork (CY/TON) → excavation spoil-out and/or base/aggregate
   haul-in. Same {spoil,stone,sand} shape so cards, reflow, merge & routePlan all reuse it. */
/* Time-aware spoil fleet: enough trucks to haul the day's dig-out, AND enough to keep the
   excavator fed *for the hours it is actually digging*. Small production days need only a
   truck or two; a full-shift dig converges to the classic feed floor (cycle ÷ load time).
   `loads` = dig-out truckloads/day, `tripsSpoil` = round trips one truck runs per shift,
   `feedMin` = peak trucks to keep the machine loading, `availMin` = productive min/truck/day. */
function spoilFleet(loads, tripsSpoil, feedMin, loadSpot, availMin){
  if(!(loads>0)) return 0;
  const haul = loads/Math.max(1e-9, tripsSpoil);                                // truck-days to move the volume
  const feed = feedMin*Math.min(1, loads*(+loadSpot||6)/Math.max(1,availMin));   // feed crew × dig fraction of the shift
  return Math.ceil(Math.max(haul, feed));

/* ONE pairing engine for the whole app — the single basis behind truckModel.total,
   mergeTruckModels.total, routePlan and the cheat sheet's pooled row, so every surface agrees.
   Greedy back-haul: pair each spoil-out load with a material-in load into one combined cycle
   site→dump→pit→site, priced at its TRUE cost (both stops + three legs) — a back-hauled load is
   cheaper than two round trips but it is NOT free. Leftovers run dedicated round trips.
   Missing drive times fall back to the flat cyc* autos (same basis as truckCycles — the report can
   never diverge from the cards because a pin was cleared). Returns total truck-MINUTES both ways. */
function haulPlan(streams, sources, autos){
  const c={...TRUCK_DEFAULTS, ...(autos||{})}, S=sources||c.sources||{};
  const N=k=>Math.max(0,+(streams&&streams[k])||0);
  const spoilN=N("spoil"), stoneN=N("stone"), sandN=N("sand"), baseN=N("base");
  const availMin=Math.max(1,(+c.shiftHrs||8)*60);   // hours mean hours — a truck running 8 hrs at an 80-min cycle makes 6 trips, matching the field count
  const clamp=legClamp(c), tf=key=>trafficOf(S[key]);

    return Math.max(1, ((+FLAT[key]||26) - siteStopOf(c,key) - endStopOf(c,key))/2); };

function haversine(a, b){
  if(!a || !b || a.lat==null || b.lat==null) return null;
  const R=3958.8, rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad, dLng=(b.lng-a.lng)*rad;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}

const addDays = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const mondayOf = iso => { const d=new Date(iso+"T12:00:00"); const g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); return d.toISOString().slice(0,10); };
const dLabel = (wk,i) => { const d=new Date(addDays(wk,i)+"T12:00:00"); return d.getDate(); };
const longDate = iso => new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
const wkTitle = wk => {
  const a=new Date(wk+"T12:00:00"), b=new Date(addDays(wk,6)+"T12:00:00");
  const mo=d=>d.toLocaleDateString(undefined,{month:"short"});
  return `Week of ${mo(a)} ${a.getDate()} – ${mo(a)===mo(b)?"":mo(b)+" "}${b.getDate()}`;

/* ---------- field-voice EOS descriptions (Silas cadence) ---------- */
const stickLen = n => /arch pipe|reinforced concrete pipe|rcp\b/i.test(n)?8 : /hppp|polypropylene|pvc/i.test(n)?20 : /ductile|di water/i.test(n)?18 : 0;
function autoDesc(name, ts, logs, calc, isSub){
  if(!ts.length) return "";
  const t=ts[0], c=calc(t), lg=logs[t.id];
  const item=c.it[CI.TASK], um=c.it[CI.UM], cat=c.it[CI.CAT];
  const q = lg? c.actQty : t.qty;
  const sta = t.sta? ` from station ${staFmt(t.sta[0])} to station ${staFmt(t.sta[1])}` : "";
  if (isSub) return `${name} continued ${item.toLowerCase()}${q?`, placing ${fmtN(q)} ${um}`:""}${sta}.`;
  const sl = stickLen(item);
  let s;
  if (cat===0 && sl && um==="LF")
    s = `${name}'s crew continued mainline drainage work, laying ${Math.max(1,Math.round(q/sl))} sticks (${fmtN(q)} LF) of ${item}${sta}.`;
  else if (cat===0)
    s = `${name}'s crew continued drainage work, installing ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===1)
    s = `${name}'s crew continued water main work, running ${fmtN(q)} ${um} of ${item}${sta} and backfilling behind the pipe.`;
  else if (cat===2)
    s = `${name}'s crew continued sewer work, laying ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===3)
    s = `${name}'s crew set ${fmtN(q)}${um==="EACH"?"":" "+um+" of"} ${item}${sta}, then backfilled around the structure.`;
  else if (cat===4)
    s = `${name}'s crew formed and poured ${fmtN(q)} ${um} of ${item}${sta}.`;
  else if (cat===5 && /fine grad/i.test(item))
    s = `${name}'s crew fine graded the ${item.toLowerCase()} to the correct elevation.`;
  else if (cat===5 && /dump and spread|base course/i.test(item))
    s = `${name}'s crew hauled in, spread, and compacted ${fmtN(q)} ${um} of ${item.toLowerCase()}.`;
  else if (cat===5)
    s = `${name}'s crew continued earthwork, placing ${fmtN(q)} ${um} of ${item.toLowerCase()}.`;
  else
    s = `${name}'s crew worked ${item.toLowerCase()}, completing ${fmtN(q)} ${um}.`;
  // production clause
  if (lg && t.qty){
    if (c.actQty >= t.qty) s = s.replace(/\.$/, ", meeting the day's planned production.");
    else s += ` The crew finished short of the planned ${fmtN(t.qty)} ${um}${lg.reason&&lg.reason!=="On plan"?` — ${lg.reason.toLowerCase()}`:""}.`;
  }
  // extra tasks that day
  const verbs = {0:"laid",1:"ran",2:"laid",3:"set",4:"poured",5:"placed"};
  ts.slice(1).forEach(x=>{
    const cx=calc(x), lx=logs[x.id]; const qx=lx?cx.actQty:x.qty;
    s += ` They also ${verbs[cx.it[CI.CAT]]||"placed"} ${fmtN(qx)}${cx.it[CI.UM]==="EACH"?"":" "+cx.it[CI.UM]+" of"} ${cx.it[CI.TASK].toLowerCase()}.`;
  });
  // trucking clause — from the physical truck model (actuals when logged), pooled per crew,
  // so the EOS number agrees with the Trucking report instead of a flat loads/6 heuristic.
  const tms = ts.map(x=>{ const cx=calc(x); return (cx.actTrk&&cx.actTrk.applicable)?cx.actTrk:(cx.trk&&cx.trk.applicable?cx.trk:null); }).filter(Boolean);
  if (tms.length){
    const merged=mergeTruckModels(tms);
    const total=merged?merged.total:0;
    const physLoads=tms.reduce((a,m)=>a+m.spoil.loads+m.stone.loads+m.sand.loads+(m.base?m.base.loads:0),0);
    if(total>0 && physLoads>=0.5){
      const loadsTxt=`moving ${Math.round(physLoads)} load${Math.round(physLoads)>1?"s":""} of material`;
      s += total<1 ? ` The crew ran a shared half-day truck, ${loadsTxt}.`   // 0.5 call-out — split with another crew
                   : ` The crew ran ${Math.ceil(total)} truck${Math.ceil(total)>1?"s":""}, ${loadsTxt}.`;
    }
  }
  return s;
}

    if (s.deps) setDeps(_mig ? _mig.deps : s.deps);

      const core = JSON.stringify({crews,siteRows,tasks,logs,notes,cfg,eosMeta,umOverrides,showEquip,ctc,baseline,milestones,deps,rainDays,holidays,reflowOn,cardStyle,truckDay,savings});
      const json = JSON.stringify({crews,siteRows,tasks,logs,notes,cfg,eosMeta,umOverrides,showEquip,ctc,baseline,milestones,deps,rainDays,holidays,reflowOn,cardStyle,truckDay,savings,lastUpdated});
      try{ await store.set("lafable-v3", json); }catch(e){}
      const S = syncRef.current;
      S.latestJson = json;
      syncLS.setMeta({localSavedAt: Date.now()});

  const finishRef = useRef({});   // runKey -> last settled finish working-day (for delay detection)
  /* Predecessor propagation — MS-Project "hold dates, push later". Every run holds its own dates.
     When a predecessor is DELAYED (its finish working-day moves later than last settle), each
     successor that would now start on/before that finish is pushed forward to finish+1, cascading
     down the chain. Pulling a predecessor in, or dragging a successor early, moves nothing (the

  useEffect(()=>{

    Object.keys(byKey).forEach(k=>{ finish[k]=Math.max(...byKey[k].map(t=>wdi(t.wk,t.day))); start[k]=Math.min(...byKey[k].map(t=>wdi(t.wk,t.day))); });

      const queue=[...delayed]; const cap=(Object.keys(byKey).length+delayed.length)*4+16; let guard=0;

    const finishOf=k=>Math.max(...tasks.filter(x=>runKey(x)===k).map(x=>wdi(x.wk,x.day)));

  };

    if (S.inflight){ S.dirty = true; return; }
    if (!S.latestJson) return;
    S.inflight = true; S.dirty = false;
    setSyncStatus("syncing");

      const body = '{"savedAt":'+Date.now()+',"device":"'+syncLS.device()+'","state":'+S.latestJson+'}';
      const res = await fetch(SYNC_URL, {method:"PUT", headers: syncHdrs(true), body});

      if (!res.headers.get("x-board")){ setSyncStatus("local","No sync endpoint on this hosting — changes stay on this device"); return; }

      const h = syncHdrs(false);

        // fromActuals: remaining = contract total − what was ACTUALLY installed on logged days,
        // re-sliced over the open tail at the planned rate (absorbs an over/under-run into the plan).
        const lockedActualQty = locked.reduce((s,m)=>s+((logs[m.id]&&logs[m.id].qty)||0),0);
        const openQty = edit.fromActuals ? Math.max(0, Qtot - lockedActualQty) : (Qtot - lockedQty);
        if(openQty<=EPS) return [...ts.filter(x=>runKey(x)!==k), ...locked];  // remaining installed → drop open days
        const p = edit.perDay!=null ? +edit.perDay : (edit.fromActuals ? perDayQ : null);
        // avg/day (plain {perDay}) = the ACTUAL daily rate: each open day makes p, last day = the
        // remainder, total/end-station held fixed. keepRate (drag) & fromActuals keep even fill.
        const rateEdit = edit.perDay!=null && !edit.keepRate && !edit.fromActuals;
        if(rateEdit && isSta && rho!=null && rho>EPS){
          if(!(p>0)) return ts;
          isEnd=true; rateOverride=p; endAlong=along(Ecur); stepA=p/rho;
          nOpen=Math.max(1, Math.ceil((endAlong-openStartAlong)/stepA - EPS));
          targetOpenQty=openQty;
        } else {
          if(p!=null){ if(!(p>0)) return ts; nOpen=Math.max(1,Math.ceil(openQty/p - EPS)); }
          else { const dd=Math.round(+edit.days); if(!(dd>0)) return ts; nOpen=Math.max(1, dd-locked.length); }
          if(rateEdit) rateOverride=p;                    // qty run: each day = p, last = remainder
          // keepRate (drag-resize): hold the daily rate and let the TOTAL grow/shrink with the day count.
          targetOpenQty = edit.keepRate ? perDayQ*nOpen : openQty;
          endAlong = isSta ? along(Ecur) : null;
          stepA = isSta ? (endAlong-openStartAlong)/nOpen : null;
        }
      } else return ts;
      const slots = freeSlots(nOpen), rate = rateOverride!=null ? rateOverride : (isEnd ? perDayQ : targetOpenQty/nOpen);
      let cursorA = openStartAlong, left = Math.round(targetOpenQty*100)/100;
      const newOpen = [];
      for(let i=0;i<nOpen;i++){
        let sta=null;
        if(isSta){ const nextA = isEnd ? Math.min(cursorA+stepA, endAlong) : (i===nOpen-1?endAlong:cursorA+stepA);
          sta=[staAt(cursorA), staAt(nextA)]; cursorA=nextA; }
        else if(kindL==="callout" && members[0].sta){ sta = members[0].sta.slice(); }
        const dq = Math.min(left, Math.round(rate*100)/100); left = Math.round((left-dq)*100)/100;
        const reuse = open[i], base = reuse || open[open.length-1] || lastLocked || members[0], w = fromWdi(slots[i]);
        newOpen.push({ ...base, id: reuse?reuse.id:tid(), day:w.day, wk:w.wk, qty:dq, sta });
      }
      return [...ts.filter(x=>runKey(x)!==k), ...locked, ...newOpen];
    });
  };
  const setRunDig = (t, val) => {                         // trench depth (grade→bottom, ft) — one value for the whole run
    const k = runKey(t), v = (val===""||val==null) ? null : +val;
    pushUndo("Set trench depth");
    setTasks(ts => ts.map(x => runKey(x)===k ? {...x, dig: v} : x));
  };
  const asapRun = t => {                                  // one-shot "schedule as soon as possible": snap the run's start to its latest predecessor's finish + 1
    const k=runKey(t), preds=(deps[k]||[]); if(!preds.length) return;
    pushUndo("Scheduled ASAP");
    setTasks(ts=>{
      const byKey={}; ts.forEach(x=>{ (byKey[runKey(x)]||(byKey[runKey(x)]=[])).push(x); });
      const present=preds.filter(p=>byKey[p]&&byKey[p].length), mem=byKey[k];
      if(!present.length||!mem||!mem.length) return ts;
      const target=Math.max(...present.map(p=>Math.max(...byKey[p].map(m=>wdi(m.wk,m.day)))+1));
      const delta=target-Math.min(...mem.map(m=>wdi(m.wk,m.day))); if(delta===0) return ts;
      return ts.map(x=>{ if(runKey(x)!==k) return x; const w=fromWdi(wdi(x.wk,x.day)+delta); return {...x,day:w.day,wk:w.wk}; });
    });
  };
  // Preserve-merge each write: keep a prior reason when the caller doesn't pass one, and stamp `at` so the
  // sync layer can merge per-task instead of clobbering another device's actuals (whole-state LWW otherwise).
  const saveLog = (id,qty,mh,done,reason)=> setLogs(l=>({...l,[id]:{...l[id], qty:+qty||0, mh:+mh||0, done, reason: reason!==undefined?reason:((l[id]&&l[id].reason)||""), at:Date.now()}}));
  /* Capacity-aware catch-up re-slice for one run: spreads a logged shortfall across the run's
     own remaining (open) days first — never pushing a day past the crew's daily MH cap — and
     only appends new days once that capacity is exhausted. If an appended day lands on a slot
     another run already occupies for the same crew, that run becomes a formal dependent
     (successor) so the existing predecessor-push effect (index.html ~526) carries it forward
     automatically — no manual cascade needed here.
     Uses a taken baseline's frozen qty (same as the live preview, index.html ~1310) as each
     ORIGINAL day's plan when one exists, so re-checking after a commit compares against that
     ORIGINAL plan rather than the just-committed numbers — take a snapshot before a run starts
     if you want Re-flow to stay accurate across more than one commit on it. Days reflow itself
     appends (reflowExtra) carry no plan of their own, so they don't re-absorb the same shortfall
     a second time once re-checked. */
  const resliceRunCatchup = (members) => {
    const k = runKey(members[0]), res = members[0].res;
    const sorted = members.slice().sort((a,b)=>wdi(a.wk,a.day)-wdi(b.wk,b.day));
    const open = sorted.filter(m=>logs[m.id]==null);
    if(!open.length) return;
    const mhU = itemFor(sorted[0])[CI.MH];
    const cap = capOf(crews, res);
    const capQ = mhU>0 ? cap/mhU : Infinity;
    const planOf = t => { if(t.reflowExtra) return 0; const bt = baseline && baseline.byTask && baseline.byTask[t.id]; return (bt && bt.qty!=null) ? bt.qty : (+t.qty||0); };
    let carry=0;
    const patches = {};   // id -> new qty, absorbing the shortfall into THIS run's own open days
    sorted.forEach(t=>{
      const lg = logs[t.id];
      if(lg){ carry = (planOf(t)+carry) - (lg.qty||0); return; }   // logged day: carries its own over/under-run forward
      const want = Math.max(0, planOf(t)+carry);
      const cq = Math.min(want, capQ);
      patches[t.id] = Math.round(cq*100)/100;
      carry = want-cq;
    });
    const extra = [];   // new day-cards, only once the run's own open days are maxed out
    if(carry>1e-6){
      const base = open[open.length-1];
      let cursor = wdi(sorted[sorted.length-1].wk, sorted[sorted.length-1].day);
      while(carry>1e-6){
        cursor++;
        const dq = Math.min(carry, isFinite(capQ)?capQ:carry);
        const w = fromWdi(cursor);
        extra.push({ ...base, id:tid(), day:w.day, wk:w.wk, qty:Math.round(dq*100)/100, sta:null, reflowExtra:true });
        carry -= dq;
      }
    }
    const collide = new Set();
    if(extra.length){
      const occupied = {};
      tasks.forEach(x=>{ if(x.res===res && runKey(x)!==k) occupied[wdi(x.wk,x.day)]=runKey(x); });
      extra.forEach(nt=>{ const rk=occupied[wdi(nt.wk,nt.day)]; if(rk) collide.add(rk); });
    }
    setTasks(ts=>{
      const patched = ts.map(t=> patches[t.id]!=null ? {...t, qty:patches[t.id]} : t);
      return [...patched, ...extra];
    });
    collide.forEach(depKey=>addDep(depKey,k));   // the run that used to sit right after now formally waits on this one
  };
  /* Bake the re-flow forecast into the plan: for every run that has an over/under-run on its
     logged days, capacity-aware re-slice the open tail from today's actuals (adds days only as
     needed, links a bumped successor). Returns how many runs were adjusted. */
  const commitReflow = () => {
    const byKey={}; tasks.forEach(x=>{ (byKey[runKey(x)]||(byKey[runKey(x)]=[])).push(x); });
    const targets = Object.keys(byKey).filter(k=>{
      const mem=byKey[k], logged=mem.filter(m=>logs[m.id]!=null), open=mem.filter(m=>logs[m.id]==null);
      if(!logged.length || !open.length) return false;
      const planLogged=logged.reduce((s,m)=>s+(+m.qty||0),0);
      const actLogged=logged.reduce((s,m)=>s+((logs[m.id]&&logs[m.id].qty)||0),0);
      return Math.abs(actLogged-planLogged) >= 0.01;   // has an over/under-run
    });
    if(!targets.length) return 0;
    pushUndo("Re-flowed to plan"); undoSuppress.current=true;               // one snapshot for the whole batch
    try { targets.forEach(k=>resliceRunCatchup(byKey[k])); }
    finally { undoSuppress.current=false; }
    return targets.length;
  };
  /* Batch C — fast plan edits. */
  // Shift every selected task by dw working days (no week clamp); used by the selection-bar buttons.
  const shiftSelected = dw => { if(!sel.size||!dw) return; pushUndo("Shifted "+sel.size+" task"+(sel.size>1?"s":"")); setTasks(ts=>ts.map(t=>{ if(!sel.has(t.id)) return t; const w=fromWdi(Math.max(0,wdi(t.wk,t.day)+dw)); return {...t,day:w.day,wk:w.wk}; })); };
  // Resize a run to a target working-day count, holding the daily rate (drag-the-edge / stepper).
  const resizeRun = (t, targetDays) => {
    const k=runKey(t), mem=tasks.filter(x=>runKey(x)===k).slice().sort((a,b)=>wdi(a.wk,a.day)-wdi(b.wk,b.day));
    if(!mem.length) return; const lockedN=mem.filter(m=>logs[m.id]!=null).length;
    const N=Math.max(lockedN+1, Math.round(targetDays)); if(N===mem.length) return;
    const it=itemFor(mem[0]), isSta=unitKind(it[CI.UM])!=="callout" && mem.every(m=>m.sta);
    if(isSta){ const S0=mem[0].sta[0], E=mem[mem.length-1].sta[1], dir=Math.sign(E-S0)||1, stepFt=Math.abs(E-S0)/mem.length; resliceRun(mem[0],{end:S0+dir*stepFt*N}); }
    else resliceRun(mem[0],{days:N,keepRate:true});
  };
  const resizeRunToEnd = (t, endWdi) => { const k=runKey(t), mem=tasks.filter(x=>runKey(x)===k); if(!mem.length) return; const startWdi=Math.min(...mem.map(m=>wdi(m.wk,m.day))); resizeRun(t, endWdi-startWdi+1); };
  // Roll incomplete (unlogged) work in the current week forward one week; logged days stay put.
  const rollForward = () => {
    const movers = tasks.filter(t=>t.wk===wk && !logs[t.id]);
    if(!movers.length) return 0;
    pushUndo("Rolled forward");
    setTasks(ts=>ts.map(t=>{ if(t.wk===wk && !logs[t.id]){ const w=fromWdi(wdi(t.wk,t.day)+5); return {...t,day:w.day,wk:w.wk}; } return t; }));
    return movers.length;
  };
  /* Rain-out: a lost working day. The whole schedule from that day slides one working day later
     (every crew), the day is recorded so its EOS reads a rain-out. Clearing pulls the schedule back. */
  const rainWdiOf = date => { const mw=mondayOf(date); const off=Math.round((new Date(date+"T12:00:00")-new Date(mw+"T12:00:00"))/864e5); return wdi(mw, Math.min(Math.max(off,0),4)); };
  const shiftFrom = (rw,dir) => setTasks(ts=>ts.map(t=>{ const w0=wdi(t.wk,t.day); if(dir>0? w0>=rw : w0>rw){ const w=fromWdi(w0+dir); return {...t,day:w.day,wk:w.wk}; } return t; }));
  const applyRainout = date => { if(rainDays[date]) return 0; const affected=tasks.filter(t=>wdi(t.wk,t.day)>=rainWdiOf(date)).length; pushUndo("Rain-out "+date); setRainDays(r=>({...r,[date]:true})); shiftFrom(rainWdiOf(date),+1); return affected; };
  const clearRainout = date => { if(!rainDays[date]) return; pushUndo("Cleared rain-out "+date); setRainDays(r=>{ const c={...r}; delete c[date]; return c; }); shiftFrom(rainWdiOf(date),-1); };
  const addResource = (type,name,extra)=>{
    const id=(type==="site"?"n":type==="sub"?"s":"c")+Math.random().toString(36).slice(2,7);
    if(type==="site") setSiteRows(r=>[...r,{id,name}]);
    else setCrews(c=>[...c,{id,name,type}]);
    setAddingIn(null);
  };
  const rmResource = id => {
    setCrews(c=>c.filter(x=>x.id!==id)); setSiteRows(r=>r.filter(x=>x.id!==id));
    setTasks(ts=>ts.filter(t=>t.res!==id)); setNotes(ns=>ns.filter(n=>n.row!==id));
    setModal(null);
  };

  const pinSort = (a,b)=> (b.pinned?1:0)-(a.pinned?1:0); // pinned crews float to the top (IKEA-effect ownership)
  const crewsOnly = crews.filter(c=>c.type==="crew").slice().sort(pinSort);
  const subsOnly  = crews.filter(c=>c.type==="sub").slice().sort(pinSort);
  const takeSnapshot = ()=>{ const byTask={}; tasks.forEach(t=>{ byTask[t.id]={qty:t.qty,day:t.day,wk:t.wk}; }); setBaseline({takenAt:new Date().toISOString().slice(0,10), byTask}); };
  const reflow = useMemo(()=> reflowOn ? computeReflow(tasks, logs, baseline, crews, cfg) : {byTask:{},byCrew:{}}, [reflowOn,tasks,logs,baseline,crews,cfg]);
  // Forecast pulls from an explicit weather location if the user set one, else the job-site pin.
  const wxLoc = (cfg.wxLoc && cfg.wxLoc.lat!=null) ? cfg.wxLoc : ((cfg.truck&&cfg.truck.sources&&cfg.truck.sources.site)||TRUCK_DEFAULTS.sources.site);
  const wx = useForecast(wxLoc);
  const wxForDate = date => { if(!wx) return null; const i=wx.time.indexOf(date); if(i<0) return null;
    return {tmax:wx.temperature_2m_max[i], tmin:wx.temperature_2m_min[i], rain:wx.precipitation_probability_max[i], code:wx.weathercode&&wx.weathercode[i]}; };
  // Which visible columns are storming (rain ≥ 40%) — drives the canvas StormLayer's rebuild.
  const stormSig = useMemo(()=> spanWeeks.map(w=>[0,1,2,3,4].map(i=>{ const f=wxForDate(addDays(w,i)); return (f && f.rain!=null && f.rain>=40)?"1":"0"; }).join("")).join("|"), [spanWeeks, wx]);
  // Rain-out nudge: the nearest upcoming working day with ≥60% rain AND scheduled work that hasn't
  // already been rained out — connects the forecast to the rain-out tool instead of just tinting a header.
  const rainRisk = useMemo(()=>{
    const today = new Date().toISOString().slice(0,10);
    for(const w of spanWeeks) for(let d=0; d<5; d++){
      const date=addDays(w,d); if(date<today || rainDays[date]) continue;
      const f=wxForDate(date); if(!(f && f.rain!=null && f.rain>=60)) continue;
      const n=tasks.filter(t=>t.wk===w && t.day===d).length;
      if(n>0) return {date, day:d, rain:f.rain, n};
    }
    return null;
  },[spanWeeks, wx, tasks, rainDays]);

  return (
    <div className="la-root" data-theme={theme}>
      <style>{CSS}</style>
      {palette && <CommandPalette {...{setTab,setModal,crews,setPalette,takeSnapshot,setReflowOn}}/>}

      <div className="topzone">
      {/* ============ TOP BAR ============ */}
      <header className="top no-print">
        <div className="brand" onMouseEnter={()=>setLogoHover(true)} onMouseLeave={()=>setLogoHover(false)}>
          <span className="brandsweep" style={{animation:anim("brandSweep",".8s","cubic-bezier(.25,.7,.2,1)")}}/>
          <div className="brandmark">
            <img className="brandlogo dk" src="assets/rngd-white.png" alt="RNGD" draggable="false" style={{animation:anim("markSnap",".55s","cubic-bezier(.2,1.5,.35,1)","both")}}/>
            <img className="brandlogo lt" src="assets/rngd-black.png" alt="RNGD" draggable="false" style={{animation:anim("markSnap",".55s","cubic-bezier(.2,1.5,.35,1)","both")}}/>
            <span className="brandmicro" style={{animation:anim("microReveal",".6s","ease","both")}}>Renegade Thinking. · Revolutionary Results.</span>
          </div>
          <span className="brandbar" style={{animation:anim("barFlare",".6s","cubic-bezier(.2,1.3,.4,1)","both")}}/>
          <span className="proj" style={{animation:anim("projShift",".6s","ease","both")}}>
            Look Ahead: Built by the Watershed Project Team<em>DPW547 · Job 2124013</em>
            <span className="projul" style={{animation:anim("ulGrow",".5s","cubic-bezier(.2,.7,.2,1)",".08s both")}}/>
          </span>
        </div>
        <nav className="tabs">
          {[["board","Board"],["trends","Trends"],["milestones","Milestones"],["catalog","Catalog / CTC"]].map(([k,l])=>
            <button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>)}
        </nav>
        <div className="histnav no-print">
          <button className="histbtn" disabled={!undoStack.length} onClick={doUndo} aria-label="Undo"
            title={undoStack.length?("Undo "+undoStack[undoStack.length-1].label):"Nothing to undo"}>↶</button>
          <button className="histbtn" disabled={!redoStack.length} onClick={doRedo} aria-label="Redo"
            title={redoStack.length?("Redo "+redoStack[redoStack.length-1].label):"Nothing to redo"}>↷</button>
          <button className="histbtn themebtn" title={"Theme: "+theme+" — click to change"}
            onClick={()=>setTheme(t=>t==="system"?"light":t==="light"?"dark":"system")}>
            {theme==="light"?"☀":theme==="dark"?"☾":"⚙"}
          </button>
        </div>
        <div className="weeknav">
          <button onClick={()=>setWk(addDays(wk,-7))} aria-label="Previous week">‹</button>
          <span>{wkTitle(wk)}</span>
          <button onClick={()=>setWk(addDays(wk,7))} aria-label="Next week">›</button>
          <div className="histnav histnav-inline no-print">
            <button className="histbtn" disabled={!undoStack.length} onClick={doUndo} aria-label="Undo"
              title={undoStack.length?("Undo "+undoStack[undoStack.length-1].label):"Nothing to undo"}>↶</button>
            <button className="histbtn" disabled={!redoStack.length} onClick={doRedo} aria-label="Redo"
              title={redoStack.length?("Redo "+redoStack[redoStack.length-1].label):"Nothing to redo"}>↷</button>
            <button className="histbtn themebtn" title={"Theme: "+theme+" — click to change"}
              onClick={()=>setTheme(t=>t==="system"?"light":t==="light"?"dark":"system")}>
              {theme==="light"?"☀":theme==="dark"?"☾":"⚙"}
            </button>
          </div>
          <button className="ghost" onClick={()=>setWk(mondayOf(new Date().toISOString().slice(0,10)))}>Today</button>
          {effTab==="board" && !isMobile && <span className="spanseg no-print" title="Stack the current week plus this many ahead into one look-ahead grid — cards and dependency arrows carry across the week boundary">
            {[1,2,3,4].map(n=><button key={n} className={wkSpan===n?"on":""} onClick={()=>setWkSpan(n)} aria-label={n+"-week look-ahead"}>{n}<em>wk</em></button>)}
          </span>}
        </div>
        <div className="actions no-print">
          {effTab==="board" && <>
          <button onClick={()=>setModal({type:"eos", day: Math.min(3,(new Date().getDay()+6)%7)})}>EOS Summary</button>
          <button onClick={()=>setModal({type:"cards"})}>Print Cards</button>
          <button onClick={()=>{ setBoardPrint(true); document.body.classList.add("board-print"); const done=()=>{ document.body.classList.remove("board-print"); setBoardPrint(false); window.removeEventListener("afterprint",done); }; window.addEventListener("afterprint",done); setTimeout(()=>{ window.print(); setTimeout(done,1200); },150); }} title="Print the live color board — Procore snapshot / trailer wall (landscape, one week per page)">🖨 Board</button>
          <button onClick={()=>setModal({type:"print"})}>Print / PDF</button>
          <button onClick={shareLookaheadPdf} disabled={pdfBusy} title="Build a crisp look-ahead PDF from the schedule and share it (or download) — one page per stacked week, works on the phone">{pdfBusy?"⏳ PDF…":"📄 Share PDF"}</button>
          <button onClick={()=>setModal({type:"cheat"})}>Cheat Sheet</button>
          <button onClick={()=>setModal({type:"truckreport"})} title="Daily & weekly trucking — trucks to order, back-haul routes, cost">🚚 Trucking</button>
          <button onClick={()=>setModal({type:"trucking"})}>Trucking</button>
          <button onClick={()=>setModal({type:"rhythm"})} title="Weekly SOP touchpoints and last-updated status">📋 Rhythm</button>
          <button onClick={()=>setModal({type:"kpisummary"})} title="This week's planned/actual MH, PF, PPC and staging">📊 KPIs</button>
          </>}
          {effTab==="catalog" && <button onClick={()=>setModal({type:"data"})}>Data</button>}
          {installEvt && <button className="cta hot" onClick={async()=>{ try{ installEvt.prompt(); await installEvt.userChoice; }catch(e){} setInstallEvt(null); }} title="Install RNGD Look-Ahead on this device">⬇ Install</button>}
          <span className="syncwrap">
          <button ref={syncBtnRef} className={"pill syncpill "+(sync.status==="synced"?"pgood":(sync.status==="key"||sync.status==="error")?"pbad":"dim")}
            onClick={()=>setSyncPop(v=>!v)}
            title={SYNC_LABEL[sync.status]+(sync.at? " · "+new Date(sync.at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"")}>
            {sync.status==="synced"?("✓ Saved"+(sync.at?" "+new Date(sync.at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"")):(sync.status==="syncing"||sync.status==="boot")?"⟳ Saving…":sync.status==="offline"?"⌁ Offline":sync.status==="local"?"Local":sync.status==="key"?"Key…":"! Error"}

            <div className="spline">Device {syncLS.device()}</div>
            {sync.detail && <div className="spline">{sync.detail}</div>}
            <div className="btnrow" style={{marginTop:8}}>
              <button className="ghost sm" onClick={()=>{ syncRef.current.nextPollAt=0; pullNow(true); const S=syncRef.current; if(S.latestJson && S.latestJson!==S.lastSyncedJson) pushNow(); }}>Sync now</button>
              <button className="ghost sm" onClick={()=>{ setSyncPop(false); setModal({type:"boardkey"}); }}>Board key</button>
            </div>
          </div>}
          </span>

      </header>

      {digest && <div className="digest no-print">
        <span className="dgtag">Standup</span>
        <span className="dgtxt">{digest.todayTasks} task{digest.todayTasks!==1?"s":""} on today{digest.yUnlogged>0?` · ${digest.yUnlogged} from yesterday still unlogged`:""}{digest.msSoon>0?` · ${digest.msSoon} milestone${digest.msSoon>1?"s":""} within 7 days`:""}{digest.savWk>0?` · ${fmt$(digest.savWk)} saved this week`:""}.</span>

      <div className="legend no-print">

        <button className="legendbtn" onClick={()=>setModal({type:"legend"})} title="Full SOP color-coding standard — printable">Scope legend ↗</button>

        <span className="tagswitch">
          <span className="viewseg">
            {[["bold","HQ","#2F82DB"],["highlighter","Ops","#F0C22E"],["flat","CNO","#12A150"]].map(([k,l,c])=><button key={k} className={cardStyle===k?"on":""} onClick={()=>setCardStyle(k)} title={l}><span className="tagswitch-txt">{l}</span><i className="tagswitch-dot" style={{background:c}}/></button>)}
          </span>
        </span>
        <button className="snapbtn" onClick={takeSnapshot} title="Freeze the current plan as the baseline">{baseline?("Baseline "+baseline.takenAt.slice(5)):"Take snapshot"}</button>
        <button className="snapbtn" title="Move every unlogged task in this week to the same day next week (finished work stays put)" onClick={()=>{ const open=tasks.filter(t=>t.wk===wk&&!logs[t.id]).length; if(open && window.confirm(`Roll ${open} unfinished task${open>1?"s":""} from this week into next week?`)){ const n=rollForward(); flash(`Rolled ${n} task${n>1?"s":""} into next week`); } else if(!open){ flash("Nothing unfinished to roll forward"); } }}>Roll forward ⤳</button>
        <button className="snapbtn" title="Mark a day rained out — every crew's work from that day pushes one working day, and the day's EOS records a rain-out" onClick={()=>setModal({type:"rainout"})}>⛈ Rain-out</button>
        <button className="snapbtn" title="Set where the day-by-day forecast is pulled from" onClick={()=>setModal({type:"wxloc"})}>🌦 Weather loc</button>
        <span className="hint">drag a card to move it · ⌘/Ctrl-click to multi-select · Re-flow forecasts catch-up vs each crew's MH cap</span>
      </div>
      {rainRisk && <div className="wxnudge no-print">
        <span className="wxntag">⛈ {DAYS[rainRisk.day]} {dLabel(mondayOf(rainRisk.date),(new Date(rainRisk.date+"T12:00:00").getDay()+6)%7)}</span>
        <span className="wxntxt"><b>{rainRisk.rain}% rain</b> forecast — {rainRisk.n} task{rainRisk.n>1?"s":""} scheduled that day.</span>
        <button className="wxnbtn" onClick={()=>setModal({type:"rainout", date:rainRisk.date})}>Plan rain-out →</button>
      </div>}

      {sel.size>0 && <div className="selbar no-print"><b>{sel.size}</b> task{sel.size>1?"s":""} selected — drag to move, or bulk-shift:
        <span className="shiftgrp">
          <button onClick={()=>shiftSelected(-5)} title="Back one week">⟪ wk</button>
          <button onClick={()=>shiftSelected(-1)} title="Back one working day">◀ day</button>
          <button onClick={()=>shiftSelected(1)} title="Forward one working day">day ▶</button>
          <button onClick={()=>shiftSelected(5)} title="Forward one week">wk ⟫</button>
        </span>
        <button onClick={()=>setSel(new Set())}>Clear</button></div>}
      <div className="boardprinthdr print-only">
        <div className="bphtitle">DPW547 · Job 2124013 — Look-Ahead Board · {wkTitle(wk)}</div>
        <div className="bphleg">{Object.keys(SCOPES).filter(k=>k!=="gen").map(k=><span key={k}><i style={{background:SCOPES[k].bg}}/>{SCOPES[k].code} {SCOPES[k].name}</span>)}</div>
      </div>
      </>}
      </div>

      <div className={"bodyzone"+(effTab==="board"&&!isMobile?" stripzone":"")}>
      {/* ============ BOARD GRID ============ */}
      {effTab==="board" && (isMobile ? <MobileBoard {...{crewsOnly,subsOnly,siteRows,weekTasks,notes,setNotes,wk,taskCalc,setModal,showEquip,sel,rescheduleDrop,milestones,cardStyle,setCardStyle,depMap,runDayMap,wxForDate}}/> :
      <div className="boardmain">
      <div className={"boardwrap"+(spanWeeks.length>1?" multiweek":"")} ref={boardWrapRef}>
        {boardPrint
          /* print-only: the strip can't paginate horizontally, so 🖨 Board falls back to the stacked
             one-table-per-week rendering the print CSS already breaks one week per landscape page */
          ? spanWeeks.map((w,wi)=>
              <WeekTable key={w} wk={w} primary={wi===0} {...{crewsOnly,subsOnly,siteRows,tasks,notes,setNotes,addingIn,setAddingIn,addResource,logs,cfg,setModal,taskCalc,showEquip,sel,toggleSel,rescheduleDrop,reflow,reflowOn,cardStyle,depMap,runDayMap,linkApi,resizeApi:resizeRunToEnd,milestones,rainDays,holidays,wxForDate}}/>)
          : <BoardStrip {...{spanWeeks,crewsOnly,subsOnly,siteRows,tasks,notes,setNotes,addingIn,setAddingIn,addResource,logs,cfg,setModal,taskCalc,showEquip,sel,toggleSel,rescheduleDrop,reflow,reflowOn,cardStyle,depMap,runDayMap,linkApi,resizeApi:resizeRunToEnd,milestones,rainDays,holidays,wxForDate}}/>}
        <StormLayer {...{stormSig,wk,wkSpan,cardStyle,reflowOn,tasks,boardPrint}}/>
        <DepLayer {...{deps,depMap,tasks,wk,wkSpan,cardStyle,reflowOn,boardPrint,apiRef:depLayerRef}}/>
      </div>
      <CrewRail {...{crewsOnly,subsOnly,weekTasks,taskCalc,reflow,reflowOn,setModal,showEquip}}/>
      </div>)}

      {effTab==="trends" && <Trends {...{crews,tasks,logs,taskCalc,wk}}/>}
      {effTab==="milestones" && <MilestoneView {...{milestones,setMilestones}}/>}
      {effTab==="catalog" && (catalogOK
        ? <CatalogView installedFor={installedFor} fcst={fcst} ctcOf={ctcOf} remainingFor={remainingFor} contractQtyFor={contractQtyFor} umOverrides={umOverrides} setUmOverrides={setUmOverrides} openSched={ci=>setModal({type:"sched",ci})}/>
        : <CatalogGate onUnlock={()=>{ setCatalogOK(true); try{sessionStorage.setItem("catUnlock","1");}catch(e){} }}/>)}
      </div>


      {/* ============ MODALS ============ */}
      {modal?.type==="task"    && <TaskModal t={tasks.find(x=>x.id===modal.id)} {...{logs,saveLog,rmTask,rmRun,dupRun,resliceRun,resliceRunCatchup,asapRun,setRunDig,upTask,cfg,installedFor,fcstFor,crews,tasks,deps,depMap,addDep,rmDep,wk,close:()=>setModal(null)}}/>}
      {modal?.type==="crew"    && <CrewModal res={crews.find(c=>c.id===modal.id)} {...{weekTasks,logs,taskCalc,setCrews,rmResource,close:()=>setModal(null)}}/>}
      {modal?.type==="sched"   && <SchedModal {...{wk:(modal.wk||wk),crews,cfg,installedFor,preset:modal, lastRes:(tasks.length?tasks[tasks.length-1].res:null), tasks, holidays, addDep, close:()=>setModal(null), add:(list)=>{setTasks(t=>[...t,...list]); setModal(null);} }}/>}
      {modal?.type==="eos"     && <EOSModal {...{wk,day:modal.day,crews,weekTasks,logs,taskCalc,saveLog,eosMeta,setEosMeta,rainDays,cfg,close:()=>setModal(null)}}/>}
      {modal?.type==="rainout" && <RainoutModal {...{wk,tasks,rainDays,applyRainout,clearRainout,preset:modal.date,close:()=>setModal(null)}}/>}
      {modal?.type==="holidays" && <HolidayModal {...{holidays,setHolidays,close:()=>setModal(null)}}/>}
      {modal?.type==="wxloc"    && <WeatherLocModal {...{cfg,setCfg,close:()=>setModal(null)}}/>}
      {modal?.type==="cheat"   && <CheatSheetModal {...{wk,weekTasks,taskCalc,crews,cfg,close:()=>setModal(null)}}/>}
      {modal?.type==="truckreport" && <TruckReportModal {...{wk,weekTasks,crews,taskCalc,cfg,setCfg,savings,setSavings,close:()=>setModal(null)}}/>}
      {modal?.type==="print"   && <PrintModal {...{crews,weekTasks,tasks,logs,notes,siteRows,taskCalc,installedFor,fcst,cfg,umOverrides,wk,close:()=>setModal(null)}}/>}
      {modal?.type==="cards"   && <CardExportModal {...{weekTasks,runDayMap,crews,taskCalc,cfg,wk,close:()=>setModal(null)}}/>}
      {modal?.type==="legend"  && <LegendModal close={()=>setModal(null)}/>}
      {modal?.type==="qlog"    && (()=>{ const t=tasks.find(x=>x.id===modal.id); return t && <QuickLogModal t={t} c={taskCalc(t)} lg={logs[t.id]||{}} saveLog={saveLog} openFull={()=>setModal({type:"task",id:t.id})} close={()=>setModal(null)}/>; })()}
      {modal?.type==="data"    && <DataModal {...{cfg,setCfg,ctc,setCtc,close:()=>setModal(null)}}/>}
      {modal?.type==="boardkey" && <BoardKeyModal close={()=>setModal(null)}
          onSet={k=>{ syncLS.setKey(k); const S=syncRef.current; S.keyPrompted=false; S.nextPollAt=0; pullNow(true); }}/>}
      {modal?.type==="trucking" && <TruckingModal {...{truckDay,setTruckDay,savings,setSavings,cfg,setCfg,close:()=>setModal(null)}}/>}
      {modal?.type==="rhythm" && <RhythmModal lastUpdated={lastUpdated} setModal={setModal} close={()=>setModal(null)}/>}
      {modal?.type==="kpisummary" && <KpiModal kpi={kpi} weekPlan={weekPlan} close={()=>setModal(null)}/>}
      {modal?.type==="note"    && <NoteModal note={notes.find(n=>n.id===modal.id)} rowId={modal.row} day={modal.day}
          save={(n)=>{ setNotes(ns=> n.id? ns.map(x=>x.id===n.id?n:x) : [...ns,{...n,id:"nn"+Math.random().toString(36).slice(2,7)}]); setModal(null);}}
          del={id=>{setNotes(ns=>ns.filter(x=>x.id!==id)); setModal(null);}} close={()=>setModal(null)}/>}
    </div>
  );
}

/* ============ BOARD PIECES ============ */
function SectionRow({label,onAdd,span=8}){
  return <tr className="secrow"><td colSpan={span}><span>{label}</span><button className="addbtn no-print" onClick={onAdd}>+ Add</button></td></tr>;
}
function AddRow({ph,onAdd,onX,span=8}){
  const [v,setV]=useState("");
  return <tr className="addrow no-print"><td colSpan={span}>
    <input autoFocus placeholder={ph} value={v} onChange={e=>setV(e.target.value)}
      onKeyDown={e=>{ if(e.key==="Enter"&&v.trim()) onAdd(v.trim()); if(e.key==="Escape") onX(); }}/>
    <button className="cta sm" disabled={!v.trim()} onClick={()=>onAdd(v.trim())}>Add</button>
    <button className="ghost sm" onClick={onX}>Cancel</button>
  </td></tr>;
}
function CrewRail({crewsOnly,subsOnly,weekTasks,taskCalc,reflow,reflowOn,setModal,showEquip}){
  const recap = res => { let p=0,a=0,e=0,q=0,pq=0,cells=0,logged=0;
    weekTasks.filter(t=>t.res===res.id).forEach(t=>{ const c=taskCalc(t); p+=c.planMH; a+=c.actMH; e+=c.earnMH; pq+=t.qty; q+=c.actQty; cells++; if(c.actMH||c.actQty)logged++; });
    return {p,a,e,q,pq,cells,logged,pf:a>0?e/a:0}; };
  const equipFor = res => { const set=new Set();
    weekTasks.filter(t=>t.res===res.id && t.equip).forEach(t=> String(t.equip).split(",").map(s=>s.trim()).filter(Boolean).forEach(e=>set.add(e)));
    return [...set]; };
  const card = (res,kind)=>{ const r=recap(res); if(!r.cells) return null;
    const st = reflowOn ? reflow.byCrew[res.id] : null;
    const eq = showEquip ? equipFor(res) : [];
    const tone = r.pf>=1?"good":r.pf>=0.9?"warn":r.pf>0?"bad":"";
    return <button key={res.id} className="rlcard" onClick={()=>setModal({type:"crew",id:res.id})}>
      <div className="rltop"><b>{res.name}</b><span className={"pill "+(r.pf>=1?"pgood":r.pf>0?"pbad":"dim")}>{r.pf?r.pf.toFixed(2):"—"}</span></div>
      <div className="rlbar"><i className={tone} style={{width:Math.min(100,r.p?r.a/r.p*100:0)+"%"}}/></div>
      <div className="rlnums"><span>{fmtN(r.a)}/{fmtN(r.p)} MH</span><span>{r.pq?pct(r.q/r.pq):"—"}</span></div>
      {st && <span className={"cstat "+st.status}>{st.status==="behind"?("Behind +"+st.extraDays+"d"):st.status==="over"?"Over cap":"On plan"}</span>}
      {st && st.trucksNeeded>0 && (()=>{ const smart=st.smartTrucks??st.trucksNeeded, saved=st.hoursSaved||0;
        return <div className={"rltruck"+(st.truckShort?" short":"")} title={`Dedicated ${st.trucksNeeded}/day${smart<st.trucksNeeded?` · back-haul ${smart}`:""}${st.trucksAvail?` · have ${st.trucksAvail}`:""}`}>🚚 {smart} truck{smart!==1?"s":""}/day{saved>0.05?` · saves ~${fmtN(saved,1)}h`:""}{st.trucksAvail?(" · have "+st.trucksAvail):""}{st.truckShort?" — short":""}</div>; })()}
      {eq.length>0 && <div className="rlequip">🔧 {eq.join(" · ")}</div>}
    </button>; };
  const crewCards = crewsOnly.map(c=>card(c,"crew")).filter(Boolean);
  const subCards = subsOnly.map(c=>card(c,"sub")).filter(Boolean);
  return <aside className="crewrail no-print">
    <div className="rlhead">This week — crew recap</div>
    {crewCards.length? crewCards : <div className="rlempty">No crew production this week.</div>}
    {subCards.length>0 && <><div className="rldiv">Subcontractors</div>{subCards}</>}
  </aside>;
}
/* One week of the look-ahead grid: its own day-header row + Crews/Subcontractors (and, on the
   primary week, Site + add-resource affordances). Several WeekTables stack inside one .boardwrap so
   the single DepLayer overlay can draw finish-to-start and run-chain arrows across week boundaries. */
function WeekTable({wk,primary,crewsOnly,subsOnly,siteRows,tasks,notes,setNotes,addingIn,setAddingIn,addResource,
  logs,cfg,setModal,taskCalc,showEquip,sel,toggleSel,rescheduleDrop,reflow,reflowOn,cardStyle,depMap,runDayMap,
  linkApi,resizeApi,milestones,rainDays,holidays,wxForDate}){
  const weekTasks = useMemo(()=>tasks.filter(t=>t.wk===wk),[tasks,wk]);
  // Days whose rain chance is ≥ 40% get the storm treatment (animated rain + lightning down the column).
  const stormDays = DAYS.map((_,i)=>{ const w=wxForDate(addDays(wk,i)); return !!(w && w.rain!=null && w.rain>=40); });
  const shared = {wk,weekTasks,logs,cfg,setModal,taskCalc,showEquip,sel,toggleSel,rescheduleDrop,reflow,reflowOn,cardStyle,depMap,runDayMap,linkApi,resizeApi,stormDays};
  return (
    <table className="board">
      <thead>
        <tr>
          <th className="rescol">Resource</th>
          {DAYS.map((d,i)=>{
            const date=addDays(wk,i); const today = date===new Date().toISOString().slice(0,10);
            const ms = milestones.filter(m=>m.date===date); const rain = !!rainDays[date]; const hol = i<=4 && holidays[date];
            const w = wxForDate(date); const storm = stormDays[i];
            return <th key={d} className={(i>4?"wknd ":"")+(today?"today ":"")+(rain?"rain ":"")+(storm?"stormy ":"")+(hol?"holiday":"")}>
              <span>{d}</span><b>{dLabel(wk,i)}</b>
              {w && <span className={"wxflag"+(w.rain>=60?" wet":w.rain>=40?" storm":"")} title={w.rain!=null?`${w.rain}% chance of rain`:""}>{wxIcon(w.code)} {Math.round(w.tmax)}°/{Math.round(w.tmin)}°{w.rain!=null && <span className="wxrain"> 💧{w.rain}%</span>}</span>}
              {hol && <span className="holflag" title={hol+" — non-working holiday"}>🗓 {hol.length>16?hol.slice(0,15)+"…":hol}</span>}
              {rain && <span className="rainflag" title="Rained out — no work this day">⛈ Rain-out</span>}
              {ms.map(m=><span key={m.id} className="msflag" title={m.label}><i className="msdiamond"/>{m.label.length>16?m.label.slice(0,15)+"…":m.label}</span>)}</th>;
          })}
        </tr>
      </thead>
      <tbody>
        {primary && <SectionRow label="Crews" onAdd={()=>setAddingIn("crew")} />}
        {primary && addingIn==="crew" && <AddRow ph="Foreman / crew name" onAdd={n=>addResource("crew",n)} onX={()=>setAddingIn(null)} />}
        {crewsOnly.map((c,idx)=><ResRow key={c.id} res={c} kind="crew" idx={idx} {...shared}/>)}

        {primary && <SectionRow label="Subcontractors" onAdd={()=>setAddingIn("sub")} />}
        {primary && addingIn==="sub" && <AddRow ph="Subcontractor name" onAdd={n=>addResource("sub",n)} onX={()=>setAddingIn(null)} />}
        {subsOnly.map((c,idx)=><ResRow key={c.id} res={c} kind="sub" idx={idx} {...shared}/>)}

        {primary && <SectionRow label="Site" onAdd={()=>setAddingIn("site")} />}
        {primary && addingIn==="site" && <AddRow ph="New site row (e.g. Deliveries, Inspections)" onAdd={n=>addResource("site",n)} onX={()=>setAddingIn(null)} />}
        {primary && siteRows.map(r=><SiteRow key={r.id} row={r} notes={notes} setNotes={setNotes} setModal={setModal} stormDays={stormDays}/>)}
      </tbody>
    </table>
  );
}
/* One day-header cell — shared shape with WeekTable's header (date, weather, holiday, rain-out,
   milestones, storm marking) for the strip's continuous day row. */
function DayTh({wk,i,wkstart,milestones,rainDays,holidays,wxForDate}){
  const date=addDays(wk,i); const today = date===new Date().toISOString().slice(0,10);
  const ms = milestones.filter(m=>m.date===date); const rain = !!rainDays[date]; const hol = i<=4 && holidays[date];
  const w = wxForDate(date); const storm = !!(w && w.rain!=null && w.rain>=40);
  return <th className={(i>4?"wknd ":"")+(today?"today ":"")+(rain?"rain ":"")+(storm?"stormy ":"")+(hol?"holiday ":"")+(wkstart?"wkstart":"")}>
    <span>{DAYS[i]}</span><b>{dLabel(wk,i)}</b>
    {w && <span className={"wxflag"+(w.rain>=60?" wet":w.rain>=40?" storm":"")} title={w.rain!=null?`${w.rain}% chance of rain`:""}>{wxIcon(w.code)} {Math.round(w.tmax)}°/{Math.round(w.tmin)}°{w.rain!=null && <span className="wxrain"> 💧{w.rain}%</span>}</span>}
    {hol && <span className="holflag" title={hol+" — non-working holiday"}>🗓 {hol.length>16?hol.slice(0,15)+"…":hol}</span>}
    {rain && <span className="rainflag" title="Rained out — no work this day">⛈ Rain-out</span>}
    {ms.map(m=><span key={m.id} className="msflag" title={m.label}><i className="msdiamond"/>{m.label.length>16?m.label.slice(0,15)+"…":m.label}</span>)}</th>;
}
/* The horizontal look-ahead strip: ONE grid, each crew a single row running left→right across every
   spanned week (7×N day columns) — scroll sideways to move week-to-week. Crew names pin left
   (sticky rescol) and the two header rows pin top. DepLayer/StormLayer overlay it unchanged
   (both position from the DOM). 🖨 Board still prints the stacked per-week tables. */
function BoardStrip({spanWeeks,crewsOnly,subsOnly,siteRows,tasks,notes,setNotes,addingIn,setAddingIn,addResource,
  logs,cfg,setModal,taskCalc,showEquip,sel,toggleSel,rescheduleDrop,reflow,reflowOn,cardStyle,depMap,runDayMap,
  linkApi,resizeApi,milestones,rainDays,holidays,wxForDate}){
  const nCols = 1 + 7*spanWeeks.length;
  // flat (week, day) column list; Mondays of later weeks carry the week-separator border
  const todayISO = new Date().toISOString().slice(0,10);
  const cols = useMemo(()=> spanWeeks.flatMap((w,wi)=> DAYS.map((_,d)=>{
    const date=addDays(w,d), f=wxForDate(date);
    return { w, d, storm:!!(f&&f.rain!=null&&f.rain>=40), wkstart:d===0&&wi>0, today:date===todayISO };
  })), [spanWeeks, wxForDate, todayISO]);
  const shared = {logs,cfg,setModal,taskCalc,showEquip,sel,toggleSel,rescheduleDrop,reflow,reflowOn,cardStyle,depMap,runDayMap,linkApi,resizeApi,tasks,cols};
  // Fixed geometry — day columns hold their width no matter how wordy a card is; weekends run slim.
  const DAYW=150, WKNDW=96, RESW=92;
  const tblW = RESW + cols.reduce((a,cl)=>a+(cl.d>4?WKNDW:DAYW),0);
  return (
    <table className="board strip" style={{width:tblW}}>
      <colgroup>
        <col style={{width:RESW}}/>
        {cols.map(cl=><col key={cl.w+"_"+cl.d} style={{width:cl.d>4?WKNDW:DAYW}}/>)}
      </colgroup>
      <thead>
        <tr className="bands">
          <th className="rescol" rowSpan={2}>Resource</th>
          {spanWeeks.map((w,wi)=><th key={w} colSpan={7} className={"wkband"+(wi>0?" wkstart":"")}>
            <span>{wkTitle(w)}</span><em>{wi===0?"current week":"+"+wi+" wk"}</em></th>)}
        </tr>
        <tr className="days">
          {cols.map(cl=><DayTh key={cl.w+"_"+cl.d} wk={cl.w} i={cl.d} wkstart={cl.wkstart} {...{milestones,rainDays,holidays,wxForDate}}/>)}
        </tr>
      </thead>
      <tbody>
        <SectionRow label="Crews" onAdd={()=>setAddingIn("crew")} span={nCols}/>
        {addingIn==="crew" && <AddRow ph="Foreman / crew name" onAdd={n=>addResource("crew",n)} onX={()=>setAddingIn(null)} span={nCols}/>}
        {crewsOnly.map((c,idx)=><ResRow key={c.id} res={c} kind="crew" idx={idx} {...shared}/>)}

        <SectionRow label="Subcontractors" onAdd={()=>setAddingIn("sub")} span={nCols}/>
        {addingIn==="sub" && <AddRow ph="Subcontractor name" onAdd={n=>addResource("sub",n)} onX={()=>setAddingIn(null)} span={nCols}/>}
        {subsOnly.map((c,idx)=><ResRow key={c.id} res={c} kind="sub" idx={idx} {...shared}/>)}

        <SectionRow label="Site" onAdd={()=>setAddingIn("site")} span={nCols}/>
        {addingIn==="site" && <AddRow ph="New site row (e.g. Deliveries, Inspections)" onAdd={n=>addResource("site",n)} onX={()=>setAddingIn(null)} span={nCols}/>}
        {siteRows.map(r=><SiteRow key={r.id} row={r} notes={notes} setNotes={setNotes} setModal={setModal} cols={cols} primaryWk={spanWeeks[0]}/>)}
      </tbody>
    </table>
  );
}
function ResRow({res,kind,idx,wk,weekTasks,logs,cfg,setModal,taskCalc,showEquip,sel,toggleSel,rescheduleDrop,reflow,reflowOn,cardStyle,depMap,runDayMap,linkApi,resizeApi,stormDays,cols,tasks}){
  const mine = d => weekTasks.filter(t=>t.res===res.id && t.day===d);
  const over = e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; e.currentTarget.classList.add("drop"); };
  const leave = e=>{ if(!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove("drop"); };
  const drop = (e,d,w)=>{ e.preventDefault(); e.currentTarget.classList.remove("drop"); const id=e.dataTransfer.getData("text/plain"); if(id) rescheduleDrop(id,res.id,d,w||wk); };
  return (
    <>
    <tr className={idx%2?"altrow":""}>
      <td className="rescol">

        {reflowOn && (()=>{ const st=reflow.byCrew[res.id]; if(!st) return null;

function computeReflow(tasks, logs, baseline, crews, cfg){

/* ============ DEPENDENCY ARROWS + DRAG-TO-LINK OVERLAY (desktop board) ============

    <svg ref={svgRef} className="deparrows" width={st.W} height={st.H} style={{width:st.W,height:st.H}}>
      <defs>
        <marker id="depah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--lime)"/></marker>
