/* Input that keeps local state while typing and commits on blur / Enter — avoids
   fighting the debounced global re-render while a field is being edited. */
function BlurInput({value,onCommit,...props}){
  const [v,setV]=useState(value??"");
  useEffect(()=>{ setV(value??""); },[value]);
  return <input {...props} value={v} onChange={e=>setV(e.target.value)}
    onBlur={()=>{ if(String(v)!==String(value??"")) onCommit(v); }}
    onKeyDown={e=>{ if(e.key==="Enter") e.currentTarget.blur(); }}/>;
}

/* ============ TASK MODAL — two tabs: Details & Log / Edit ============ */
function TaskModal({t,logs,saveLog,rmTask,rmRun,resliceRun,upTask,cfg,installedFor,fcstFor,crews,tasks,deps,addDep,rmDep,wk,close}){
  const [tab,setTab]=useState("log");
  const [picking,setPicking]=useState(false);
  const [q,setQ]=useState("");
  const [predAdd,setPredAdd]=useState(false); const [predQ,setPredQ]=useState("");
  const it = itemFor(t), ecfg = cfgFor(t,cfg), bit = CATALOG[t.ci];
  // Run (multi-day operation) this card belongs to, and its predecessors.
  const myKey = runKey(t);
  const runN = tasks.filter(x=>runKey(x)===myKey).length;
  const myPreds = deps[myKey]||[];
  const crewName = id => (crews.find(c=>c.id===id)||{}).name || id;
  const reachesKey = (from,to,seen)=>{ if(from===to) return true; if(seen.has(from)) return false; seen.add(from); return (deps[from]||[]).some(p=>reachesKey(p,to,seen)); };
  const myStartWdi = Math.min(...tasks.filter(x=>runKey(x)===myKey).map(x=>wdi(x.wk,x.day)));
  const candidateRuns = useMemo(()=>{
    const keys=[...new Set(tasks.map(runKey))].filter(k=> k!==myKey && !myPreds.includes(k) && !reachesKey(k,myKey,new Set()));
    const cands=keys.map(key=>runInfoFor(tasks,crews,key)).filter(Boolean).map(r=>({...r, search:(r.item+" "+r.crew+" "+r.loc+" "+r.cc).toLowerCase()}));
    return rankRuns(cands, t.res, myStartWdi);
  },[tasks,deps,myKey]);
  const lg = logs[t.id]||{};
  const [qty,setQty]=useState(lg.qty??"");
  const [mh,setMh]=useState(lg.mh??"");
  // Station-to-station takeoff (Edit): width/depth/density are ephemeral — they only
  // compute a generated qty (via the shared staGenQty), they are never saved on the task.
  const [width,setWidth]=useState(""); const [depth,setDepth]=useState(""); const [dens,setDens]=useState("");
  const kind = unitKind(it[CI.UM]);
  const staLen = t.sta ? Math.abs(t.sta[1]-t.sta[0]) : null;
  const genQty = staGenQty(it[CI.UM], staLen, +width, +depth, +dens);
  // Run-plan measurements (whole-run re-slice controls).
  const runMem = tasks.filter(x=>runKey(x)===myKey).slice().sort((a,b)=>wdi(a.wk,a.day)-wdi(b.wk,b.day));
  const runSta = kind!=="callout" && runMem.length>0 && runMem.every(m=>m.sta);
  const runS0 = runMem[0]&&runMem[0].sta ? runMem[0].sta[0] : null;
  const runEnd = runMem.length&&runMem[runMem.length-1].sta ? runMem[runMem.length-1].sta[1] : null;
  const runQtot = runMem.reduce((s,m)=>s+(+m.qty||0),0);
  const runLocked = runMem.filter(m=>logs[m.id]!=null).length;
  const runAvgVal = runN ? Math.round((runQtot/runN)*100)/100 : 0;
  const runFirst = runMem[0];
  const cat=SCOPES[scopeOf(t,crews)];
  const hasOv = !!(t.ov && Object.keys(t.ov).length);
  const budUC=unitCost(it), f=fcstFor(t);
  const inst=installedFor(t.ci), est=it[CI.EST]||0;
  const dayRate = it[CI.MH]>0 ? (ecfg.crewSize*ecfg.shiftHrs)/it[CI.MH] : t.qty;
  const loads = ecfg.truckRate>0 ? (t.qty*it[CI.UT])/ecfg.truckRate : 0;
  const fac=f.uc*est, budTot=budUC*est, cvar=budTot-fac;
  const margin=(it[CI.BID]-f.uc)*est;
  const setOv=(k,v)=>{ const o={...(t.ov||{})}; if(v==null||v==="") delete o[k]; else o[k]=v; upTask(t.id,{ov:Object.keys(o).length?o:null}); };
  const results = useMemo(()=>{
    const s=q.trim().toLowerCase(); if(!s) return [];
    return CATALOG.map((r,i)=>({r,i}))
      .filter(({r})=>r[CI.TASK].toLowerCase().includes(s)||r[CI.CC].toLowerCase().includes(s)||r[CI.PAY].toLowerCase().includes(s))
      .slice(0,30);
  },[q]);
  const ovIn = (k,label,base,numeric)=>(
    <label>{label}
      <BlurInput className={t.ov&&t.ov[k]!=null?"ovon":""} type={numeric?"number":"text"}
        value={t.ov?.[k] ?? ""} placeholder={String(base)}
        onCommit={v=>setOv(k, numeric ? (v===""||isNaN(+v)?null:+v) : (String(v).trim()||null))}/>
    </label>
  );
  return (
    <Modal close={close} w={640}>
      <h3>{it[CI.TASK]}</h3>
      <div className="chiprow">
        <span className="pill" style={{background:cat.bg,color:cat.tx}}>{cat.code} · {cat.name}</span>
        <span className="pill dim">Cost {it[CI.CC]}</span>
        <span className="pill dim">Pay {it[CI.PAY]}</span>
        {hasOv && <span className="pill ovpill">custom</span>}
      </div>
      <div className="qmode mtabs">
        <button className={tab==="log"?"on":""} onClick={()=>setTab("log")}>Details & Log</button>
        <button className={tab==="edit"?"on":""} onClick={()=>setTab("edit")}>Edit</button>
      </div>

      {tab==="log" ? <>
      <table className="dt">
        <tbody>
          <tr><th>Rate</th><td>{fmtN(dayRate,dayRate<10?1:0)} {it[CI.UM]}/day</td><th>MH / {it[CI.UM]}</th><td>{fmtN(it[CI.MH],3)}</td></tr>
          <tr><th>Crew</th><td>{ecfg.crewSize} @ {fmt$(ecfg.laborRate)}/MH</td><th>Mat / {it[CI.UM]}</th><td>{fmt$(it[CI.UM$],2)}</td></tr>
          <tr><th>Trucking / {it[CI.UM]}</th><td>{fmt$(it[CI.UT],2)}</td><th>Est. loads (plan)</th><td>{loads?fmtN(loads,1):"—"}</td></tr>
        </tbody>
      </table>

      <table className="dt fcst">
        <tbody>
          <tr><th>Budget UC</th><td>{fmt$(budUC,2)}</td><th>Forecast UC</th><td className={f.drift>0.005?"neg":f.drift<-0.005?"pos":""}>{fmt$(f.uc,2)}</td></tr>
          <tr><th>Installed</th><td>{fmtN(inst)}/{fmtN(est)} {it[CI.UM]} ({est?pct(inst/est):"—"})</td><th>FAC</th><td>{fmt$(fac)}</td></tr>
          <tr><th>Cost var</th><td className={cvar<0?"neg":"pos"}>{fmt$(cvar)}</td><th>Pay / {it[CI.UM]}</th><td>{fmt$(it[CI.BID],2)}</td></tr>
          <tr><th>Proj. margin</th><td className={margin<0?"neg":"pos"} colSpan={3}>{fmt$(margin)}</td></tr>
        </tbody>
      </table>

      <div className="loghdr">Log — plan {fmtN(t.qty)} {it[CI.UM]} / {fmtN(t.qty*it[CI.MH])} MH</div>
      <div className="logrow">
        <label>Qty ({it[CI.UM]})<input type="number" value={qty} onChange={e=>setQty(e.target.value)}/></label>
        <label>Manhours<input type="number" value={mh} onChange={e=>setMh(e.target.value)}/></label>
      </div>
      <div className="btnrow">
        <button className="cta" onClick={()=>{saveLog(t.id,qty,mh,true); close();}}>Save</button>
        <button className="ghost" onClick={()=>{saveLog(t.id,qty,mh,false); close();}}>Save as in-progress</button>
        <span className="sp"/>
        {runN>1 && <button className="danger" onClick={()=>{ if(window.confirm("Delete all "+runN+" days of this run (crew + item + location)?")) rmRun(t); }}>Delete run ({runN})</button>}
        <button className="danger" onClick={()=>rmTask(t.id)}>Delete task</button>
      </div>
      </> : <>

      <div className="loghdr">Plan</div>
      {!picking ?
        <div className="selitem">
          <div><b>{bit[CI.TASK]}</b><em>{bit[CI.CC]} · Pay {bit[CI.PAY]} · {fmtN(bit[CI.MH],3)} MH/{bit[CI.UM]}</em></div>
          <button className="ghost sm" onClick={()=>setPicking(true)}>Change item</button>
        </div> :
        <>
          <input autoFocus className="search" placeholder="Search item, cost code, or pay item — e.g. 51x31, HPPP, 33.40" value={q} onChange={e=>setQ(e.target.value)}/>
          <div className="results">
            {results.map(({r,i})=>
              <button key={i} onClick={()=>{ upTask(t.id,{ci:i, ov:null}); setPicking(false); setQ(""); }}>
                <i style={{background:SCOPES[scopeKeyOf(r[CI.CC])].bg}}/>
                <span>{r[CI.TASK]}</span>
                <em>{r[CI.CC]} · {r[CI.PAY]} · {r[CI.UM]}</em>
              </button>)}
            {q && results.length===0 && <div className="empty">No catalog match — try part of the cost code or pay item.</div>}
            {!q && <div className="empty">Pick the new catalog item for this card.</div>}
          </div>
          <div className="ovnote">Switching the item clears any per-card overrides below.</div>
          <div className="btnrow"><button className="ghost sm" onClick={()=>{setPicking(false); setQ("");}}>Keep current item</button></div>
        </>}
      <div className="logrow">
        <label>Crew / sub<select value={t.res} onChange={e=>upTask(t.id,{res:e.target.value})}>{crews.map(c=><option key={c.id} value={c.id}>{c.name}{c.type==="sub"?" (sub)":""}</option>)}</select></label>
        <label>Day<select value={t.day} onChange={e=>upTask(t.id,{day:+e.target.value})}>{DAYS.map((d,i)=><option key={d} value={i}>{d} {dLabel(t.wk,i)}</option>)}</select></label>
        <label>Week (snaps to Mon)<input type="date" value={t.wk} onChange={e=>{ if(e.target.value) upTask(t.id,{wk:mondayOf(e.target.value)}); }}/></label>
      </div>
      <div className="logrow">
        <label>Planned qty{runN>1?" · this day":""} ({it[CI.UM]})<BlurInput type="number" value={t.qty} onCommit={v=>upTask(t.id,{qty:+v||(kind==="callout"?1:0)})}/></label>
        {runN>1
          ? <label>This day's STA<input readOnly value={t.sta?staFmt(t.sta[0])+(t.sta[0]!==t.sta[1]?" – "+staFmt(t.sta[1]):""):"—"}/></label>
          : <>
            <label>Start STA<BlurInput placeholder="115+15.66" value={t.sta?staFmt(t.sta[0]):""} onCommit={v=>{const a=parseSTA(v), b=t.sta?t.sta[1]:null; upTask(t.id,{sta:(a!=null&&b!=null)?[a,b]:null});}}/></label>
            <label>End STA<BlurInput placeholder="118+40" value={t.sta?staFmt(t.sta[1]):""} onCommit={v=>{const b=parseSTA(v), a=t.sta?t.sta[0]:null; upTask(t.id,{sta:(a!=null&&b!=null)?[a,b]:null});}}/></label>
          </>}
      </div>
      {(kind==="area"||kind==="vol"||kind==="wt") &&
      <div className="logrow">
        <label>Width (ft)<input type="number" placeholder="e.g. 12" value={width} onChange={e=>setWidth(e.target.value)}/></label>
        {(kind==="vol"||kind==="wt") &&
          <label>Depth (ft)<input type="number" placeholder="e.g. 0.5" value={depth} onChange={e=>setDepth(e.target.value)}/></label>}
        {kind==="wt" &&
          <label>Density (TON/CY)<input type="number" placeholder="e.g. 1.4" value={dens} onChange={e=>setDens(e.target.value)}/></label>}
        <div className="gen">Generated qty<b>{genQty!=null?fmtN(genQty,genQty%1?2:0):"—"} {genQty!=null?it[CI.UM]:""}</b>
          {staLen!=null && <em className="dim2"> from {fmtN(staLen,staLen%1?2:0)} ft</em>}</div>
        <button className="ghost sm" disabled={genQty==null} onClick={()=>upTask(t.id,{qty:genQty})}>Apply to qty</button>
      </div>}
      {kind==="lin" && staLen!=null &&
      <div className="logrow">
        <div className="gen">Generated qty<b>{fmtN(genQty,genQty%1?2:0)} {it[CI.UM]}</b><em className="dim2"> = {fmtN(staLen,staLen%1?2:0)} ft run</em></div>
        <button className="ghost sm" disabled={genQty==null} onClick={()=>upTask(t.id,{qty:genQty})}>Apply to qty</button>
      </div>}
      {(runN>1 || runSta) && <>
      <div className="loghdr">Run plan · {runN} day{runN>1?"s":""}{runLocked?` · ${runLocked} logged`:""}</div>
      <div className="ovnote">Edit the run's end station or its avg/day and the whole run re-slices — extend picks up where it left off, shrink drops days. The start stays put{runLocked?"; logged days are kept":""}.</div>
      <div className="logrow">
        <label>Run start (fixed)<input readOnly value={(runS0!=null?"STA "+staFmt(runS0):"—")+(runFirst?" · "+DAYS[runFirst.day]+" "+dLabel(runFirst.wk,runFirst.day):"")}/></label>
        {runSta && <label>Run END STA<BlurInput placeholder="118+40" value={runEnd!=null?staFmt(runEnd):""} onCommit={v=>{const e=parseSTA(v); if(e!=null) resliceRun(t,{end:e});}}/></label>}
      </div>
      <div className="logrow">
        <label>Avg {it[CI.UM]}/day<BlurInput type="number" value={runAvgVal} onCommit={v=>{const p=+v; if(p>0) resliceRun(t,{perDay:p});}}/></label>
        <label>Days<BlurInput type="number" value={runN} onCommit={v=>{const d=Math.round(+v); if(d>0) resliceRun(t,{days:d});}}/></label>
        <div className="gen">Total<b>{fmtN(runQtot,runQtot%1?1:0)} {it[CI.UM]}</b>{runSta&&runS0!=null&&runEnd!=null && <em className="dim2"> · {staFmt(runS0)}→{staFmt(runEnd)}</em>}</div>
      </div>
      {runLocked>=runN && <div className="ovnote">All {runN} day(s) logged — run plan is locked.</div>}
      </>}
      {kind==="callout" &&
      <div className="ovnote">Station is a location callout for {it[CI.UM]} items — it doesn't set the quantity. Enter qty manually (defaults to 1).</div>}
      <div className="logrow">
        <label>Location<BlurInput list="loclist-edit" placeholder="Pick or type a location…" value={t.loc||""} onCommit={v=>upTask(t.id,{loc:String(v).trim()||null})}/>
          <datalist id="loclist-edit">{LOCATIONS.map(l=><option key={l} value={l}/>)}</datalist></label>
        <label>Equipment (Equipt. on card)<BlurInput placeholder="e.g. PC490, CAT 336" value={t.equip||""} onCommit={v=>upTask(t.id,{equip:String(v).trim()||null})}/></label>
        <label>Trucks (blank = auto from loads)<BlurInput placeholder="auto" value={t.trucks||""} onCommit={v=>upTask(t.id,{trucks:String(v).trim()||null})}/></label>
      </div>
      {t.wk!==wk && <div className="ovnote">This card is now on the week of {t.wk} — it will leave the current board view.</div>}

      <div className="loghdr">Predecessors — this run waits on</div>
      <div className="ovnote">Auto-starts the working day after its latest predecessor finishes. Move or lengthen a predecessor and this run follows.</div>
      <div className="chiprow">
        {myPreds.length===0 && <span className="ovnote" style={{margin:0}}>None — this run keeps its own dates.</span>}
        {myPreds.map(pk=>{ const info=runInfoFor(tasks,crews,pk); return (
          <span key={pk} className={"predchip"+(info?"":" bad")}>{info? info.item+" · "+info.crew : "(missing run)"}<button onClick={()=>rmDep(myKey,pk)} title="Remove predecessor">✕</button></span>); })}
      </div>
      {!predAdd ?
        <div className="btnrow" style={{marginTop:6}}><button className="ghost sm" onClick={()=>setPredAdd(true)}>+ Add predecessor</button></div> :
        <>
          <input autoFocus className="search" placeholder="Search a run to wait on — crew, item, or location…" value={predQ} onChange={e=>setPredQ(e.target.value)}/>
          <div className="results">
            {candidateRuns.filter(r=>!predQ.trim()||r.search.includes(predQ.trim().toLowerCase())).slice(0,20).map((r,i)=>{
              const top=i===0 && r.res===t.res && r.finishWdi<=myStartWdi;
              return (
              <button key={r.key} className={top?"top":""} onClick={()=>{ addDep(myKey,r.key); setPredAdd(false); setPredQ(""); }}>
                <i style={{background:r.bg}}/>
                <span>{r.item}</span>
                {top && <span className="rtag">closest prev</span>}
                <em>{r.crew} · {r.loc||"—"} · {r.start} · {r.days}d</em>
              </button>);})}
            {candidateRuns.length===0 && <div className="empty">No other runs on the board to wait on.</div>}
          </div>
          <div className="btnrow"><button className="ghost sm" onClick={()=>{setPredAdd(false); setPredQ("");}}>Cancel</button></div>
        </>}

      <div className="loghdr">Overrides — this card only</div>
      <div className="ovnote">Blank = catalog value (shown grey). Overrides never touch the catalog or other cards.</div>
      <div className="logrow">
        {ovIn("task","Task name",bit[CI.TASK],false)}
      </div>
      <div className="logrow">
        <label>Scope color
          <select className={t.ov&&t.ov.scope?"ovon":""} value={t.ov?.scope ?? ""} onChange={e=>setOv("scope", e.target.value||null)}>
            <option value="">(auto: {SCOPES[scopeFor(bit[CI.CC],t.res,crews)].code} · {SCOPES[scopeFor(bit[CI.CC],t.res,crews)].name})</option>
            {Object.keys(SCOPES).map(k=><option key={k} value={k}>{SCOPES[k].code} · {SCOPES[k].name}</option>)}
          </select></label>
        {ovIn("cc","Cost code",bit[CI.CC],false)}
        {ovIn("pay","Pay item",bit[CI.PAY],false)}
        {ovIn("um","Unit",bit[CI.UM],false)}
      </div>
      <div className="logrow">
        {ovIn("mh","MH / unit",bit[CI.MH],true)}
        {ovIn("crewSize","Crew size",cfg.crewSize,true)}
        {ovIn("laborRate","Labor $/MH",cfg.laborRate,true)}
      </div>
      <div className="ovnote">→ effective rate {fmtN(dayRate,dayRate<10?1:0)} {it[CI.UM]}/day · crew {ecfg.crewSize} @ {fmt$(ecfg.laborRate)}/MH</div>
      <div className="logrow">
        {ovIn("bid","Pay (bid) $/unit",bit[CI.BID],true)}
        {ovIn("ul","Labor $/unit",bit[CI.UL],true)}
        {ovIn("ue","Equip $/unit",bit[CI.UE],true)}
      </div>
      <div className="logrow">
        {ovIn("mat","Material $/unit",bit[CI.UM$],true)}
        {ovIn("sub","Sub $/unit",bit[CI.US],true)}
        {ovIn("trk","Trucking $/unit",bit[CI.UT],true)}
        {ovIn("misc","Misc $/unit",bit[CI.UX],true)}
      </div>
      <div className="btnrow">
        <button className="cta" onClick={close}>Done</button>
        {hasOv && <button className="ghost" onClick={()=>upTask(t.id,{ov:null})}>Reset all overrides</button>}
        <span className="sp"/>
        {runN>1 && <button className="danger" onClick={()=>{ if(window.confirm("Delete all "+runN+" days of this run (crew + item + location)?")) rmRun(t); }}>Delete run ({runN})</button>}
        <button className="danger" onClick={()=>rmTask(t.id)}>Delete task</button>
      </div>
      </>}
    </Modal>
  );
}

/* ============ CREW MODAL — description as TABLE ============ */
function CrewModal({res,weekTasks,logs,taskCalc,setCrews,rmResource,close}){
  const [name,setName]=useState(res.name);
  const mine = weekTasks.filter(t=>t.res===res.id).sort((a,b)=>a.day-b.day);
  let tp=0,ta=0,tpm=0,tam=0,tem=0;
  const rows = mine.map(t=>{
    const c=taskCalc(t);
    tp+=t.qty; ta+=c.actQty; tpm+=c.planMH; tam+=c.actMH; tem+=c.earnMH;
    return { t,c };
  });
  const pf = tam>0? tem/tam : 0;
  return (
    <Modal close={close} w={680}>
      <div className="crewhead">
        <button className={"pinbtn"+(res.pinned?" on":"")} title={res.pinned?"Pinned to top":"Pin my crew to the top"}
          onClick={()=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,pinned:!c.pinned}:c))}>{res.pinned?"★":"☆"}</button>
        <input className="namein" value={name} onChange={e=>setName(e.target.value)}
          onBlur={()=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,name}:c))}/>
        <span className={"pill "+(pf>=1?"pgood":pf>0?"pbad":"dim")}>PF {pf?pf.toFixed(2):"—"}</span>
        <label className="capfield">Daily MH cap<input type="number" min="0" step="1" value={res.capMH??68}
          onChange={e=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,capMH:+e.target.value||0}:c))}/></label>
        <label className="capfield">Trucks avail<input type="number" min="0" step="1" value={res.trucks??0}
          onChange={e=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,trucks:+e.target.value||0}:c))}/></label>
      </div>
      <table className="dt list">
        <thead><tr><th>Day</th><th>Item</th><th>CC</th><th className="r">Plan</th><th className="r">Actual</th><th className="r">PPC</th><th className="r">Plan MH</th><th className="r">Act MH</th></tr></thead>
        <tbody>
          {rows.length===0 && <tr><td colSpan={8} className="empty">Nothing scheduled this week — click an empty cell on the board.</td></tr>}
          {rows.map(({t,c})=>
            <tr key={t.id}>
              <td>{DAYS[t.day]}</td>
              <td>{c.it[CI.TASK].slice(0,34)}{c.it[CI.TASK].length>34?"…":""}</td>
              <td className="mono">{c.it[CI.CC]}</td>
              <td className="r">{fmtN(t.qty)} {c.it[CI.UM]}</td>
              <td className="r">{logs[t.id]?fmtN(c.actQty):"—"}</td>
              <td className={"r "+(logs[t.id]?(c.actQty>=t.qty?"pos":"neg"):"")}>{logs[t.id]&&t.qty?pct(c.actQty/t.qty):"—"}</td>
              <td className="r">{fmtN(c.planMH)}</td>
              <td className="r">{logs[t.id]?fmtN(c.actMH):"—"}</td>
            </tr>)}
        </tbody>
        {rows.length>0 && <tfoot><tr><th colSpan={3}>Week totals</th><th className="r">{fmtN(tp)}</th><th className="r">{fmtN(ta)}</th><th className="r">{tp?pct(ta/tp):"—"}</th><th className="r">{fmtN(tpm)}</th><th className="r">{fmtN(tam)}</th></tr></tfoot>}
      </table>
      <div className="btnrow"><span className="sp"/><button className="danger" onClick={()=>rmResource(res.id)}>Remove {res.type==="sub"?"subcontractor":"crew"}</button></div>
    </Modal>
  );
}

/* ============ SCHEDULE MODAL — search + station→qty (PPC logic) ============ */
function SchedModal({wk,crews,cfg,installedFor,preset,lastRes,tasks,addDep,close,add}){
  const [q,setQ]=useState("");
  const [ci,setCi]=useState(preset.ci ?? null);
  // Smart defaults: reuse the last-scheduled crew and default to today's weekday.
  const todayIdx = (()=>{ const t=new Date().toISOString().slice(0,10); for(let i=0;i<7;i++){ if(addDays(wk,i)===t) return i; } return 0; })();
  const [res,setRes]=useState(preset.res ?? lastRes ?? crews[0]?.id);
  const [day,setDay]=useState(preset.day ?? todayIdx);
  const [loc,setLoc]=useState(preset.loc ?? "");
  const [equip,setEquip]=useState("");
  const [trucks,setTrucks]=useState("");
  const [mode,setMode]=useState("qty");
  const [qty,setQty]=useState("");
  const [s0,setS0]=useState(""); const [s1,setS1]=useState("");
  const [width,setWidth]=useState(""); const [depth,setDepth]=useState(""); const [dens,setDens]=useState("");
  const [daysOv,setDaysOv]=useState("");
  const [predSel,setPredSel]=useState([]); const [predAdd,setPredAdd]=useState(false); const [predQ,setPredQ]=useState("");
  const predCands = useMemo(()=>{
    const newKey = res+"|"+ci+"|"+((loc||"").trim());
    const keys=[...new Set((tasks||[]).map(runKey))].filter(k=> k!==newKey && !predSel.includes(k));
    const cands=keys.map(k=>runInfoFor(tasks,crews,k)).filter(Boolean).map(r=>({...r, search:(r.item+" "+r.crew+" "+r.loc+" "+r.cc).toLowerCase()}));
    return rankRuns(cands, res, wdi(wk,day));
  },[tasks,crews,res,ci,loc,day,wk,predSel]);

  const results = useMemo(()=>{
    const s=q.trim().toLowerCase(); if(!s) return [];
    return CATALOG.map((r,i)=>({r,i}))
      .filter(({r})=>r[CI.TASK].toLowerCase().includes(s)||r[CI.CC].toLowerCase().includes(s)||r[CI.PAY].toLowerCase().includes(s))
      .slice(0,30);
  },[q]);

  const it = ci!=null ? CATALOG[ci] : null;
  // End field is dual-purpose in station mode: a station (has "+") ends a run and the qty is
  // computed from it; a plain number (no "+") is punched as the total qty, Start kept as a callout.
  const endIsQty = s1.trim()!=="" && !s1.includes("+");
  const a=parseSTA(s0), b = endIsQty ? null : parseSTA(s1);
  const directQty = endIsQty ? (+s1||0) : null;
  const staLen = a!=null ? (b!=null ? Math.abs(b-a) : 1) : null; // one station given ⇒ length 1
  const kind = it ? unitKind(it[CI.UM]) : "lin";                 // lin/area/vol/wt quantify; callout does not
  const genQty = it ? staGenQty(it[CI.UM], staLen, +width, +depth, +dens) : null; // LF/area/vol/wt
  const staQty = endIsQty ? directQty
    : kind==="callout"
    ? ((a!=null || (qty!=="" && +qty>0)) ? (+qty||1) : null)     // manual count; station is a callout
    : genQty;
  const useQty = mode==="sta" ? (staQty??0) : (+qty||0);
  const dayRate = it && it[CI.MH]>0 ? (cfg.crewSize*cfg.shiftHrs)/it[CI.MH] : useQty||1;
  const nDays = daysOv? Math.max(1,+daysOv) : Math.max(1, Math.ceil(useQty/Math.max(dayRate,0.0001)));
  const perDay = useQty/nDays;
  const inst = it? installedFor(ci):0, est=it? it[CI.EST]:0;
  const remaining = Math.max(0, est-inst);
  const loadsDay = it&&cfg.truckRate>0 ? (perDay*it[CI.UT])/cfg.truckRate : 0;

  return (
    <Modal close={close} w={620}>
      <h3>Schedule work</h3>
      {it && <p className="reciprocity">✓ We did the math: days, manhours, trucking loads and budget check below are auto-calculated from the pay item — just set the quantity and crew.</p>}
      {!it && <>
        <input autoFocus className="search" placeholder="Search item, cost code, or pay item — e.g. 51x31, HPPP, 33.40" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="results">
          {results.map(({r,i})=>
            <button key={i} onClick={()=>setCi(i)}>
              <i style={{background:SCOPES[scopeKeyOf(r[CI.CC])].bg}}/>
              <span>{r[CI.TASK]}</span>
              <em>{r[CI.CC]} · {r[CI.PAY]} · {r[CI.UM]}</em>
            </button>)}
          {q && results.length===0 && <div className="empty">No catalog match — try part of the cost code or pay item.</div>}
          {!q && <div className="empty">319 items loaded from QPC (MHs + tracking account).</div>}
        </div>
      </>}

      {it && <>
        <div className="selitem">
          <div><b>{it[CI.TASK]}</b><em>{it[CI.CC]} · Pay {it[CI.PAY]} · {fmtN(it[CI.MH],3)} MH/{it[CI.UM]}</em></div>
          <button className="ghost sm" onClick={()=>setCi(null)}>Change</button>
        </div>

        <div className="budbar">
          <label>Budget {fmtN(est)} {it[CI.UM]} · Installed {fmtN(inst)} ({est?pct(inst/est):"—"}) · Remaining {fmtN(remaining)}</label>
          <div className="bar"><i style={{width:Math.min(100,est?inst/est*100:0)+"%"}}/>
            {useQty>0 && <u style={{left:Math.min(100,est?inst/est*100:0)+"%", width:Math.min(100-(est?inst/est*100:0), est?useQty/est*100:0)+"%"}}/>}
          </div>
          {useQty>remaining&&remaining>0 && <div className="warnline">⚠ Plan exceeds remaining budget qty by {fmtN(useQty-remaining)} {it[CI.UM]}</div>}
        </div>

        <div className="qmode">
          <button className={mode==="qty"?"on":""} onClick={()=>setMode("qty")}>Direct qty</button>
          <button className={mode==="sta"?"on":""} onClick={()=>setMode("sta")}>Station numbers</button>
        </div>
        {mode==="qty" ?
          <div className="logrow"><label>Quantity ({it[CI.UM]})<input type="number" autoFocus value={qty} onChange={e=>setQty(e.target.value)}/></label></div> :
          <>
          <div className="logrow">
            <label>{kind==="callout"?"Start STA (callout)":"Start STA"}<input placeholder="115+15.66" value={s0} onChange={e=>setS0(e.target.value)}/></label>
            <label>End STA or qty<input placeholder="118+40, or 250 = qty" value={s1} onChange={e=>setS1(e.target.value)}/></label>
            {(kind==="lin"||endIsQty) && <div className="gen">{endIsQty?"Total qty":"Generated qty"}<b>{staQty!=null?fmtN(staQty,staQty%1?2:0):"—"} {staQty!=null?it[CI.UM]:""}</b></div>}
          </div>
          {(kind==="area"||kind==="vol"||kind==="wt") && !endIsQty &&
          <div className="logrow">
            <label>Width (ft)<input type="number" placeholder="e.g. 12" value={width} onChange={e=>setWidth(e.target.value)}/></label>
            {(kind==="vol"||kind==="wt") &&
              <label>Depth (ft)<input type="number" placeholder="e.g. 0.5" value={depth} onChange={e=>setDepth(e.target.value)}/></label>}
            {kind==="wt" &&
              <label>Density (TON/CY)<input type="number" placeholder="e.g. 1.4" value={dens} onChange={e=>setDens(e.target.value)}/></label>}
            <div className="gen">Generated qty<b>{staQty!=null?fmtN(staQty,staQty%1?2:0):"—"} {staQty!=null?it[CI.UM]:""}</b>
              {staLen!=null && <em className="dim2"> from {fmtN(staLen,staLen%1?2:0)} ft</em>}</div>
          </div>}
          {kind==="callout" && !endIsQty &&
          <div className="logrow">
            <label>Quantity ({it[CI.UM]})<input type="number" placeholder="1" value={qty} onChange={e=>setQty(e.target.value)}/></label>
            <div className="gen">Station is a callout<b>{staQty!=null?fmtN(staQty,staQty%1?2:0):"—"} {staQty!=null?it[CI.UM]:""}</b></div>
          </div>}
          <div className="ovnote">End STA with a "+" computes the qty from the run; a plain number is the total qty, punched against the Start station.</div>
          </>}

        <div className="logrow">
          <label>Location<input list="loclist" placeholder="Pick or type a location…" value={loc} onChange={e=>setLoc(e.target.value)}/>
            <datalist id="loclist">{LOCATIONS.map(l=><option key={l} value={l}/>)}</datalist></label>
          <label>Equipt.<input placeholder="e.g. PC490, CAT 336" value={equip} onChange={e=>setEquip(e.target.value)}/></label>
          <label>Trucks<input placeholder={loadsDay?fmtN(loadsDay,1)+" loads":"auto"} value={trucks} onChange={e=>setTrucks(e.target.value)}/></label>
        </div>
        <div className="logrow">
          <label>Crew / sub<select value={res} onChange={e=>setRes(e.target.value)}>{crews.map(c=><option key={c.id} value={c.id}>{c.name}{c.type==="sub"?" (sub)":""}</option>)}</select></label>
          <label>Start day<select value={day} onChange={e=>setDay(+e.target.value)}>{DAYS.map((d,i)=><option key={d} value={i}>{d} {dLabel(wk,i)}</option>)}</select></label>
          <label>Days ({fmtN(dayRate,dayRate<10?1:0)} {it[CI.UM]}/d)<input type="number" placeholder={String(nDays)} value={daysOv} onChange={e=>setDaysOv(e.target.value)}/></label>
        </div>
        <div className="chiprow" style={{margin:"2px 0 4px"}}>
          <span className="ovnote" style={{margin:"0 4px 0 0"}}>Predecessors:</span>
          {predSel.length===0 && <span className="ovnote" style={{margin:0}}>none</span>}
          {predSel.map(pk=>{ const info=runInfoFor(tasks,crews,pk); return <span key={pk} className="predchip">{info?info.item+" · "+info.crew:"(run)"}<button onClick={()=>setPredSel(s=>s.filter(x=>x!==pk))} title="Remove">✕</button></span>; })}
        </div>
        {!predAdd
          ? <div className="btnrow" style={{marginTop:0}}><button className="ghost sm" onClick={()=>setPredAdd(true)}>+ Add predecessor</button></div>
          : <>
            <input autoFocus className="search" placeholder="Search a run to wait on — crew, item, or location…" value={predQ} onChange={e=>setPredQ(e.target.value)}/>
            <div className="results">
              {predCands.filter(r=>!predQ.trim()||r.search.includes(predQ.trim().toLowerCase())).slice(0,20).map((r,i)=>{
                const top=i===0 && r.res===res && r.finishWdi<=wdi(wk,day);
                return (
                <button key={r.key} className={top?"top":""} onClick={()=>{ setPredSel(s=>[...s,r.key]); setPredAdd(false); setPredQ(""); }}>
                  <i style={{background:r.bg}}/><span>{r.item}</span>{top && <span className="rtag">closest prev</span>}<em>{r.crew} · {r.loc||"—"} · {r.start} · {r.days}d</em></button>);})}
              {predCands.length===0 && <div className="empty">No other runs on the board to wait on.</div>}
            </div>
            <div className="btnrow"><button className="ghost sm" onClick={()=>{setPredAdd(false); setPredQ("");}}>Cancel</button></div>
          </>}

        {useQty>0 && <table className="dt">
          <tbody>
            <tr><th>Per day</th><td>{fmtN(perDay,perDay<10?1:0)} {it[CI.UM]} · {fmtN(perDay*it[CI.MH])} MH · {loadsDay?fmtN(loadsDay,1)+" loads":"no hauling"}</td></tr>
            <tr><th>Material (plan)</th><td>{fmt$(useQty*it[CI.UM$])}</td></tr>
            <tr><th>Budget amount</th><td>{fmt$(useQty*it[CI.BID])} <em className="dim2">@ {fmt$(it[CI.BID],2)}/{it[CI.UM]}</em></td></tr>
            <tr><th>Budget cost</th><td>{fmt$(useQty*unitCost(it))} <em className="dim2">@ {fmt$(unitCost(it),2)}/{it[CI.UM]}</em></td></tr>
          </tbody>
        </table>}

        <div className="btnrow">
          <button className="cta" disabled={!useQty} onClick={()=>{
            const list=[]; let left=useQty, cursor=(mode==="sta"&&a!=null&&b!=null)?a:null;   // start at the entered Start station — preserves direction, incl. descending (110+00 → 103+00)
            const isCallout = kind==="callout" || endIsQty;   // endIsQty: qty punched, Start is a location callout
            const staStep = (!isCallout && cursor!=null) ? (b-a)/nDays : null;   // signed step: slice the run by feet/day in the entered direction
            const calloutSta = (mode==="sta" && a!=null) ? [a, b??a] : null; // callout: location range kept in entered order, same on each day
            let curDay=day, curWk=wk;                 // carry a multi-day run across working days,
            for(let i=0;i<nDays;i++){                 // rolling into the following week(s) — no stacking, no weekend work
              const dq=Math.min(left, Math.round(perDay*100)/100); left-=dq;
              const sta = isCallout ? calloutSta : (cursor!=null? [cursor, cursor+staStep] : null); if(cursor!=null && !isCallout) cursor+=staStep;
              list.push({ id:tid(), res, ci, day:curDay, qty:dq, sta, wk:curWk, loc:loc.trim()||null,
                ...(equip.trim()?{equip:equip.trim()}:{}), ...(trucks.trim()?{trucks:trucks.trim()}:{}) });
              curDay++; if(curDay>4){ curDay=0; curWk=addDays(curWk,7); }  // after Friday → next Monday
            }
            if(predSel.length){ const newKey = res+"|"+ci+"|"+(loc.trim()||""); predSel.forEach(pk=>addDep(newKey,pk)); }
            add(list);
          }}>Add {nDays>1?nDays+" days":"to board"}</button>
          <button className="ghost" onClick={close}>Cancel</button>
        </div>
      </>}
    </Modal>
  );
}

/* ============ EOS — follows EOS.pdf format exactly ============ */
function EOSModal({wk,day:d0,crews,weekTasks,logs,taskCalc,eosMeta,setEosMeta,cfg,close}){
  const [day,setDay]=useState(d0);
  const [copied,setCopied]=useState(false);
  const dayTasks = res => weekTasks.filter(t=>t.res===res && t.day===day);
  const crewDesc = (id,fallback)=> eosMeta.descs[id+"_"+day] ?? fallback;

  const truckLine = useMemo(()=>{
    const per = crews.map(c=>{
      const loads = dayTasks(c.id).reduce((a,t)=>a+taskCalc(t).loads,0);
      return {name:c.name, trucks:Math.ceil(loads/6)}; // ~6 loads per truck-day
    }).filter(x=>x.trucks>0);
    const total = per.reduce((a,x)=>a+x.trucks,0);
    return total? `${total} trucks requested for today's operation (${per.map(x=>`${x.name} - ${x.trucks}`).join(", ")}).` : "No trucking requested for today's operation.";
  },[weekTasks,day,crews,cfg]);

  const text = useMemo(()=>{
    const L=[];
    L.push(longDate(addDays(wk,day)));
    L.push("");
    L.push("Project: 2124013 - DPS 01 Watershed");
    L.push("Superintendent: Brett Leonhard");
    L.push("");
    L.push("Safety:"); L.push(eosMeta.safety); L.push("");
    L.push("Quality:"); L.push(eosMeta.quality); L.push("");
    L.push("Weather:"); L.push(eosMeta.weather); L.push("");
    L.push("Trucking:"); L.push(truckLine); L.push("");
    L.push("Production - Self Perform Crews:"); L.push("");
    crews.filter(c=>c.type==="crew").forEach(c=>{
      const ts=dayTasks(c.id); if(!ts.length) return;
      L.push(c.name);
      ts.forEach(t=>{
        const cc=taskCalc(t);
        const lg=logs[t.id];
        L.push(`Planned - ${cc.it[CI.CC]} ${cc.it[CI.TASK]}`);
        L.push(`Planned Production: ${fmtN(t.qty)} ${cc.it[CI.UM]}`);
        L.push(`Actual Production: ${lg?fmtN(cc.actQty):"0"} ${cc.it[CI.UM]}`);
        L.push(`PPC: ${lg&&t.qty?Math.round(cc.actQty/t.qty*100):0}%`);
      });
      L.push("Description:");
      L.push(crewDesc(c.id, autoDesc(c.name, ts, logs, taskCalc, false)));
      L.push("");
    });
    L.push("Production - Subcontractor Crews:"); L.push("");
    crews.filter(c=>c.type==="sub").forEach(c=>{
      const ts=dayTasks(c.id); if(!ts.length && !eosMeta.descs[c.id+"_"+day]) return;
      L.push(c.name);
      L.push("Description:");
      L.push(crewDesc(c.id, autoDesc(c.name, ts, logs, taskCalc, true)));
      L.push("");
    });
    L.push("—");
    L.push("Preliminary end-of-shift figures based on field counts at time of send; quantities subject to survey verification and final reconciliation.");
    return L.join("\n");
  },[wk,day,crews,weekTasks,logs,eosMeta,truckLine]);

  const active = crews.filter(c=>dayTasks(c.id).length>0);
  return (
    <Modal close={close} w={720}>
      <div className="crewhead">
        <h3 style={{margin:0}}>End of Shift — {longDate(addDays(wk,day))}</h3>
        <select value={day} onChange={e=>setDay(+e.target.value)}>{DAYS.map((x,i)=><option key={x} value={i}>{x} {dLabel(wk,i)}</option>)}</select>
      </div>
      <div className="eosgrid">
        <label>Safety<input value={eosMeta.safety} onChange={e=>setEosMeta(m=>({...m,safety:e.target.value}))}/></label>
        <label>Quality<input value={eosMeta.quality} onChange={e=>setEosMeta(m=>({...m,quality:e.target.value}))}/></label>
        <label className="full">Weather<input value={eosMeta.weather} onChange={e=>setEosMeta(m=>({...m,weather:e.target.value}))}/></label>
        {active.map(c=>
          <label key={c.id} className="full">{c.name} — description
            <textarea rows={2} placeholder="Auto-generated from the board — type to override"
              value={eosMeta.descs[c.id+"_"+day]??""}
              onChange={e=>setEosMeta(m=>({...m,descs:{...m.descs,[c.id+"_"+day]:e.target.value}}))}/>
          </label>)}
        <label className="full">Send to<input value={eosMeta.to} onChange={e=>setEosMeta(m=>({...m,to:e.target.value}))}/></label>
      </div>
      <pre className="eosprev">{text}</pre>
      <div className="btnrow">
        <button className="cta" onClick={()=>{navigator.clipboard?.writeText(text); setCopied(true); setTimeout(()=>setCopied(false),1500);}}>{copied?"Copied ✓":"Copy summary"}</button>
        <a className="btn ghost" href={`mailto:${encodeURIComponent(eosMeta.to)}?subject=${encodeURIComponent(`2124013 DPS 01 Watershed - EOS - ${addDays(wk,day).slice(5).replace("-",".")}.${addDays(wk,day).slice(0,4)}`)}&body=${encodeURIComponent(text)}`}>Open in email</a>
        <span className="sp"/><em className="dim2">Cost data is deliberately excluded.</em>
      </div>
    </Modal>
  );
}

/* ============ COMMAND CENTER (Earned-Value) ============ */
function evTone(v){ return v>=1 ? "good" : v>=0.9 ? "warn" : "bad"; }
function Tile({label,value,sub,tone,big}){
  return <div className={"evtile"+(big?" big":"")+(tone?" "+tone:"")}>
    <label>{label}</label><b>{value}</b>{sub!=null&&<span>{sub}</span>}
  </div>;
}
function SCurve({data}){
  const [hi,setHi]=useState(null);
  const n=data.length;
  if(n===0) return <div className="empty">No production logged yet — the burn-up curve builds as crews report quantities.</div>;
  const W=820,H=300,padL=52,padR=16,padT=16,padB=34;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxY=Math.max(1,...data.map(d=>Math.max(d.pv,d.ev,d.ac)));
  const X=i=> n===1? padL+iw/2 : padL+i*iw/(n-1);
  const Y=v=> padT+(1-v/maxY)*ih;
  const path=key=>data.map((d,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(d[key]).toFixed(1)).join(" ");
  const area=key=>path(key)+` L ${X(n-1).toFixed(1)} ${Y(0).toFixed(1)} L ${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(maxY*f));
  const H0=hi==null?null:data[hi];
  return (
    <div className="scurve">
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet"
        onMouseLeave={()=>setHi(null)}
        onMouseMove={e=>{ const r=e.currentTarget.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W;
          let best=0,bd=1e9; for(let i=0;i<n;i++){const d=Math.abs(X(i)-x); if(d<bd){bd=d;best=i;}} setHi(best); }}>
        {ticks.map((t,i)=><g key={i}>
          <line x1={padL} x2={W-padR} y1={Y(t)} y2={Y(t)} className="grid"/>
          <text x={padL-8} y={Y(t)+4} className="axt" textAnchor="end">{fmtN(t)}</text>
        </g>)}
        <path d={area("ev")} className="ar ev"/>
        <path d={path("pv")} className="ln pv"/>
        <path d={path("ac")} className="ln ac"/>
        <path d={path("ev")} className="ln ev"/>
        {["pv","ac","ev"].map(k=>data.map((d,i)=><circle key={k+i} cx={X(i)} cy={Y(d[k])} r={n===1?4.5:3} className={"pt "+k}/>))}
        {data.map((d,i)=>(i%Math.ceil(n/8||1)===0||i===n-1)&&<text key={i} x={X(i)} y={H-12} className="axt" textAnchor="middle">{d.label}</text>)}
        {hi!=null&&<g>
          <line x1={X(hi)} x2={X(hi)} y1={padT} y2={padT+ih} className="guide"/>
          <circle cx={X(hi)} cy={Y(H0.pv)} r="3.5" className="dot pv"/>
          <circle cx={X(hi)} cy={Y(H0.ev)} r="3.5" className="dot ev"/>
          <circle cx={X(hi)} cy={Y(H0.ac)} r="3.5" className="dot ac"/>
        </g>}
      </svg>
      <div className="sclegend">
        <span><i className="pv"/>Planned {H0&&"· "+fmtN(H0.pv)}</span>
        <span><i className="ev"/>Earned {H0&&"· "+fmtN(H0.ev)}</span>
        <span><i className="ac"/>Actual {H0&&"· "+fmtN(H0.ac)}</span>
        <span className="scwk">{H0? H0.label : "cumulative man-hours"}</span>
      </div>
    </div>
  );
}
function CommandCenter({crews,tasks,logs,notes,taskCalc,fcst,installedFor,wk,setWk,setTab,setModal,savings,cfg}){
  const laborRate = (cfg&&cfg.laborRate)||58;
  const eng = useMemo(()=>{
    const wkEnd=addDays(wk,6);
    const savWk=(savings||[]).filter(x=>x.date>=wk&&x.date<=wkEnd).reduce((a,x)=>a+(+x.amount||0),0);
    const savAll=(savings||[]).reduce((a,x)=>a+(+x.amount||0),0);
    const pfFor=(cid,w)=>{let a=0,e=0;tasks.filter(t=>t.res===cid&&t.wk===w).forEach(t=>{const c=taskCalc(t);a+=c.actMH;e+=c.earnMH;});return {a,pf:a>0?e/a:0};};
    const prevWk=addDays(wk,-7);
    const cotw=crews.map(c=>{const cur=pfFor(c.id,wk),prev=pfFor(c.id,prevWk); if(cur.a<=0||prev.a<=0)return null; const d=cur.pf-prev.pf; return {c,cur,prev,d,impact:d*cur.a*laborRate};}).filter(Boolean).sort((x,y)=>y.d-x.d)[0];
    const rows=crews.filter(c=>c.type!=="site").map(c=>{
      const days=DAYS.map((_,d)=>{let w=0;tasks.filter(t=>t.res===c.id&&t.wk===wk&&t.day===d).forEach(t=>{const x=taskCalc(t);if(logs[t.id])w+=Math.max(0,x.actMH-x.earnMH)*laborRate;});return w;});
      return {c,days,tot:days.reduce((a,b)=>a+b,0)};
    }).filter(r=>r.tot>0 || tasks.some(t=>t.res===r.c.id&&t.wk===wk));
    const maxCell=Math.max(1,...rows.flatMap(r=>r.days));
    return {savWk,savAll,cotw,heat:rows,maxCell};
  },[crews,tasks,logs,wk,savings,laborRate]);
  const [scope,setScope]=useState("week");
  const [asOf,setAsOf]=useState(null); const [playing,setPlaying]=useState(false); const playRef=useRef(null);
  useEffect(()=>()=>{ if(playRef.current) clearInterval(playRef.current); },[]);

  const ev = useMemo(()=>{
    let PV=0,EV=0,AC=0;
    tasks.forEach(t=>{ const c=taskCalc(t); PV+=c.planMH; EV+=c.earnMH; AC+=c.actMH; });
    let BACmh=0,BAC$=0;
    CATALOG.forEach(r=>{ const est=r[CI.EST]||0; BACmh+=est*r[CI.MH]; BAC$+=est*unitCost(r); });
    const CPI=AC>0?EV/AC:0, SPI=PV>0?EV/PV:0;
    const EACmh=CPI>0?BACmh/CPI:BACmh, EAC$=CPI>0?BAC$/CPI:BAC$;
    return { PV,EV,AC, CPI,SPI, CV:EV-AC, SV:EV-PV, BACmh,BAC$, EACmh, VACmh:BACmh-EACmh, VAC$:BAC$-EAC$, pctC:BACmh>0?EV/BACmh:0 };
  },[tasks,logs]);

  /* Target PPC (Percent Plan Complete) = tasks completed ÷ tasks committed, for the
     week under Weekly Work Planning. Below 80% flags a project-team review. */
  const ppc = useMemo(()=>{
    const committed = tasks.filter(t=>t.wk===wk && (crews.find(c=>c.id===t.res)||{}).type!=="site");
    const done = committed.filter(t=>logs[t.id] && logs[t.id].done);
    return { committed:committed.length, done:done.length, pct: committed.length? done.length/committed.length : 0 };
  },[tasks,logs,wk,crews]);

  const curve = useMemo(()=>{
    const set=[...new Set(tasks.map(t=>t.wk))].sort();
    let pv=0,ev=0,ac=0;
    return set.map(w=>{
      tasks.filter(t=>t.wk===w).forEach(t=>{const c=taskCalc(t); pv+=c.planMH; ev+=c.earnMH; ac+=c.actMH;});
      return { label:w.slice(5).replace("-","/"), pv,ev,ac };
    });
  },[tasks,logs]);

  const board = useMemo(()=>{
    const src = scope==="week" ? tasks.filter(t=>t.wk===wk) : tasks;
    return crews.map(c=>{
      let p=0,a=0,e=0;
      src.filter(t=>t.res===c.id).forEach(t=>{const x=taskCalc(t); p+=x.planMH; a+=x.actMH; e+=x.earnMH;});
      return {c,p,a,e,pf:a>0?e/a:0};
    }).filter(r=>r.p>0||r.a>0).sort((x,y)=>y.pf-x.pf);
  },[crews,tasks,logs,scope,wk]);

  const alerts = useMemo(()=>{
    const out=[];
    const cis=[...new Set(tasks.map(t=>t.ci))];
    cis.forEach(ci=>{
      const it=CATALOG[ci], f=fcst(ci), est=it[CI.EST]||0, inst=installedFor(ci);
      if(f.drift>0.03*Math.max(1,unitCost(it)) && f.drift>0.5)
        out.push({sev:2,tag:"COST",text:`${it[CI.TASK].slice(0,42)} forecasting ${fmt$(f.uc,2)}/${it[CI.UM]} — ${fmt$(f.drift,2)} over budget UC.`,go:()=>setTab("catalog")});
      if(est>0 && inst>est)
        out.push({sev:1,tag:"QTY",text:`${it[CI.TASK].slice(0,42)} installed ${fmtN(inst)} of ${fmtN(est)} ${it[CI.UM]} — over budget qty.`,go:()=>setTab("catalog")});
    });
    tasks.filter(t=>t.wk===wk&&logs[t.id]).forEach(t=>{
      const c=taskCalc(t); if(t.qty>0 && c.actQty/t.qty<0.9)
        out.push({sev:1,tag:"PROD",text:`${(crews.find(x=>x.id===t.res)?.name||"?")}: ${c.it[CI.TASK].slice(0,34)} at ${pct(c.actQty/t.qty)} of plan.`,go:()=>setTab("board")});
    });
    board.forEach(r=>{ if(r.a>0 && r.pf<0.9) out.push({sev:1,tag:"PF",text:`${r.c.name} PF ${r.pf.toFixed(2)} — below target.`,go:()=>setTab("board")}); });
    notes.filter(n=>n.level!=="info").forEach(n=>
      out.push({sev:n.level==="crit"?2:1,tag:n.level==="crit"?"CRIT":"NOTE",text:n.text,go:()=>setTab("board")}));
    return out.sort((a,b)=>b.sev-a.sev).slice(0,14);
  },[tasks,logs,notes,wk,board]);

  const cpiTxt=ev.CPI?ev.CPI.toFixed(2):"—", spiTxt=ev.SPI?ev.SPI.toFixed(2):"—";
  return (
    <div className="page cc">
      <div className="cchead">
        <div><h2>Command Center</h2><p className="dim2">Weekly Work Planning performance — live from field-reported production.</p></div>
        <div className={"ccpct"+(ppc.committed&&ppc.pct<0.8?" ppcbad":"")} title="PPC = Tasks Completed ÷ Tasks Committed × 100% — measured at Weekly Work Planning. Below 80% triggers a project-team review.">
          <b>{ppc.committed?pct(ppc.pct):"—"}</b>
          <label>Target PPC · Percent Plan Complete</label>
          <span className="ppcsub">{ppc.done}/{ppc.committed} tasks · target 80%{ppc.committed&&ppc.pct<0.8?" · ▼ review":""}</span>
        </div>
      </div>

      <div className="engbar">
        <div className="savtick">
          <label>$ Saved this week</label>
          <b>{fmt$(eng.savWk)}</b>
          <span>all-time {fmt$(eng.savAll)} · logged from the Trucking optimizer</span>
        </div>
        {eng.cotw && eng.cotw.d>0.001 ? (
          <div className="cotw">
            <div className="cotwtag">🏆 Crew of the Week</div>
            <b>{eng.cotw.c.name}</b>
            <span>PF {eng.cotw.prev.pf.toFixed(2)} → {eng.cotw.cur.pf.toFixed(2)} (+{eng.cotw.d.toFixed(2)}) · ≈ {fmt$(eng.cotw.impact)} better than last week</span>
          </div>
        ) : <div className="cotw dim"><div className="cotwtag">🏆 Crew of the Week</div><span className="dim2">Most-improved crew shows here once two weeks of production are logged.</span></div>}
      </div>

      <div className="evgrid">
        <Tile big label="Tasks complete (PPC)" value={ppc.committed?ppc.done+"/"+ppc.committed:"—"} tone={ppc.committed?(ppc.pct>=0.8?"good":"bad"):""} sub={ppc.committed?pct(ppc.pct)+" of committed · target 80%":"nothing committed this week"}/>
        <Tile label="Earned MH (EV)" value={fmtN(ev.EV)} sub={"of "+fmtN(ev.BACmh)+" budget"}/>
        <Tile label="Actual MH (AC)" value={fmtN(ev.AC)} sub={"planned "+fmtN(ev.PV)}/>
        <Tile label="Cost var (CV)" value={fmtN(ev.CV)+" MH"} tone={ev.CV>=0?"good":"bad"} sub={ev.CV>=0?"earned ≥ spent":"spent > earned"}/>
      </div>

      <div className="ccrow">
        <div className="panel cc-curve">
          <div className="ph">Burn-up — planned vs earned vs actual (MH) <em className="dim2">— drag or ▶ play the time machine</em></div>
          <SCurve data={asOf==null?curve:curve.slice(0,asOf+1)}/>
          {curve.length>1 && <div className="tmach">
            <button className="ghost sm" onClick={()=>{ if(playing){clearInterval(playRef.current);setPlaying(false);setAsOf(null);return;} setPlaying(true); let k=0; setAsOf(0); playRef.current=setInterval(()=>{ k++; if(k>=curve.length){clearInterval(playRef.current);setPlaying(false);setAsOf(null);} else setAsOf(k); },650); }}>{playing?"■ Stop":"▶ Play"}</button>
            <input type="range" min="0" max={curve.length-1} value={asOf==null?curve.length-1:asOf} onChange={e=>{setAsOf(+e.target.value); setPlaying(false); if(playRef.current)clearInterval(playRef.current);}}/>
            <span className="dim2">{(asOf==null?curve[curve.length-1]:curve[asOf]||{}).label}{asOf==null?" · to date":""}</span>
          </div>}
        </div>
        <div className="panel cc-alerts">
          <div className="ph">Attention feed <em className="dim2">— {alerts.length}</em></div>
          <div className="alerts">
            {alerts.length? alerts.map((a,i)=>
              <button key={i} className={"alert sev"+a.sev} onClick={a.go}>
                <span className="atag">{a.tag}</span><span className="atx">{a.text}</span>
              </button>)
              : <div className="empty">All clear — no items need attention.</div>}
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="ph">Idle-cost heatmap <em className="dim2">— labor $ spent beyond earned value, by crew &amp; day (where money leaked)</em></div>
        <div className="heatwrap">
          <table className="heat"><thead><tr><th></th>{DAYS.map((d,i)=><th key={d} className={i>4?"wknd":""}>{d}</th>)}<th className="r">Week</th></tr></thead>
            <tbody>{eng.heat.length? eng.heat.map(r=>
              <tr key={r.c.id}><td className="hname">{r.c.name}</td>
                {r.days.map((w,i)=>{const t=eng.maxCell?w/eng.maxCell:0;
                  return <td key={i} className="hcell" title={w>0?fmt$(w)+" over-spend":"on/under budget"} style={{background:w>0?`rgba(229,72,77,${(0.12+0.72*t).toFixed(2)})`:"transparent"}}>{w>0?fmt$(w):""}</td>;})}
                <td className="r hweek">{r.tot>0?fmt$(r.tot):"—"}</td></tr>)
              : <tr><td colSpan={9} className="empty">No logged production this week.</td></tr>}
            </tbody></table>
        </div>
      </div>

    </div>
  );
}

/* ============ TRENDS ============ */
function Trends({crews,tasks,logs,taskCalc,wk}){
  const weeks = useMemo(()=>{
    const set=[...new Set(tasks.map(t=>t.wk))].sort();
    return set.map(w=>{
      const rows = crews.map(c=>{
        let p=0,a=0,e=0;
        tasks.filter(t=>t.wk===w&&t.res===c.id).forEach(t=>{const x=taskCalc(t); p+=x.planMH; a+=x.actMH; e+=x.earnMH;});
        return {c,p,a,e,pf:a>0?e/a:0};
      }).filter(r=>r.p>0||r.a>0);
      return {w,rows};
    });
  },[crews,tasks,logs]);
  return (
    <div className="page">
      <h2>Productivity trends</h2>
      {weeks.map(({w,rows})=>
        <div key={w} className="panel">
          <div className="ph">{wkTitle(w)}{w===wk?" · current":""}</div>
          <table className="dt list">
            <thead><tr><th>Crew</th><th className="r">Plan MH</th><th className="r">Actual MH</th><th className="r">Earned MH</th><th className="r">PF</th><th style={{width:"34%"}}>Earned vs actual</th></tr></thead>
            <tbody>{rows.map(r=>
              <tr key={r.c.id}>
                <td>{r.c.name}{r.c.type==="sub"?" (sub)":""}</td>
                <td className="r">{fmtN(r.p)}</td><td className="r">{fmtN(r.a)}</td><td className="r">{fmtN(r.e)}</td>
                <td className={"r "+(r.pf>=1?"pos":r.pf>0?"neg":"")}>{r.pf?r.pf.toFixed(2):"—"}</td>
                <td><div className="tbar"><i style={{width:Math.min(100,(r.a? r.e/Math.max(r.a,r.e):0)*100)+"%"}}/><u style={{width:Math.min(100,(r.e? r.a/Math.max(r.a,r.e):0)*100)+"%"}}/></div></td>
              </tr>)}
            </tbody>
          </table>
        </div>)}
      <p className="dim2">Weeks accumulate as you schedule and log — use ‹ › on the board to plan ahead; history stays here.</p>
    </div>
  );
}

function MilestoneModal({milestones,setMilestones,close}){
  const [date,setDate]=useState(""); const [label,setLabel]=useState("");
  const add=()=>{ if(!date||!label.trim())return; setMilestones(m=>[...m,{id:"m"+Math.random().toString(36).slice(2,7),date,label:label.trim()}].sort((a,b)=>a.date.localeCompare(b.date))); setDate(""); setLabel(""); };
  const del=id=>setMilestones(m=>m.filter(x=>x.id!==id));
  return (
    <Modal close={close} w={540}>
      <h3>Milestones</h3>
      <p className="dim2">Dated markers shown on the board — end of a block, end of a drain run, inspections, deadlines, anything worth flagging.</p>
      <div className="logrow">
        <label>Date<input type="date" value={date} onChange={e=>setDate(e.target.value)}/></label>
        <label style={{flex:2}}>Label<input value={label} placeholder="e.g. End of Orange St drain run" onChange={e=>setLabel(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")add();}}/></label>
        <button className="cta" style={{alignSelf:"flex-end"}} disabled={!date||!label.trim()} onClick={add}>Add</button>
      </div>
      <table className="dt list">
        <thead><tr><th>Date</th><th>Milestone</th><th/><th/></tr></thead>
        <tbody>{milestones.length? milestones.map(m=>
          <tr key={m.id} className={m.done?"msdone":""}><td className="mono">{m.date}</td><td>{m.done?"✅":"◆"} {m.label}</td>
            <td><button className="ghost sm" onClick={()=>{ const nd=!m.done; setMilestones(ms=>ms.map(x=>x.id===m.id?{...x,done:nd}:x)); if(nd) celebrate(m.label+" — complete!"); }}>{m.done?"Undo":"Hit ✓"}</button></td>
            <td><button className="ghost sm" onClick={()=>del(m.id)}>Remove</button></td></tr>)
          : <tr><td colSpan={4} className="empty">No milestones yet — add one above.</td></tr>}
        </tbody>
      </table>
      <div className="btnrow"><button className="cta" onClick={close}>Done</button></div>
    </Modal>
  );
}

function CatalogView({installedFor,fcst,ctcOf,remainingFor,contractQtyFor,umOverrides,setUmOverrides,openSched}){

    const c={...o}; const t=v.trim();
    if(!t || t.toUpperCase()===CATALOG[i][CI.UM].toUpperCase()) delete c[i]; else c[i]=t.toUpperCase();
    return c;
  });
  const [q,setQ]=useState("");
  const [ctcOnly,setCtcOnly]=useState(false);
  const [laborOnly,setLaborOnly]=useState(()=>{ try{ return localStorage.getItem("lafable-laboronly")!=="0"; }catch(e){ return true; } });
  useEffect(()=>{ try{ localStorage.setItem("lafable-laboronly", laborOnly?"1":"0"); }catch(e){} },[laborOnly]);
  const rows = useMemo(()=>{
    const s=q.trim().toLowerCase();
    return CATALOG.map((r,i)=>({r,i}))
      .filter(({r,i})=>(!s||r[CI.TASK].toLowerCase().includes(s)||r[CI.CC].toLowerCase().includes(s)||r[CI.PAY].toLowerCase().includes(s)) && (!ctcOnly || ctcOf(i)) && (!laborOnly || isLaborCode(r[CI.CC])))

  const nCtc = useMemo(()=>CATALOG.reduce((a,_,i)=>a+(ctcOf(i)?1:0),0),[]);

  return (
    <div className="page">
      <h2>Catalog / CTC <em className="dim2">— {CATALOG.length} items · {nLabor} labor cost codes · {nCtc} tied to the Jul 2026 CTC (billed-to-date vs forecast)</em></h2>

        <input className="search" placeholder="Search description, cost code, or pay item…" value={q} onChange={e=>setQ(e.target.value)}/>
        <label className="switch" title="Hide non-labor codes — leave/holiday (50.50.x), misc/overhead (99.x), fuel & consumables, sales tax"><input type="checkbox" checked={laborOnly} onChange={e=>setLaborOnly(e.target.checked)}/><i/><span>Labor codes only</span></label>
        <label className="switch"><input type="checkbox" checked={ctcOnly} onChange={e=>setCtcOnly(e.target.checked)}/><i/><span>CTC only</span></label>
      </div>
      <table className="dt list">
        <thead><tr><th>CC</th><th>Pay item</th><th>Description</th><th>UM</th><th className="r">MH/U</th><th className="r">Budget UC → Fcst</th><th className="r">Contract</th><th className="r">Billed → date</th><th className="r">Forecast rem</th><th style={{width:120}}>% billed</th><th/></tr></thead>
        <tbody>{rows.map(({r,i})=>{
          const c=ctcOf(i), contract=contractQtyFor(i), billed=installedFor(i), rem=remainingFor(i), f=fcst(i);
          const pctB = contract? billed/contract : 0;
          const over = c && c.rq!=null && c.rq<0;
          return <tr key={i} className={c?"":"nctc"}>
            <td className="mono">{r[CI.CC]}</td><td className="mono">{r[CI.PAY]}</td>
            <td><i className="dot" style={{background:SCOPES[scopeKeyOf(r[CI.CC])].bg}}/>{r[CI.TASK].slice(0,42)}{r[CI.TASK].length>42?"…":""}</td>
            <td><input className="umin" value={umOverrides[i] ?? r[CI.UM]} title="Unit of measure (editable)"
              onChange={e=>setUM(i,e.target.value)} maxLength={8}/></td>
            <td className="r">{r[CI.MH]?fmtN(r[CI.MH],3):"—"}</td>
            <td className={"r "+(f.drift>0.005?"neg":"")}>{fmt$(unitCost(r),2)}{f.drift?` → ${fmt$(f.uc,2)}`:""}</td>
            <td className="r">{contract?fmtN(contract):"—"}</td>
            <td className="r">{fmtN(billed)}{c?"":<em className="dim2" title="No CTC row — field/estimate baseline"> est</em>}</td>
            <td className={"r "+(over?"neg":"")}>{fmtN(rem)}</td>
            <td><div className="tbar"><i style={{width:Math.min(100,Math.max(0,pctB*100))+"%"}}/></div><span className="pctlbl">{contract?pct(pctB):"—"}</span></td>
            <td><button className="ghost sm" onClick={()=>openSched(i)}>Schedule</button></td>

        </tbody>
      </table>
    </div>
  );
}

/* ============ PRINT ============ */
/* Report presets choose a default set of columns; every column is individually
   toggleable afterwards. Columns reuse the same live calcs as the rest of the app
   (taskCalc / fcst / installedFor / unitCost). Suffixes: (wk)=this week per task,
   (td)=item to-date from logged data (live CTC), (item)=whole pay item / budget. */
function PrintModal({crews,weekTasks,tasks,logs,notes,siteRows,taskCalc,installedFor,fcst,cfg,umOverrides,wk,close}){
  const REPORTS = {
    quantities:{label:"Quantities — plan vs actual", cols:["day","crew","pay","desc","loc","planq","actq","qvar","pct"]},
    cost:{label:"Cost — budget vs actual vs forecast", cols:["day","crew","pay","desc","buduc","fuc","actd","budi","cvar","fac"]},
    field:{label:"Field — installed vs plan", cols:["day","crew","pay","desc","loc","planq","actq","pct","planmh","actmh"]},
  };
  const [report,setReport]=useState("quantities");
  const [sel,setSel]=useState(()=>new Set(REPORTS.quantities.cols));
  const [inclCrews,setInclCrews]=useState(true);
  const [inclSubs,setInclSubs]=useState(true);
  const [inclNotes,setInclNotes]=useState(true);
  const pick = r => { setReport(r); setSel(new Set(REPORTS[r].cols)); };
  const toggle = k => setSel(s=>{ const n=new Set(s); n.has(k)?n.delete(k):n.add(k); return n; });

  // item-to-date aggregates from all logged work (matches fcst's live-CTC basis)
  const tdMap = useMemo(()=>{
    const m={};
    tasks.forEach(t=>{ const l=logs[t.id]; if(l){ (m[t.ci]=m[t.ci]||{qty:0,mh:0}); m[t.ci].qty+=l.qty||0; m[t.ci].mh+=l.mh||0; } });
    Object.keys(m).forEach(ci=>{ const it=CATALOG[ci]; m[ci].actCost = m[ci].mh*cfg.laborRate + m[ci].qty*(it[CI.UM$]+it[CI.UT]); });
    return m;
  },[tasks,logs,cfg]);

  const COLS = [
    {k:"day",   label:"Day",              get:r=>DAYS[r.t.day]},
    {k:"crew",  label:"Crew / Sub",       get:r=>r.crew},
    {k:"phase", label:"Phase Code",       get:r=>r.it[CI.CC]},
    {k:"loc",   label:"Location",         get:r=>r.sta},
    {k:"pay",   label:"Pay Item",         get:r=>r.it[CI.PAY]},
    {k:"desc",  label:"Description",      get:r=>r.it[CI.TASK]},
    {k:"planq", label:"Plan Qty (wk)",  n:1, get:r=>fmtN(r.t.qty)+" "+r.um},
    {k:"actq",  label:"Actual Qty (wk)",n:1, get:r=>r.lg?fmtN(r.c.actQty):"—"},
    {k:"qvar",  label:"Qty Var",        n:1, get:r=>r.lg?fmtN(r.c.actQty-r.t.qty):"—"},
    {k:"rem",   label:"Remaining (task)",n:1, get:r=>fmtN((r.it[CI.EST]||0)-installedFor(r.ci))},
    {k:"pct",   label:"%",              n:1, get:r=>r.lg&&r.t.qty?pct(r.c.actQty/r.t.qty):"—"},
    {k:"planmh",label:"Plan MH (wk)",   n:1, get:r=>fmtN(r.c.planMH)},
    {k:"actmh", label:"Actual MH (wk)", n:1, get:r=>r.lg?fmtN(r.c.actMH):"—"},
    {k:"pf",    label:"PF",             n:1, get:r=>r.c.actMH?(r.c.earnMH/r.c.actMH).toFixed(2):"—"},
    {k:"buduc", label:"Budget UC",      n:1, get:r=>fmt$(unitCost(r.it),2)},
    {k:"fuc",   label:"Fcst UC",        n:1, get:r=>fmt$(r.f.uc,2)},
    {k:"aucd",  label:"Actual UC (td)", n:1, get:r=>r.td.qty?fmt$(r.td.actCost/r.td.qty,2):"—"},
    {k:"budi",  label:"Budget $ (item)",n:1, get:r=>fmt$(unitCost(r.it)*(r.it[CI.EST]||0))},
    {k:"actd",  label:"Actual $ (td)",  n:1, get:r=>(r.td.qty||r.td.mh)?fmt$(r.td.actCost):"—"},
    {k:"earnp", label:"Earned Pay (td)",n:1, get:r=>fmt$(r.td.qty*r.it[CI.BID])},
    {k:"fac",   label:"FAC",            n:1, get:r=>fmt$(r.fac)},
    {k:"cvar",  label:"Cost Var",       n:1, get:r=>fmt$(unitCost(r.it)*(r.it[CI.EST]||0)-r.fac)},
  ];

  const rows = weekTasks.slice().sort((a,b)=>a.day-b.day).map(t=>{
    const c=taskCalc(t), it=c.it, ci=t.ci, cr=crews.find(x=>x.id===t.res);
    const f=fcst(ci), td=tdMap[ci]||{qty:0,mh:0,actCost:0};
    return { t, c, it, ci, lg:logs[t.id], crew:cr?.name||"?", ctype:cr?.type||"crew",
      um:(t.ov && t.ov.um) || umOverrides[ci] || it[CI.UM],  // task override > catalog UM override > base
      sta:t.sta?`${fmtN(t.sta[0],2)}–${fmtN(t.sta[1],2)}`:"—",
      f, td, fac:f.uc*(it[CI.EST]||0) };
  }).filter(r=> (r.ctype==="crew"&&inclCrews) || (r.ctype==="sub"&&inclSubs));

  const active = COLS.filter(c=>sel.has(c.k));
  const rowName = id => (siteRows.find(s=>s.id===id)||crews.find(c=>c.id===id)||{}).name || "";
  const noteList = inclNotes ? notes.slice().sort((a,b)=>a.day-b.day) : [];

  return (
    <Modal close={close} w={860}>
      <div className="prcfg no-print">
        <div className="crewhead"><h3 style={{margin:0}}>Print / export to PDF — {wkTitle(wk)}</h3></div>
        <div className="repbtns">
          {Object.entries(REPORTS).map(([k,v])=>
            <button key={k} className={report===k?"on":""} onClick={()=>pick(k)}>{v.label}</button>)}
        </div>
        <div className="colhdr">Columns</div>

          {COLS.map(c=>
            <label key={c.k}><input type="checkbox" checked={sel.has(c.k)} onChange={()=>toggle(c.k)}/>{c.label}</label>)}
        </div>
        <div className="rowtoggles">
          <label><input type="checkbox" checked={inclCrews} onChange={e=>setInclCrews(e.target.checked)}/>Crews</label>
          <label><input type="checkbox" checked={inclSubs} onChange={e=>setInclSubs(e.target.checked)}/>Subcontractors</label>
          <label><input type="checkbox" checked={inclNotes} onChange={e=>setInclNotes(e.target.checked)}/>Notes / deliveries</label>
        </div>
        <p className="dim2" style={{fontSize:12,margin:"10px 0 0"}}>Report covers the week on screen. Qty/MH = this week; UC / FAC / earned = item to-date (live CTC). Save as PDF from the browser dialog (landscape).</p>
        <div className="btnrow">
          <button className="cta" onClick={()=>window.print()}>Generate &amp; print</button>
          <button className="ghost" onClick={close}>Cancel</button>
        </div>
      </div>

      <div className="printarea">
        <div className="ptitle">DPW547 · Job 2124013 — Look-Ahead · {wkTitle(wk)} · {REPORTS[report].label}</div>
        <table className="dt list">
          <thead><tr>{active.map(c=><th key={c.k} className={c.n?"r":""}>{c.label}</th>)}</tr></thead>
          <tbody>{rows.length? rows.map(r=>
            <tr key={r.t.id}>{active.map(c=><td key={c.k} className={c.n?"r":""}>{c.get(r)}</td>)}</tr>)
            : <tr><td colSpan={Math.max(1,active.length)} className="empty">No matching tasks scheduled this week.</td></tr>}
          </tbody>
        </table>
        {inclNotes && noteList.length>0 && <>
          <div className="ptitle" style={{marginTop:16}}>Notes &amp; Deliveries</div>
          <table className="dt list">

/* ============ CARD EXPORT — 4×4in notepad sheets for colored paper ============ */
/* One physical card, matching the RNGD pad template exactly: the stencil wordmark
   (assets/rngd-black.png), bold mixed-case labels, open writing space, no rules.
   Only the filled-in values render as computer (mono) text; the corner numbers land
   where the pad convention writes them — day count top-left, total MH top-right. */
function PCard({cd}){
  const {t,mh,loads} = cd;
  const merged = !!cd.merged;
  // One or more (item, qty, station) lines — stations stay separate on a merged card.
  const lines = merged ? cd.lines : [{it:cd.it, qty:t.qty, sta:t.sta}];
  const loc   = merged ? cd.loc   : (t.loc||"");
  const equip = merged ? cd.equip : (t.equip||"");
  // Trucks: explicit per-task override (single cards only), else the summed computed loads.
  const trucksStr = (!merged && t.trucks!=null && t.trucks!=="") ? String(t.trucks) : (loads>=0.05?fmtN(loads,1)+" loads":"");
  return (
    <div className={"pcard"+(merged?" merged n"+Math.min(lines.length,3):"")}>
      <div className="pcorners">
        <span className="pcv pday">{cd.run && cd.run.total>1?`Day ${cd.run.idx}/${cd.run.total}`:""}</span>
        <span className="pcv pmh">{fmtN(mh,mh%1?1:0)} MH</span>
      </div>
      <div className="pwm"><img src="assets/rngd-black.png" alt="RNGD"/></div>
      <div className="pbody">
        <div><label>Location:</label><span>{loc}</span></div>
        <div><label>Job #:</label><span>{JOB_NO}</span></div>
        <div className="pitem"><label>Item:</label><span>{lines.map((ln,i)=><span key={i} className="pline">{ln.it[CI.TASK]}</span>)}</span></div>
        <div><label>Goal:</label><span>{lines.map((ln,i)=><span key={i} className="pline">{fmtN(ln.qty,ln.qty%1?1:0)} {ln.it[CI.UM]}</span>)}</span></div>
        {lines.some(ln=>ln.sta) && <div className="psta"><label aria-hidden="true">Goal:</label><span>{lines.filter(ln=>ln.sta).map((ln,i)=><span key={i} className="pline">STA {staFmt(ln.sta[0])}{ln.sta[0]!==ln.sta[1]?" – "+staFmt(ln.sta[1]):""}</span>)}</span></div>}
        <i className="psp"/>
      </div>
      <div className="pfoot">
        <div><label>Equipt.:</label><span>{equip}</span></div>
        <div><label>Trucks:</label><span>{trucksStr}</span></div>
      </div>
    </div>
  );
}
/* Sheet renderer, used twice: hidden print copy (body-level) + zoomed on-screen preview. */
function CardSheets({pages,paper,paperBg,preview}){
  const rows = paper==="tabloid"?4:2;
  return (
    <div className={"cardsheets"+(preview?" prev":"")}>
      {pages.map((pg,pi)=>
        <div key={pi} className={"cardpage "+(paper==="tabloid"?"pt":"pl")} style={preview&&paperBg?{background:paperBg}:undefined}>
          <div className="pgrid" style={{gridTemplateRows:"repeat("+rows+",4in)"}}>
            {pg.map(cd=><PCard key={cd.t.id} cd={cd}/>)}
            {Array.from({length:3},(_,i)=><i key={"v"+i} className="cut v" style={{left:(i*4)+"in"}}/>)}
            {Array.from({length:rows+1},(_,j)=><i key={"h"+j} className="cut h" style={{top:(j*4)+"in"}}/>)}
          </div>
        </div>)}
    </div>
  );
}
function CardExportModal({weekTasks,crews,taskCalc,cfg,wk,close}){
  const countByScope = useMemo(()=>{ const m={}; weekTasks.forEach(t=>{ const k=scopeOf(t,crews); m[k]=(m[k]||0)+1; }); return m; },[weekTasks,crews]);
  const [sck,setSck]=useState(()=>{ const f=Object.keys(SCOPES).find(k=>countByScope[k]); return f||"drainage"; });
  const [paper,setPaper]=useState("letter");
  const [crewF,setCrewF]=useState("all");
  // Body class routes @media print to the card-sheet path while this modal is open.
  useEffect(()=>{ document.body.classList.add("print-cards"); return ()=>document.body.classList.remove("print-cards"); },[]);
  const scope = SCOPES[sck];
  const cards = useMemo(()=>{
    const base = weekTasks
      .filter(t=> scopeOf(t,crews)===sck && (crewF==="all"||t.res===crewF))
      .sort((a,b)=> a.day-b.day || String(a.res).localeCompare(String(b.res)))
      .map(t=>{ const c=taskCalc(t); return {t, it:c.it, run:dayRunFor(weekTasks,t), mh:c.planMH, loads:c.loads}; });
    // Merge same crew (res) + same day onto one card: stations stay separate (one line each),
    // MH and loads are summed. Sort keeps groups day-ordered; Map preserves that order.
    const groups = new Map();
    for(const cd of base){ const k=cd.t.res+"|"+cd.t.day; (groups.get(k) ?? groups.set(k,[]).get(k)).push(cd); }
    const same=(g,f)=> g.every(x=>f(x)===f(g[0]));
    return [...groups.values()].map(g=> g.length===1 ? g[0] : {
      merged:true, t:g[0].t, run:g[0].run,   // primary code's run drives the Day X/Y counter
      mh:    g.reduce((s,x)=>s+x.mh,0),
      loads: g.reduce((s,x)=>s+x.loads,0),
      loc:   same(g,x=>x.t.loc||"")   ? (g[0].t.loc||"")   : "",  // shared value or blank
      equip: same(g,x=>x.t.equip||"") ? (g[0].t.equip||"") : "",
      lines: g.map(x=>({ it:x.it, qty:x.t.qty, sta:x.t.sta })),
    });
  },[weekTasks,sck,crewF,crews]);
  const per = paper==="tabloid"?8:4;
  const pages=[]; for(let i=0;i<cards.length;i+=per) pages.push(cards.slice(i,i+per));
  const paperName = paper==="tabloid"?"11×17 (Tabloid)":"Letter 8.5×11";
  const swatchKeys = Object.keys(SCOPES).filter(k=> k!=="gen" || countByScope[k]);
  return (
    <>
      {pages.length>0 && <CardSheets pages={pages} paper={paper}/>}
      <Modal close={close} w={760}>
        <h3>Print cards — 4"×4" notepad sheets</h3>
        <div className="ovnote">Pick a scope and load that color paper in the printer. Cards print black-ink only, exactly 4"×4" between the trim lines.</div>
        <div className="swatchrow">
          {swatchKeys.map(k=>
            <button key={k} className={"swatch"+(sck===k?" on":"")} style={{background:SCOPES[k].bg,color:SCOPES[k].tx}} onClick={()=>setSck(k)}>
              {SCOPES[k].code} · {SCOPES[k].name} · {countByScope[k]||0}
            </button>)}
        </div>
        <div className="qmode sm" style={{margin:"4px 0 8px"}}>
          <button className={paper==="letter"?"on":""} onClick={()=>setPaper("letter")}>Letter 8.5×11 — 4/sheet</button>
          <button className={paper==="tabloid"?"on":""} onClick={()=>setPaper("tabloid")}>11×17 — 8/sheet</button>
        </div>
        <div className="logrow">
          <label>Crew / sub<select value={crewF} onChange={e=>setCrewF(e.target.value)}>
            <option value="all">All crews</option>
            {crews.map(c=><option key={c.id} value={c.id}>{c.name}{c.type==="sub"?" (sub)":""}</option>)}</select></label>
        </div>
        <div className="loghdr">{cards.length} card{cards.length===1?"":"s"} · {wkTitle(wk)} → {pages.length} sheet{pages.length===1?"":"s"} of {paperName}</div>
        <div className="cardprev">
          {pages.length
            ? <CardSheets pages={pages} paper={paper} paperBg={scope.bg} preview/>
            : <div className="ovnote" style={{padding:24,textAlign:"center"}}>No {scope.name} tasks on this week's board.</div>}
        </div>
        <p className="ovnote" style={{marginTop:10}}>Load {scope.name} paper. In the print dialog: paper size = {paperName}, Scale 100%, default margins, headers/footers OFF.</p>
        <div className="btnrow">
          <button className="cta" disabled={!cards.length} onClick={()=>window.print()}>Print sheets</button>
          <button className="ghost" onClick={close}>Cancel</button>
        </div>
        <style>{"@page{size:"+(paper==="tabloid"?"11in 17in":"8.5in 11in")+";margin:0.25in}"}</style>
      </Modal>
    </>
  );
}
