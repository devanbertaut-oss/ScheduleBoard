  // Live reciprocal Days ⇄ avg/day: the run total is the pivot (avg = total/days). Typing in one
  // field previews the other instantly; the actual re-slice commits on blur / Enter / step.
  const [pDays,setPDays]=useState(runN);
  const [pAvg,setPAvg]=useState(runRate);
  useEffect(()=>{ setPDays(runN); setPAvg(runRate); },[runN,runRate]);
  const pMH = (+pAvg||0)*it[CI.MH];
  const pLoads = ecfg.truckRate>0 ? ((+pAvg||0)*it[CI.UT])/ecfg.truckRate : 0;
  const commitAvg = () => { const p=+pAvg; if(p>0 && Math.abs(p-runRate)>1e-9) resliceRun(t,{perDay:p}); };
  const commitDays = () => { const d=Math.round(+pDays); if(d>0 && d!==runN) resliceRun(t,{days:d}); };
  const stepAvg = dir => { const s=Math.max(1,Math.round((+pAvg||runRate)*0.1)); const p=(+pAvg||runRate)+dir*s; if(p>0){ setPAvg(p); if(runQtot>0) setPDays(Math.max(1,Math.ceil(runQtot/p))); resliceRun(t,{perDay:p}); } };
  // Trucking model — optimal trucks/day for this run's phase code at the (previewed) daily rate + trench depth.
  const bgEdit = bedForItem(it[CI.CC], it[CI.TASK], it[CI.UM], cfg.truck&&cfg.truck.tw);
  const tmRate = +pAvg || runRate || t.qty || 0;
  const tm = truckModel(it, tmRate, resolveDig(it,dig,cfg), cfg.truck);
  const tmStreams = tm.applicable ? [
    {s:tm.spoil, lbl:tm.mat.spoil||"Dig-out", d:fmtN(tm.spoil.loads,1)+" ld"},
    {s:tm.stone, lbl:tm.mat.stone||"#57 stone", d:fmtN(tm.stone.tn,1)+" tn"},
    {s:tm.sand,  lbl:tm.mat.sand||"Sand", d:fmtN(tm.sand.loads,1)+" ld"}
  ].filter(x=>x.lbl && (x.s.cy>0 || x.s.trucks>0)) : [];
  const cat=SCOPES[scopeOf(t,crews)];
  const hasOv = !!(t.ov && Object.keys(t.ov).length);
  const f=fcstFor(t);
  const inst=installedFor(t.ci), est=it[CI.EST]||0;
  // Day-rate basis: a per-card crew-size override wins; else the crew's explicit daily MH cap (matches how
  // the board grades this run); else the global crew×shift rate.
  const mhPerDay = (t.ov&&t.ov.crewSize!=null) ? ecfg.crewSize*ecfg.shiftHrs : (crewOf&&crewOf.capMH>0 ? crewOf.capMH : ecfg.crewSize*ecfg.shiftHrs);
  const dayRate = it[CI.MH]>0 ? mhPerDay/it[CI.MH] : t.qty;
  const loads = ecfg.truckRate>0 ? (t.qty*it[CI.UT])/ecfg.truckRate : 0;
  const setOv=(k,v)=>{ const o={...(t.ov||{})}; if(v==null||v==="") delete o[k]; else o[k]=v; upTask(t.id,{ov:Object.keys(o).length?o:null}); };
  const results = useMemo(()=>{
    const s=q.trim().toLowerCase(); if(!s) return [];
    return CATALOG.map((r,i)=>({r,i}))
      .filter(({r})=>r[CI.TASK].toLowerCase().includes(s)||r[CI.CC].toLowerCase().includes(s)||r[CI.PAY].toLowerCase().includes(s))
      .slice(0,30);
  },[q]);
  const ovIn = (k,label,base,numeric)=>(
    <label>{label}
      <BlurInput className={t.ov&&t.ov[k]!=null?"ovon":""} type={numeric?"number":"text"}
        value={t.ov?.[k] ?? ""} placeholder={String(base)}
        onCommit={v=>setOv(k, numeric ? (v===""||isNaN(+v)?null:+v) : (String(v).trim()||null))}/>
    </label>
  );
  return (
    <Modal close={close} w={640}>
      <BlurInput className="h3edit" title="Edit this card's item name — the catalog item is unaffected"
        value={it[CI.TASK]} onCommit={v=>setOv("task", String(v).trim()||null)}/>
      <div className="chiprow">
        <span className="pill" style={{background:cat.bg,color:cat.tx}}>{cat.code} · {cat.name}</span>
        <span className="pill dim">Cost {it[CI.CC]}</span>
        <span className="pill dim">Pay {it[CI.PAY]}</span>
        {hasOv && <span className="pill ovpill">custom</span>}
      </div>
      <div className="qmode mtabs">
        <button className={tab==="log"?"on":""} onClick={()=>setTab("log")}>Details & Log</button>
        <button className={tab==="edit"?"on":""} onClick={()=>setTab("edit")}>Edit</button>
      </div>

      {tab==="log" ? (()=>{
        const rateTable = (
          <table className="dt">
            <tbody>
              <tr><th>Rate</th><td>{fmtN(dayRate,dayRate<10?1:0)} {it[CI.UM]}/day</td><th>MH / {it[CI.UM]}</th><td>{fmtN(it[CI.MH],3)}</td></tr>
              <tr><th>Crew</th><td>{ecfg.crewSize} @ {fmt$(ecfg.laborRate)}/MH</td><th>Mat / {it[CI.UM]}</th><td>{fmt$(it[CI.UM$],2)}</td></tr>
              <tr><th>Trucking / {it[CI.UM]}</th><td>{fmt$(it[CI.UT],2)}</td><th>Est. loads (plan)</th><td>{loads?fmtN(loads,1):"—"}</td></tr>
            </tbody>
          </table>
        );
        const fcstTable = (
          <table className="dt fcst">
            <tbody>
              <tr><th>Installed</th><td>{fmtN(inst)}/{fmtN(est)} {it[CI.UM]} ({est?pct(inst/est):"—"})</td><th>Forecast UC</th><td className={f.drift>0.005?"neg":f.drift<-0.005?"pos":""}>{fmt$(f.uc,2)}</td></tr>
              <tr><th>Pay / {it[CI.UM]}</th><td colSpan={3}>{fmt$(it[CI.BID],2)}</td></tr>
            </tbody>
          </table>
        );
        const logSection = (
          <>
            <div className="loghdr">Log — plan {fmtN(t.qty)} {it[CI.UM]} / {fmtN(t.qty*it[CI.MH])} MH</div>
            {L.staTask && <div className="logrow">
              <label>Station reached<BlurInput type="text" inputMode="decimal" placeholder={"e.g. "+staFmt(L.endSta)} value={reached} onCommit={v=>{setReached(v); L.applyReached(v);}}/></label>
              <div className="gen">→ actual qty<b>{L.qty?fmtN(+L.qty,(+L.qty)%1?1:0)+" "+it[CI.UM]:"—"}</b></div>
            </div>}
            <div className="logrow">
              <label>Qty ({it[CI.UM]})<input type="number" value={L.qty} onChange={e=>L.setQty(e.target.value)}/></label>
              <label>Manhours<input type="number" value={L.mh} onChange={e=>L.setMh(e.target.value)}/></label>
              <label className={"logreason"+(L.short?" flag":"")}>{L.short?"Reason short ⚠":"Reason (if delayed)"}
                <select value={L.reason} onChange={e=>L.setReason(e.target.value)}><option value="">—</option>{REASONS.map(r=><option key={r} value={r}>{r}</option>)}</select></label>
            </div>
            <div className="btnrow">
              <button className="cta" onClick={()=>{saveLog(t.id,L.qty,L.mh,true,L.reason); close();}}>Save</button>
              <button className="ghost" onClick={()=>{saveLog(t.id,L.qty,L.mh,false,L.reason); close();}}>Save as in-progress</button>
              <button className="ghost" onClick={()=>{saveLog(t.id,t.qty,L.planMH(),true,""); close();}}>Log as planned ✓</button>
              <span className="sp"/>
              <button className="ghost" onClick={()=>dupRun(t)} title="Clone this run to the working days right after it — drag to reposition">⧉ Duplicate</button>
              {runN>1 && <button className="danger" onClick={()=>{ if(window.confirm("Delete all "+runN+" days of this run (crew + item + location)?")) rmRun(t); }}>Delete run ({runN})</button>}
              <button className="danger" onClick={()=>rmTask(t.id)}>Delete task</button>
            </div>
          </>
        );
        return isMobile ? <>
          {logSection}
          <button className="ghost sm expdet" onClick={()=>setShowDetails(s=>!s)}>{showDetails?"▴ Hide details":"▾ Expand details"}</button>
          {showDetails && <>{rateTable}{fcstTable}</>}
        </> : <>
          {rateTable}
          {fcstTable}
          {logSection}
        </>;
      })() : <>

      <div className="loghdr">Plan</div>
      {!picking ?
        <div className="selitem">
          <div><b>{bit[CI.TASK]}</b><em>{bit[CI.CC]} · Pay {bit[CI.PAY]} · {fmtN(bit[CI.MH],3)} MH/{bit[CI.UM]}</em></div>
          <button className="ghost sm" onClick={()=>setPicking(true)}>Change item</button>
        </div> :
        <>
          <input autoFocus className="search" placeholder="Search item, cost code, or pay item — e.g. 51x31, HPPP, 33.40" value={q} onChange={e=>setQ(e.target.value)}/>
          <div className="results">
            {results.map(({r,i})=>
              <button key={i} onClick={()=>{ upTask(t.id,{ci:i, ov:null}); setPicking(false); setQ(""); }}>
                <i style={{background:SCOPES[scopeKeyOf(r[CI.CC])].bg}}/>
                <span>{r[CI.TASK]}</span>
                <em>{r[CI.CC]} · {r[CI.PAY]} · {r[CI.UM]}</em>
              </button>)}
            {q && results.length===0 && <div className="empty">No catalog match — try part of the cost code or pay item.</div>}
            {!q && <div className="empty">Pick the new catalog item for this card.</div>}
          </div>
          <div className="ovnote">Switching the item clears any per-card overrides below.</div>
          <div className="btnrow"><button className="ghost sm" onClick={()=>{setPicking(false); setQ("");}}>Keep current item</button></div>
        </>}
      <div className="logrow">
        <label>Crew / sub<select value={t.res} onChange={e=>upTask(t.id,{res:e.target.value})}>{crews.map(c=><option key={c.id} value={c.id}>{c.name}{c.type==="sub"?" (sub)":""}</option>)}</select></label>
        <label>Day<select value={t.day} onChange={e=>upTask(t.id,{day:+e.target.value})}>{DAYS.map((d,i)=><option key={d} value={i}>{d} {dLabel(t.wk,i)}</option>)}</select></label>
        <label>Week (snaps to Mon)<input type="date" value={t.wk} onChange={e=>{ if(e.target.value) upTask(t.id,{wk:mondayOf(e.target.value)}); }}/></label>
      </div>
      <div className="logrow">
        <label>Planned qty{runN>1?" · this day":""} ({it[CI.UM]})<BlurInput type="number" value={t.qty} onCommit={v=>upTask(t.id,{qty:+v||(kind==="callout"?1:0)})}/></label>
        {runN>1
          ? <label>This day's STA<input readOnly value={t.sta?staFmt(t.sta[0])+(t.sta[0]!==t.sta[1]?" – "+staFmt(t.sta[1]):""):"—"}/></label>
          : <>
            <label>Start STA<BlurInput placeholder="115+15.66" value={t.sta?staFmt(t.sta[0]):""} onCommit={v=>{const a=parseSTA(v), b=t.sta?t.sta[1]:null; upTask(t.id,{sta:(a!=null&&b!=null)?[a,b]:null});}}/></label>
            <label>End STA<BlurInput placeholder="118+40" value={t.sta?staFmt(t.sta[1]):""} onCommit={v=>{const b=parseSTA(v), a=t.sta?t.sta[0]:null; upTask(t.id,{sta:(a!=null&&b!=null)?[a,b]:null});}}/></label>
          </>}
      </div>
      {(kind==="area"||kind==="vol"||kind==="wt") &&
      <div className="logrow">
        <label>Width (ft)<input type="number" placeholder="e.g. 12" value={width} onChange={e=>setWidth(e.target.value)}/></label>
        {(kind==="vol"||kind==="wt") &&
          <label>Depth (ft)<input type="number" placeholder="e.g. 0.5" value={depth} onChange={e=>setDepth(e.target.value)}/></label>}
        {kind==="wt" &&
          <label>Density (TON/CY)<input type="number" placeholder="e.g. 1.4" value={dens} onChange={e=>setDens(e.target.value)}/></label>}
        <div className="gen">Generated qty<b>{genQty!=null?fmtN(genQty,genQty%1?2:0):"—"} {genQty!=null?it[CI.UM]:""}</b>
          {staLen!=null && <em className="dim2"> from {fmtN(staLen,staLen%1?2:0)} ft</em>}</div>
        <button className="ghost sm" disabled={genQty==null} onClick={()=>upTask(t.id,{qty:genQty})}>Apply to qty</button>
      </div>}
      {kind==="lin" && staLen!=null &&
      <div className="logrow">
        <div className="gen">Generated qty<b>{fmtN(genQty,genQty%1?2:0)} {it[CI.UM]}</b><em className="dim2"> = {fmtN(staLen,staLen%1?2:0)} ft run</em></div>
        <button className="ghost sm" disabled={genQty==null} onClick={()=>upTask(t.id,{qty:genQty})}>Apply to qty</button>
      </div>}
      {(runN>1 || runSta) && <>
      <div className="loghdr">Run plan · {runN} day{runN>1?"s":""}{runLocked?` · ${runLocked} logged`:""}</div>
      <div className="ovnote">Edit the run's end station or its avg/day and the whole run re-slices — extend picks up where it left off, shrink drops days. The start stays put{runLocked?"; logged days are kept":""}.</div>
      <div className="logrow">
        <label>Run start (fixed)<input readOnly value={(runS0!=null?"STA "+staFmt(runS0):"—")+(runFirst?" · "+DAYS[runFirst.day]+" "+dLabel(runFirst.wk,runFirst.day):"")}/></label>
        {runSta && <label>Run END STA<BlurInput placeholder="118+40" value={runEnd!=null?staFmt(runEnd):""} onCommit={v=>{const e=parseSTA(v); if(e!=null) resliceRun(t,{end:e});}}/></label>}
      </div>
      <div className="logrow">
        <label>Avg {it[CI.UM]}/day
          <div className="stepper">
            <button type="button" className="stepbtn" title="Slower — spread over more days" onClick={()=>stepAvg(-1)}>−</button>
            <input type="number" value={pAvg} onChange={e=>{ const v=e.target.value; setPAvg(v); const p=+v; if(p>0 && runQtot>0) setPDays(Math.max(1,Math.ceil(runQtot/p))); }}
              onBlur={commitAvg} onKeyDown={e=>{ if(e.key==="Enter") e.currentTarget.blur(); }}/>
            <button type="button" className="stepbtn" title="Faster — fewer days" onClick={()=>stepAvg(1)}>+</button>
          </div>
        </label>
        <label>Days<input type="number" value={pDays} onChange={e=>{ const v=e.target.value; setPDays(v); const d=Math.round(+v); if(d>0 && runQtot>0) setPAvg(Math.round(runQtot/d*100)/100); }}
          onBlur={commitDays} onKeyDown={e=>{ if(e.key==="Enter") e.currentTarget.blur(); }}/></label>
        <div className="gen">Total<b>{fmtN(runQtot,runQtot%1?1:0)} {it[CI.UM]}</b>{runSta&&runS0!=null&&runEnd!=null && <em className="dim2"> · {staFmt(runS0)}→{staFmt(runEnd)}</em>}</div>
      </div>
      {/* Live impact — updates as the run is re-sliced above */}
      <div className="impact">
        <div className="impact-i"><label>Finish</label><b>{runFinish?DAYS[runFinish.day]+" "+dLabel(runFinish.wk,runFinish.day):"—"}</b></div>
        <div className={"impact-i"+(pMH>capMH+1e-6?" over":"")}><label>MH / day</label><b>{fmtN(pMH,pMH<10?1:0)}<em> / {capMH} cap</em></b></div>
        <div className="impact-i"><label>Loads / day</label><b>{pLoads>=0.05?fmtN(pLoads,1):"—"}</b></div>
        <div className="impact-i"><label>Successors</label><b>{succCount||"—"}</b></div>
      </div>
      {runLoggedMem.length>0 && runOpenDays>0 && (()=>{ const um=it[CI.UM]; return (
        <div className="reflowbox">
          <div className="ovnote" style={{margin:"0 0 6px"}}>Achieved <b>{fmtN(achievedRate,achievedRate%1?1:0)} {um}/day</b> so far vs plan {fmtN(runRate,runRate%1?1:0)}
            {runVar!==0 && <> · logged actuals ran <b style={{color:runVar<0?"var(--bad)":"var(--good)"}}>{runVar<0?"behind":"ahead"} {fmtN(Math.abs(runVar),Math.abs(runVar)%1?1:0)} {um}</b></>}.</div>
          <div className="btnrow" style={{marginTop:0}}>
            {achievedRate>0 && Math.abs(achievedRate-runRate)>0.05 && <button className="ghost sm" onClick={()=>resliceRun(t,{perDay:achievedRate})} title="Re-slice the remaining days at the crew's real achieved rate">Apply achieved rate to remaining</button>}
            {runVar!==0 && <button className="ghost sm" onClick={()=>resliceRunCatchup(tasks.filter(x=>runKey(x)===runKey(t)))} title="Re-slice the remaining work from today's actuals — catches up within the crew's daily MH cap, adding days only if needed">Commit actuals → re-slice remaining</button>}
          </div>
        </div>); })()}
      {runLocked>=runN && <div className="ovnote">All {runN} day(s) logged — run plan is locked.</div>}
      </>}
      {kind==="callout" &&
      <div className="ovnote">Station is a location callout for {it[CI.UM]} items — it doesn't set the quantity. Enter qty manually (defaults to 1).</div>}
      {tm.applicable && <>
      <div className="loghdr">Trucking — optimal trucks/day <em className="dim2" style={{fontWeight:400,textTransform:"none"}}>({bgEdit ? bgEdit.fam+" · "+bgEdit.spec : "Roadway · "+(tm.spoil.cy>0?"excavation":"base course")})</em></div>
      <div className="ovnote">{bgEdit ? "Three dedicated haul streams from the daily rate and trench depth: dig-out spoil (out), #57 stone bedding (in), sand backfill (in). Depth is the avg from existing grade to bottom of trench." : "Roadway haul sized from the daily quantity: excavation hauls spoil out; base course / aggregate hauls in from the stone pit."}</div>
      <div className="logrow">
        {bgEdit && <label>Trench depth ft · grade→bottom<BlurInput type="number" value={dig} placeholder={`${resolveDig(it,"",cfg)} assumed`} onCommit={v=>{ setDig(String(v)); setRunDig(t, v); }}/></label>}
        <div className="gen">Optimal<b>🚚 {tm.total} truck{tm.total===1?"":"s"}/day</b><em className="dim2">at {fmtN(tmRate,tmRate%1?1:0)} {it[CI.UM]}/day</em></div>
      </div>
      <div className="impact">
        {tmStreams.map((x,i)=><div className="impact-i" key={i}><label>{x.lbl}</label><b>{x.s.trucks}<em> {x.d}</em></b></div>)}
        <div className="impact-i"><label>Total /day</label><b>{tm.total}</b></div>
      </div>
      {bgEdit&&tm.sand.trucks===0&&(+dig||0)>0 && <div className="ovnote">Trench too shallow for a sand backfill lift at this depth (springline + road section ≥ depth) — no sand haul.</div>}
      {(()=>{ const rp=routePlan({spoil:tm.spoil.loads,stone:tm.stone.loads,sand:tm.sand.loads,base:tm.base?tm.base.loads:0}, cfg.truck&&cfg.truck.sources, cfg.truck); return rp.hoursSaved>0.05 && <div className="ovnote">With back-haul: <b>{rp.trucks}</b> truck{rp.trucks===1?"":"s"} (vs {rp.dumbTrucks} dedicated) · saves ~{fmtN(rp.hoursSaved,1)} hr/day. Tune sources in Trucking → Sources.</div>; })()}
      </>}
      <div className="logrow">
        <label>Location<BlurInput list="loclist-edit" placeholder="Pick or type a location…" value={t.loc||""} onCommit={v=>upTask(t.id,{loc:String(v).trim()||null})}/>
          <datalist id="loclist-edit">{LOCATIONS.map(l=><option key={l} value={l}/>)}</datalist></label>
        <label>Equipment (Equipt. on card)<BlurInput placeholder="e.g. PC490, CAT 336" value={t.equip||""} onCommit={v=>upTask(t.id,{equip:String(v).trim()||null})}/></label>
        <label>Trucks (blank = auto)<BlurInput placeholder={tm&&tm.applicable?tm.total+" auto":"auto"} value={t.trucks||""} onCommit={v=>upTask(t.id,{trucks:String(v).trim()||null})}/></label>
      </div>
      {t.wk!==wk && <div className="ovnote">This card is now on the week of {t.wk} — it will leave the current board view.</div>}

      <div className="loghdr">Predecessors — this run waits on</div>
      <div className="ovnote">This run holds its own dates. If a predecessor is delayed it gets pushed later; a predecessor finishing earlier won't pull it in. Use "Schedule as soon as possible" to snap it right after its predecessors.</div>
      <div className="chiprow">
        {myPreds.length===0 && <span className="ovnote" style={{margin:0}}>None — this run keeps its own dates.</span>}
        {myPreds.map(pk=>{ const info=runInfoFor(tasks,crews,pk); return (
          <span key={pk} className={"predchip"+(info?"":" bad")}>{info? info.item+" · "+info.crew : "(missing run)"}<button onClick={()=>rmDep(myKey,pk)} title="Remove predecessor">✕</button></span>); })}
      </div>
      {!predAdd ?
        <div className="btnrow" style={{marginTop:6}}><button className="ghost sm" onClick={()=>setPredAdd(true)}>+ Add predecessor</button></div> :
        <>
          <input autoFocus className="search" placeholder="Search a run to wait on — crew, item, or location…" value={predQ} onChange={e=>setPredQ(e.target.value)}/>
          <div className="results">
            {candidateRuns.filter(r=>!predQ.trim()||r.search.includes(predQ.trim().toLowerCase())).slice(0,20).map((r,i)=>{
              const top=i===0 && r.res===t.res && r.finishWdi<=myStartWdi;
              return (
              <button key={r.key} className={top?"top":""} onClick={()=>{ addDep(myKey,r.key); setPredAdd(false); setPredQ(""); }}>
                <i style={{background:r.bg}}/>
                <span>{r.item}</span>
                {top && <span className="rtag">closest prev</span>}
                <em>{r.crew} · {r.loc||"—"} · {r.start} · {r.days}d</em>
              </button>);})}
            {candidateRuns.length===0 && <div className="empty">No other runs on the board to wait on.</div>}
          </div>
          <div className="btnrow"><button className="ghost sm" onClick={()=>{setPredAdd(false); setPredQ("");}}>Cancel</button></div>
        </>}
      {myPreds.length>0 && <div className="btnrow" style={{marginTop:6}}>
        {depMap && depMap[myKey] && depMap[myKey].conflict && <span className="ovnote" style={{margin:0,color:"var(--bad)"}}>⚠ Starts before a predecessor finishes</span>}
        <span className="sp"/>
        <button className="ghost sm" onClick={()=>asapRun(t)}>Schedule as soon as possible</button>
      </div>}

      <div className="loghdr">Overrides — this card only</div>
      <div className="ovnote">Item name is edited at the top of this card. Blank = catalog value (shown grey). Overrides never touch the catalog or other cards.</div>
      <div className="logrow">
        <label>Scope color
          <select className={t.ov&&t.ov.scope?"ovon":""} value={t.ov?.scope ?? ""} onChange={e=>setOv("scope", e.target.value||null)}>
            <option value="">(auto: {SCOPES[scopeFor(bit[CI.CC],t.res,crews)].code} · {SCOPES[scopeFor(bit[CI.CC],t.res,crews)].name})</option>
            {Object.keys(SCOPES).map(k=><option key={k} value={k}>{SCOPES[k].code} · {SCOPES[k].name}</option>)}
          </select></label>
        {ovIn("cc","Cost code",bit[CI.CC],false)}
        {ovIn("pay","Pay item",bit[CI.PAY],false)}
        {ovIn("um","Unit",bit[CI.UM],false)}
      </div>
      <div className="logrow">
        {ovIn("mh","MH / unit",bit[CI.MH],true)}
        {ovIn("crewSize","Crew size",cfg.crewSize,true)}
        {ovIn("laborRate","Labor $/MH",cfg.laborRate,true)}
      </div>
      <div className="ovnote">→ effective rate {fmtN(dayRate,dayRate<10?1:0)} {it[CI.UM]}/day · crew {ecfg.crewSize} @ {fmt$(ecfg.laborRate)}/MH</div>
      <div className="logrow">
        {ovIn("bid","Pay (bid) $/unit",bit[CI.BID],true)}
        {ovIn("ul","Labor $/unit",bit[CI.UL],true)}
        {ovIn("ue","Equip $/unit",bit[CI.UE],true)}
      </div>
      <div className="logrow">
        {ovIn("mat","Material $/unit",bit[CI.UM$],true)}
        {ovIn("sub","Sub $/unit",bit[CI.US],true)}
        {ovIn("trk","Trucking $/unit",bit[CI.UT],true)}
        {ovIn("misc","Misc $/unit",bit[CI.UX],true)}
      </div>
      <div className="btnrow">
        <button className="cta" onClick={close}>Done</button>
        {hasOv && <button className="ghost" onClick={()=>upTask(t.id,{ov:null})}>Reset all overrides</button>}
        <span className="sp"/>
        <button className="ghost" onClick={()=>dupRun(t)} title="Clone this run to the working days right after it — drag to reposition">⧉ Duplicate</button>
        {runN>1 && <button className="danger" onClick={()=>{ if(window.confirm("Delete all "+runN+" days of this run (crew + item + location)?")) rmRun(t); }}>Delete run ({runN})</button>}
        <button className="danger" onClick={()=>rmTask(t.id)}>Delete task</button>
      </div>
      </>}
    </Modal>
  );
}

/* ============ CREW MODAL — description as TABLE ============ */
function CrewModal({res,weekTasks,logs,taskCalc,setCrews,rmResource,close}){
  const [name,setName]=useState(res.name);
  const mine = weekTasks.filter(t=>t.res===res.id).sort((a,b)=>a.day-b.day);
  let tp=0,ta=0,tpm=0,tam=0,tem=0;
  const rows = mine.map(t=>{
    const c=taskCalc(t);
    tp+=t.qty; ta+=c.actQty; tpm+=c.planMH; tam+=c.actMH; tem+=c.earnMH;
    return { t,c };
  });
  const pf = tam>0? tem/tam : 0;
  return (
    <Modal close={close} w={680}>
      <div className="crewhead">
        <button className={"pinbtn"+(res.pinned?" on":"")} title={res.pinned?"Pinned to top":"Pin my crew to the top"}
          onClick={()=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,pinned:!c.pinned}:c))}>{res.pinned?"★":"☆"}</button>
        <input className="namein" value={name} onChange={e=>setName(e.target.value)}
          onBlur={()=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,name}:c))}/>
        <span className={"pill "+(pf>=1?"pgood":pf>0?"pbad":"dim")}>PF {pf?pf.toFixed(2):"—"}</span>
        <label className="capfield">Daily MH cap<input type="number" min="0" step="1" value={res.capMH??68}
          onChange={e=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,capMH:+e.target.value||0}:c))}/></label>
        <label className="capfield">Trucks avail<input type="number" min="0" step="1" value={res.trucks??0}
          onChange={e=>setCrews(cs=>cs.map(c=>c.id===res.id?{...c,trucks:+e.target.value||0}:c))}/></label>
      </div>
      <table className="dt list">
        <thead><tr><th>Day</th><th>Item</th><th>CC</th><th className="r">Plan</th><th className="r">Actual</th><th className="r">PPC</th><th className="r">Plan MH</th><th className="r">Act MH</th></tr></thead>
        <tbody>
          {rows.length===0 && <tr><td colSpan={8} className="empty">Nothing scheduled this week — click an empty cell on the board.</td></tr>}
          {rows.map(({t,c})=>
            <tr key={t.id}>
              <td>{DAYS[t.day]}</td>
              <td>{c.it[CI.TASK].slice(0,34)}{c.it[CI.TASK].length>34?"…":""}</td>
              <td className="mono">{c.it[CI.CC]}</td>
              <td className="r">{fmtN(t.qty)} {c.it[CI.UM]}</td>
              <td className="r">{logs[t.id]?fmtN(c.actQty):"—"}</td>
              <td className={"r "+(logs[t.id]?(c.actQty>=t.qty?"pos":"neg"):"")}>{logs[t.id]&&t.qty?pct(c.actQty/t.qty):"—"}</td>
              <td className="r">{fmtN(c.planMH)}</td>
              <td className="r">{logs[t.id]?fmtN(c.actMH):"—"}</td>
            </tr>)}
        </tbody>
        {rows.length>0 && <tfoot><tr><th colSpan={3}>Week totals</th><th className="r">{fmtN(tp)}</th><th className="r">{fmtN(ta)}</th><th className="r">{tp?pct(ta/tp):"—"}</th><th className="r">{fmtN(tpm)}</th><th className="r">{fmtN(tam)}</th></tr></tfoot>}
      </table>
      <div className="btnrow"><span className="sp"/><button className="danger" onClick={()=>rmResource(res.id)}>Remove {res.type==="sub"?"subcontractor":"crew"}</button></div>
    </Modal>
  );
}

/* ============ SCHEDULE MODAL — search + station→qty (PPC logic) ============ */
function SchedModal({wk,crews,cfg,installedFor,preset,lastRes,tasks,holidays,addDep,close,add}){
  const [q,setQ]=useState("");
  const [ci,setCi]=useState(preset.ci ?? null);
  // Smart defaults: reuse the last-scheduled crew and default to today's weekday.
  const todayIdx = (()=>{ const t=new Date().toISOString().slice(0,10); for(let i=0;i<7;i++){ if(addDays(wk,i)===t) return i; } return 0; })();
  const [res,setRes]=useState(preset.res ?? lastRes ?? crews[0]?.id);
  const [day,setDay]=useState(preset.day ?? todayIdx);
  const [loc,setLoc]=useState(preset.loc ?? "");
  const [equip,setEquip]=useState("");
  const [trucks,setTrucks]=useState("");
  const [mode,setMode]=useState("qty");
  const [qty,setQty]=useState("");
  const [s0,setS0]=useState(""); const [s1,setS1]=useState("");
  const [width,setWidth]=useState(""); const [depth,setDepth]=useState(""); const [dens,setDens]=useState("");
  const [dig,setDig]=useState("");         // trench depth grade→bottom (ft) for the trucking model
  const [daysOv,setDaysOv]=useState("");
  const [prodOv,setProdOv]=useState("");   // avg-per-day override — reciprocal with Days via the total qty
  const [predSel,setPredSel]=useState([]); const [predAdd,setPredAdd]=useState(false); const [predQ,setPredQ]=useState("");
  const [runId]=useState(()=>rid());       // this new run's id — all its day-cards share it
  const predCands = useMemo(()=>{
    const keys=[...new Set((tasks||[]).map(runKey))].filter(k=> !predSel.includes(k));   // any existing run (incl. same item) can be a predecessor
    const cands=keys.map(k=>runInfoFor(tasks,crews,k)).filter(Boolean).map(r=>({...r, search:(r.item+" "+r.crew+" "+r.loc+" "+r.cc).toLowerCase()}));
    return rankRuns(cands, res, wdi(wk,day));
  },[tasks,crews,res,ci,loc,day,wk,predSel]);

  const results = useMemo(()=>{
    const s=q.trim().toLowerCase(); if(!s) return [];
    return CATALOG.map((r,i)=>({r,i}))
      .filter(({r})=>r[CI.TASK].toLowerCase().includes(s)||r[CI.CC].toLowerCase().includes(s)||r[CI.PAY].toLowerCase().includes(s))
      .slice(0,30);
  },[q]);
  // One-click quick-picks shown before anything is typed: most-recently-scheduled items
  // first (last-in-array = newest, matching lastRes's convention), then whatever else is
  // used most often on this board overall — so the common items never need retyping.
  const {recentCis,suggestedCis} = useMemo(()=>{
    const seen=new Set(), recent=[];
    for(let i=tasks.length-1;i>=0 && recent.length<10;i--){ const c=tasks[i].ci; if(c!=null && !seen.has(c)){ seen.add(c); recent.push(c); } }
    const freq={}; tasks.forEach(t=>{ if(t.ci!=null) freq[t.ci]=(freq[t.ci]||0)+1; });
    const suggested = Object.keys(freq).map(Number).filter(c=>!seen.has(c))
      .sort((a,b)=>freq[b]-freq[a]).slice(0,10);
    return {recentCis:recent, suggestedCis:suggested};
  },[tasks]);
  const quickBtn = i => { const r=CATALOG[i]; return (
    <button key={i} onClick={()=>setCi(i)}>
      <i style={{background:SCOPES[scopeKeyOf(r[CI.CC])].bg}}/>
      <span>{r[CI.TASK]}</span>
      <em>{r[CI.CC]} · {r[CI.PAY]} · {r[CI.UM]}</em>
    </button>); };

  const it = ci!=null ? CATALOG[ci] : null;
  // End field is dual-purpose in station mode: a station (has "+") ends a run and the qty is
  // computed from it; a plain number (no "+") is punched as the total qty, Start kept as a callout.
  const endIsQty = s1.trim()!=="" && !s1.includes("+");
  const a=parseSTA(s0), b = endIsQty ? null : parseSTA(s1);
  const directQty = endIsQty ? (+s1||0) : null;
  const staLen = a!=null ? (b!=null ? Math.abs(b-a) : 1) : null; // one station given ⇒ length 1
  const kind = it ? unitKind(it[CI.UM]) : "lin";                 // lin/area/vol/wt quantify; callout does not
  const genQty = it ? staGenQty(it[CI.UM], staLen, +width, +depth, +dens) : null; // LF/area/vol/wt
  const staQty = endIsQty ? directQty
    : kind==="callout"
    ? ((a!=null || (qty!=="" && +qty>0)) ? (+qty||1) : null)     // manual count; station is a callout
    : genQty;
  const useQty = mode==="sta" ? (staQty??0) : (+qty||0);
  // Size the day-count against the SELECTED crew's daily MH cap when it's explicitly set (the same
  // number the board grades against), so a new run doesn't read over/under cap the instant it lands.
  const crewCap = (crews.find(c=>c.id===res)||{}).capMH;
  const mhPerDay = crewCap>0 ? crewCap : cfg.crewSize*cfg.shiftHrs;
  const dayRate = it && it[CI.MH]>0 ? mhPerDay/it[CI.MH] : useQty||1;
  const nDays = daysOv!=="" ? Math.max(1,Math.round(+daysOv))
              : (prodOv!=="" && +prodOv>0) ? Math.max(1, Math.ceil(useQty/+prodOv))
              : Math.max(1, Math.ceil(useQty/Math.max(dayRate,0.0001)));
  const perDay = useQty/nDays;
  const inst = it? installedFor(ci):0, est=it? it[CI.EST]:0;
  const remaining = Math.max(0, est-inst);
  const loadsDay = it&&cfg.truckRate>0 ? (perDay*it[CI.UT])/cfg.truckRate : 0;
  const bg = it ? bedForItem(it[CI.CC], it[CI.TASK], it[CI.UM], cfg.truck&&cfg.truck.tw) : null;    // pipe geometry → physical trucking model applies
  const tm = it ? truckModel(it, perDay, resolveDig(it,dig,cfg), cfg.truck) : null;   // pipe (needs depth) OR roadway (qty-driven)

  return (
    <Modal close={close} w={620}>
      <h3>Schedule work</h3>
      {it && <p className="reciprocity">✓ We did the math: days, manhours, trucking loads and budget check below are auto-calculated from the pay item — just set the quantity and crew.</p>}
      {!it && <>
        <input autoFocus className="search" placeholder="Search item, cost code, or pay item — e.g. 51x31, HPPP, 33.40" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="results">
          {q && results.map(({r,i})=>
            <button key={i} onClick={()=>setCi(i)}>
              <i style={{background:SCOPES[scopeKeyOf(r[CI.CC])].bg}}/>
              <span>{r[CI.TASK]}</span>
              <em>{r[CI.CC]} · {r[CI.PAY]} · {r[CI.UM]}</em>
            </button>)}
          {q && results.length===0 && <div className="empty">No catalog match — try part of the cost code or pay item.</div>}
          {!q && recentCis.length===0 && suggestedCis.length===0 && <div className="empty">319 items loaded from QPC (MHs + tracking account).</div>}
          {!q && recentCis.length>0 && <div className="reslabel">Recently used</div>}
          {!q && recentCis.map(quickBtn)}
          {!q && suggestedCis.length>0 && <div className="reslabel">Frequently used</div>}
          {!q && suggestedCis.map(quickBtn)}
        </div>
      </>}

      {it && <>
        <div className="selitem">
          <div><b>{it[CI.TASK]}</b><em>{it[CI.CC]} · Pay {it[CI.PAY]} · {fmtN(it[CI.MH],3)} MH/{it[CI.UM]}</em></div>
          <button className="ghost sm" onClick={()=>setCi(null)}>Change</button>
        </div>

        <div className="budbar">
          <label>Budget {fmtN(est)} {it[CI.UM]} · Installed {fmtN(inst)} ({est?pct(inst/est):"—"}) · Remaining {fmtN(remaining)}</label>
          <div className="bar"><i style={{width:Math.min(100,est?inst/est*100:0)+"%"}}/>
            {useQty>0 && <u style={{left:Math.min(100,est?inst/est*100:0)+"%", width:Math.min(100-(est?inst/est*100:0), est?useQty/est*100:0)+"%"}}/>}
          </div>
          {useQty>remaining&&remaining>0 && <div className="warnline">⚠ Plan exceeds remaining budget qty by {fmtN(useQty-remaining)} {it[CI.UM]}</div>}
        </div>

        <div className="qmode">
          <button className={mode==="qty"?"on":""} onClick={()=>setMode("qty")}>Direct qty</button>
          <button className={mode==="sta"?"on":""} onClick={()=>setMode("sta")}>Station numbers</button>
        </div>
        {mode==="qty" ?
          <div className="logrow"><label>Quantity ({it[CI.UM]})<input type="number" autoFocus value={qty} onChange={e=>setQty(e.target.value)}/></label></div> :
          <>
          <div className="logrow">
            <label>{kind==="callout"?"Start STA (callout)":"Start STA"}<input placeholder="115+15.66" value={s0} onChange={e=>setS0(e.target.value)}/></label>
            <label>End STA or qty<input placeholder="118+40, or 250 = qty" value={s1} onChange={e=>setS1(e.target.value)}/></label>
            {(kind==="lin"||endIsQty) && <div className="gen">{endIsQty?"Total qty":"Generated qty"}<b>{staQty!=null?fmtN(staQty,staQty%1?2:0):"—"} {staQty!=null?it[CI.UM]:""}</b></div>}
          </div>
          {(kind==="area"||kind==="vol"||kind==="wt") && !endIsQty &&
          <div className="logrow">
            <label>Width (ft)<input type="number" placeholder="e.g. 12" value={width} onChange={e=>setWidth(e.target.value)}/></label>
            {(kind==="vol"||kind==="wt") &&
              <label>Depth (ft)<input type="number" placeholder="e.g. 0.5" value={depth} onChange={e=>setDepth(e.target.value)}/></label>}
            {kind==="wt" &&
              <label>Density (TON/CY)<input type="number" placeholder="e.g. 1.4" value={dens} onChange={e=>setDens(e.target.value)}/></label>}
            <div className="gen">Generated qty<b>{staQty!=null?fmtN(staQty,staQty%1?2:0):"—"} {staQty!=null?it[CI.UM]:""}</b>
              {staLen!=null && <em className="dim2"> from {fmtN(staLen,staLen%1?2:0)} ft</em>}</div>
          </div>}
          {kind==="callout" && !endIsQty &&
          <div className="logrow">
            <label>Quantity ({it[CI.UM]})<input type="number" placeholder="1" value={qty} onChange={e=>setQty(e.target.value)}/></label>
            <div className="gen">Station is a callout<b>{staQty!=null?fmtN(staQty,staQty%1?2:0):"—"} {staQty!=null?it[CI.UM]:""}</b></div>
          </div>}
          <div className="ovnote">End STA with a "+" computes the qty from the run; a plain number is the total qty, punched against the Start station.</div>
          </>}

        <div className="logrow">
          <label>Location<input list="loclist" placeholder="Pick or type a location…" value={loc} onChange={e=>setLoc(e.target.value)}/>
            <datalist id="loclist">{LOCATIONS.map(l=><option key={l} value={l}/>)}</datalist></label>
          <label>Equipt.<input placeholder="e.g. PC490, CAT 336" value={equip} onChange={e=>setEquip(e.target.value)}/></label>
          <label>Trucks<input placeholder={tm&&tm.applicable?tm.total+" auto":(loadsDay?fmtN(loadsDay,1)+" loads":"auto")} value={trucks} onChange={e=>setTrucks(e.target.value)}/></label>
        </div>
        <div className="logrow">
          <label>Crew / sub<select value={res} onChange={e=>setRes(e.target.value)}>{crews.map(c=><option key={c.id} value={c.id}>{c.name}{c.type==="sub"?" (sub)":""}</option>)}</select></label>
          <label>Start day<select value={day} onChange={e=>setDay(+e.target.value)}>{DAYS.map((d,i)=><option key={d} value={i}>{d} {dLabel(wk,i)}</option>)}</select></label>
          {bg && <label>Trench depth ft · grade→btm<input type="number" min="0" placeholder={`${resolveDig(it,"",cfg)} assumed`} value={dig} onChange={e=>setDig(e.target.value)}/></label>}
        </div>
        <div className="logrow">
          <label>Avg {it[CI.UM]}/day<input type="number" min="0" placeholder={useQty>0?fmtN(perDay,perDay<10?1:0):"—"}
            value={prodOv!==""?prodOv:(useQty>0?fmtN(perDay,perDay%1?1:0):"")} onFocus={e=>e.target.select()}
            onChange={e=>{ setProdOv(e.target.value); setDaysOv(""); }}/></label>
          <label>Days<input type="number" min="1" placeholder={String(nDays)}
            value={daysOv!==""?daysOv:(useQty>0?String(nDays):"")} onFocus={e=>e.target.select()}
            onChange={e=>{ setDaysOv(e.target.value); setProdOv(""); }}/></label>
          <div className="gen">Total<b>{useQty>0?fmtN(useQty,useQty%1?1:0)+" "+it[CI.UM]:"—"}</b></div>
        </div>
        <div className="chiprow" style={{margin:"2px 0 4px"}}>
          <span className="ovnote" style={{margin:"0 4px 0 0"}}>Predecessors:</span>
          {predSel.length===0 && <span className="ovnote" style={{margin:0}}>none</span>}
          {predSel.map(pk=>{ const info=runInfoFor(tasks,crews,pk); return <span key={pk} className="predchip">{info?info.item+" · "+info.crew:"(run)"}<button onClick={()=>setPredSel(s=>s.filter(x=>x!==pk))} title="Remove">✕</button></span>; })}
        </div>
        {!predAdd
          ? <div className="btnrow" style={{marginTop:0}}><button className="ghost sm" onClick={()=>setPredAdd(true)}>+ Add predecessor</button></div>
          : <>
            <input autoFocus className="search" placeholder="Search a run to wait on — crew, item, or location…" value={predQ} onChange={e=>setPredQ(e.target.value)}/>
            <div className="results">
              {predCands.filter(r=>!predQ.trim()||r.search.includes(predQ.trim().toLowerCase())).slice(0,20).map((r,i)=>{
                const top=i===0 && r.res===res && r.finishWdi<=wdi(wk,day);
                return (
                <button key={r.key} className={top?"top":""} onClick={()=>{ setPredSel(s=>[...s,r.key]); setPredAdd(false); setPredQ(""); }}>
                  <i style={{background:r.bg}}/><span>{r.item}</span>{top && <span className="rtag">closest prev</span>}<em>{r.crew} · {r.loc||"—"} · {r.start} · {r.days}d</em></button>);})}
              {predCands.length===0 && <div className="empty">No other runs on the board to wait on.</div>}
            </div>
            <div className="btnrow"><button className="ghost sm" onClick={()=>{setPredAdd(false); setPredQ("");}}>Cancel</button></div>
          </>}

        {useQty>0 && <table className="dt">
          <tbody>
            <tr><th>Per day</th><td>{fmtN(perDay,perDay<10?1:0)} {it[CI.UM]} · {fmtN(perDay*it[CI.MH])} MH · {loadsDay?fmtN(loadsDay,1)+" loads":"no hauling"}</td></tr>
            {tm&&tm.applicable && <tr><th>Trucks / day</th><td>🚚 <b>{tm.total}</b> — {[["spoil",tm.spoil],["stone",tm.stone],["sand",tm.sand]].filter(([k,s])=>tm.mat[k]&&(s.cy>0||s.trucks>0)).map(([k,s])=>tm.mat[k]+" "+s.trucks).join(" · ")||"—"}{bg&&(+dig||0)===0?" · set trench depth for spoil/sand":""}</td></tr>}
            {tm&&tm.applicable&&(()=>{ const rp=routePlan({spoil:tm.spoil.loads,stone:tm.stone.loads,sand:tm.sand.loads,base:tm.base?tm.base.loads:0}, cfg.truck&&cfg.truck.sources, cfg.truck); return rp.hoursSaved>0.05 && <tr><th>With back-haul</th><td>🔁 <b>{rp.trucks}</b> truck{rp.trucks===1?"":"s"} <em className="dim2">(vs {rp.dumbTrucks} dedicated · saves ~{fmtN(rp.hoursSaved,1)} hr/day)</em></td></tr>; })()}
            <tr><th>Material (plan)</th><td>{fmt$(useQty*it[CI.UM$])}</td></tr>
            <tr><th>Budget amount</th><td>{fmt$(useQty*it[CI.BID])} <em className="dim2">@ {fmt$(it[CI.BID],2)}/{it[CI.UM]}</em></td></tr>
            <tr><th>Budget cost</th><td>{fmt$(useQty*unitCost(it))} <em className="dim2">@ {fmt$(unitCost(it),2)}/{it[CI.UM]}</em></td></tr>
          </tbody>
        </table>}

        <div className="btnrow">
          <button className="cta" disabled={!useQty} onClick={()=>{
            const list=[]; let left=useQty, cursor=(mode==="sta"&&a!=null&&b!=null)?a:null;   // start at the entered Start station — preserves direction, incl. descending (110+00 → 103+00)
            const isCallout = kind==="callout" || endIsQty;   // endIsQty: qty punched, Start is a location callout
            // entered avg/day is the actual daily RATE: each day makes sliceRate, last = remainder;
            // station span is proportional to the day's qty so it lands exactly on the End station.
            const sliceRate = (prodOv!==""&&+prodOv>0) ? +prodOv : perDay;
            const calloutSta = (mode==="sta" && a!=null) ? [a, b??a] : null; // callout: location range kept in entered order, same on each day
            let curDay=day, curWk=wk;                 // carry a multi-day run across working days,
            const isHol = d => !!(holidays && holidays[addDays(curWk,d)]);   // curWk+d is a non-working holiday
            while(isHol(curDay)){ curDay++; if(curDay>4){ curDay=0; curWk=addDays(curWk,7); } }   // never start a run on a holiday
            for(let i=0;i<nDays;i++){                 // rolling into the following week(s) — no stacking, no weekend/holiday work
              const dq=Math.min(left, Math.round(sliceRate*100)/100); left=Math.round((left-dq)*100)/100;
              const staSpan = (!isCallout && cursor!=null && useQty>0) ? (b-a)*(dq/useQty) : null;
              const sta = isCallout ? calloutSta : (cursor!=null? [cursor, cursor+staSpan] : null); if(cursor!=null && !isCallout) cursor+=staSpan;
              list.push({ id:tid(), rid:runId, res, ci, day:curDay, qty:dq, sta, wk:curWk, loc:loc.trim()||null,
                ...(equip.trim()?{equip:equip.trim()}:{}), ...(trucks.trim()?{trucks:trucks.trim()}:{}), ...((+dig>0)?{dig:+dig}:{}) });
              do { curDay++; if(curDay>4){ curDay=0; curWk=addDays(curWk,7); } } while(isHol(curDay));  // next working day, skipping weekends + holidays
            }
            if(predSel.length){ predSel.forEach(pk=>addDep(runId,pk)); }
            add(list);
          }}>Add {nDays>1?nDays+" days":"to board"}</button>
          <button className="ghost" onClick={close}>Cancel</button>
        </div>
      </>}
    </Modal>
  );
}

/* One editable production row in the EOS fast grid — MH auto-fills from qty (shared useLogEntry),
   commits on blur / done-toggle so a super can tab through a whole day without opening cards. */
function EosLogRow({t,it,saveLog,logged}){
  const L=useLogEntry(t,it,logged||{});
  const [done,setDone]=useState(!!(logged&&logged.done));
  const um=it[CI.UM];
  const commit=d=>saveLog(t.id, L.qty===""?0:L.qty, L.mh===""?0:L.mh, d);
  const short = logged && (+L.qty||0) < t.qty-0.01;
  return (
    <div className={"eoslogrow"+(logged?" on":"")}>
      <span className="eoslname" title={it[CI.TASK]}>{it[CI.TASK]}</span>
      <span className="eoslplan">{fmtN(t.qty)} {um}</span>
      <input className="eoslq" type="number" inputMode="decimal" placeholder="qty" value={L.qty}
        onChange={e=>L.setQty(e.target.value)} onBlur={()=>{ if(L.qty!==""||L.mh!=="") commit(done); }}/>
      <input className="eoslmh" type="number" inputMode="decimal" placeholder="MH" value={L.mh}
        onChange={e=>L.setMh(e.target.value)} onBlur={()=>{ if(L.qty!==""||L.mh!=="") commit(done); }}/>
      <label className="eosldone"><input type="checkbox" checked={done}
        onChange={e=>{ setDone(e.target.checked); saveLog(t.id, L.qty===""?t.qty:L.qty, L.mh===""?L.planMH():L.mh, e.target.checked); }}/>done</label>
      <span className="eosltag">{short?("−"+fmtN(t.qty-(+L.qty||0),1)):logged?"✓":""}</span>
      {(L.short||L.reason) && <label className="eoslreason"><span>{L.short?"short — reason:":"reason:"}</span>
        <select value={L.reason} onChange={e=>{ const v=e.target.value; L.setReason(v); if(logged||L.qty!=="") saveLog(t.id, L.qty===""?t.qty:L.qty, L.mh===""?L.planMH():L.mh, done, v); }}>
          <option value="">—</option>{REASONS.map(r=><option key={r} value={r}>{r}</option>)}</select></label>}
    </div>
  );
}

/* Forecast location editor — search a place (Open-Meteo geocoding, no key) or type coordinates.
   Sets cfg.wxLoc, which useForecast prefers over the haul-routing job-site pin. Synced (cfg). */
function WeatherLocModal({cfg,setCfg,close}){
  const siteLoc = (cfg.truck&&cfg.truck.sources&&cfg.truck.sources.site)||TRUCK_DEFAULTS.sources.site;
  const usingOverride = !!(cfg.wxLoc && cfg.wxLoc.lat!=null);
  const cur = usingOverride ? cfg.wxLoc : siteLoc;
  const [q,setQ]=useState(""); const [busy,setBusy]=useState(false); const [results,setResults]=useState(null); const [err,setErr]=useState("");
  const [lat,setLat]=useState(cur.lat!=null?String(cur.lat):""); const [lng,setLng]=useState(cur.lng!=null?String(cur.lng):"");
  const search = async()=>{ const name=q.trim(); if(!name){ return; } setBusy(true); setErr(""); setResults(null);
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=6&language=en&format=json`);
      const j=await r.json(); const res=(j&&j.results)||[];
      setResults(res); if(!res.length) setErr("No match — try a city, ZIP, or place name, or enter coordinates below.");
    }catch(e){ setErr("Search needs a connection. Enter coordinates below instead."); }
    finally{ setBusy(false); }
  };
  const pick = (name,la,lo)=>{ setCfg(c=>({...c, wxLoc:{name, lat:+la, lng:+lo}})); flash("Forecast → "+name); close(); };
  const applyCoords = ()=>{ const la=parseFloat(lat), lo=parseFloat(lng);
    if(isNaN(la)||isNaN(lo)||la<-90||la>90||lo<-180||lo>180){ setErr("Enter a valid latitude (−90…90) and longitude (−180…180)."); return; }
    setCfg(c=>({...c, wxLoc:{name:la.toFixed(3)+", "+lo.toFixed(3), lat:la, lng:lo}})); flash("Forecast location updated"); close();
  };
  const useSite = ()=>{ setCfg(c=>{ const n={...c}; delete n.wxLoc; return n; }); flash("Forecast → job-site pin"); close(); };
  const fmtRes = r => [r.name, r.admin1, r.country_code].filter(Boolean).join(", ");
  return (
    <Modal close={close} w={520}>
      <h3>🌦 Weather forecast location</h3>
      <div className="ovnote">The board's day-by-day forecast (and the rain/lightning storm days) is pulled for this spot. Currently using <b>{cur.name||"job site"}</b> <span className="dim2">({(+cur.lat).toFixed(3)}, {(+cur.lng).toFixed(3)}{usingOverride?"":" · job-site pin"})</span>.</div>
      <div className="logrow" style={{marginTop:10}}>
        <label style={{flex:1}}>Search a place<input type="text" autoFocus placeholder="City, ZIP, or place name (e.g. New Orleans, LA)" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")search();}}/></label>
        <button className="cta" disabled={busy||!q.trim()} onClick={search}>{busy?"…":"Search"}</button>
      </div>
      {results && results.length>0 && <table className="dt list" style={{marginTop:8}}><tbody>
        {results.map((r,i)=><tr key={i}><td>{fmtRes(r)}</td><td className="dim2 r">{r.latitude.toFixed(2)}, {r.longitude.toFixed(2)}</td>
          <td className="r"><button className="cta sm" onClick={()=>pick(fmtRes(r), r.latitude, r.longitude)}>Use</button></td></tr>)}
      </tbody></table>}
      {err && <div className="ovnote" style={{color:"var(--bad)"}}>{err}</div>}
      <div className="loghdr" style={{marginTop:14}}>Or enter coordinates</div>
      <div className="logrow">
        <label>Latitude<input type="number" step="0.0001" placeholder="29.9550" value={lat} onChange={e=>setLat(e.target.value)}/></label>
        <label>Longitude<input type="number" step="0.0001" placeholder="-90.0750" value={lng} onChange={e=>setLng(e.target.value)}/></label>
        <button className="cta" onClick={applyCoords}>Set</button>
      </div>
      <div className="btnrow" style={{marginTop:12}}>
        {usingOverride && <button className="ghost" onClick={useSite}>Reset to job-site pin</button>}
        <button className="ghost" onClick={close}>Close</button>
      </div>
    </Modal>
  );
}

function EOSModal({wk,day:d0,crews,weekTasks,logs,taskCalc,saveLog,eosMeta,setEosMeta,rainDays,cfg,close}){
  const [day,setDay]=useState(d0);
  const [copied,setCopied]=useState(false);
  const [ver,setVer]=useState(0);   // bump to remount log rows after a bulk "log as planned"
  const dayTasks = res => weekTasks.filter(t=>t.res===res && t.day===day);
  const logPlanned = ts => { ts.forEach(t=>{ const it=taskCalc(t).it; saveLog(t.id, t.qty, Math.round(t.qty*it[CI.MH]*10)/10, true); }); setVer(v=>v+1); };
  const crewDesc = (id,fallback)=> eosMeta.descs[id+"_"+day] ?? fallback;

  const truckLine = useMemo(()=>{
    const per = crews.map(c=>{
      // physical truck model (actuals when logged), pooled per crew — matches the Trucking report
      const ms = dayTasks(c.id).map(t=>{ const cc=taskCalc(t); return (cc.actTrk&&cc.actTrk.applicable)?cc.actTrk:(cc.trk&&cc.trk.applicable?cc.trk:null); }).filter(Boolean);
      const merged = ms.length ? mergeTruckModels(ms) : null;
      return {name:c.name, trucks: merged ? merged.total : 0};   // pooled per crew — may be a 0.5 call-out
    }).filter(x=>x.trucks>0);
    // Dispatch: whole-truck crews get their own; half-truck crews PAIR UP on one shared truck
    // (the smart-trucking half-day call-out), so two 0.5 crews request 1 truck, not 2.
    const wholes = per.filter(x=>x.trucks>=1), halves = per.filter(x=>x.trucks<1);
    const parts = wholes.map(x=>`${x.name} - ${Math.ceil(x.trucks)}`);
    for(let i=0;i<halves.length;i+=2){
      if(halves[i+1]) parts.push(`${halves[i].name} + ${halves[i+1].name} share 1`);
      else parts.push(`${halves[i].name} - 1 (half-day)`);
    }
    const total = wholes.reduce((a,x)=>a+Math.ceil(x.trucks),0) + Math.ceil(halves.length/2);
    return total? `${total} truck${total>1?"s":""} requested for today's operation (${parts.join(", ")}).` : "No trucking requested for today's operation.";
  },[weekTasks,day,crews,cfg]);

  const text = useMemo(()=>{
    const dt = addDays(wk,day);
    const isRain = !!(rainDays && rainDays[dt]);
    const L=[];
    L.push(longDate(dt));
    L.push("");
    L.push("Project: 2124013 - DPS 01 Watershed");
    L.push("Superintendent: Brett Leonhard");
    L.push("");
    L.push("Safety:"); L.push(eosMeta.safety); L.push("");
    L.push("Quality:"); L.push(eosMeta.quality); L.push("");
    L.push("Weather:"); L.push(isRain ? "Rained out — inclement weather; no work performed." : eosMeta.weather); L.push("");
    if(isRain){
      L.push("RAINED OUT — no crews worked this shift. All scheduled operations pushed one working day.");
      L.push(""); L.push("—");
      L.push("Preliminary end-of-shift figures based on field counts at time of send; quantities subject to survey verification and final reconciliation.");
      return L.join("\n");
    }
    L.push("Trucking:"); L.push(truckLine); L.push("");
    L.push("Production - Self Perform Crews:"); L.push("");
    crews.filter(c=>c.type==="crew").forEach(c=>{
      const ts=dayTasks(c.id); if(!ts.length) return;
      L.push(c.name);
      ts.forEach(t=>{
        const cc=taskCalc(t);
        const lg=logs[t.id];
        L.push(`Planned - ${cc.it[CI.CC]} ${cc.it[CI.TASK]}`);
        L.push(`Planned Production: ${fmtN(t.qty)} ${cc.it[CI.UM]}`);
        L.push(`Actual Production: ${lg?fmtN(cc.actQty):"0"} ${cc.it[CI.UM]}`);
        L.push(`% of Plan: ${lg&&t.qty?Math.round(cc.actQty/t.qty*100):0}%`);
        if(lg && lg.reason && lg.reason!=="On plan" && cc.actQty < t.qty) L.push(`Delay: ${lg.reason}`);
      });
      L.push("Description:");
      L.push(crewDesc(c.id, autoDesc(c.name, ts, logs, taskCalc, false)));
      L.push("");
    });
    L.push("Production - Subcontractor Crews:"); L.push("");
    crews.filter(c=>c.type==="sub").forEach(c=>{
      const ts=dayTasks(c.id); if(!ts.length && !eosMeta.descs[c.id+"_"+day]) return;
      L.push(c.name);
      L.push("Description:");
      L.push(crewDesc(c.id, autoDesc(c.name, ts, logs, taskCalc, true)));
      L.push("");
    });
    L.push("—");
    L.push("Preliminary end-of-shift figures based on field counts at time of send; quantities subject to survey verification and final reconciliation.");
    return L.join("\n");
  },[wk,day,crews,weekTasks,logs,eosMeta,truckLine,rainDays]);

  const active = crews.filter(c=>dayTasks(c.id).length>0);
  // Editable email body: a per-day override on eosMeta wins once the user types; otherwise the
  // generated `text` shows through (and "Rebuild from board" clears the override).
  const body = (eosMeta.bodies && eosMeta.bodies[day]!=null) ? eosMeta.bodies[day] : text;
  return (
    <Modal close={close} w={720}>
      <div className="crewhead">
        <h3 style={{margin:0}}>End of Shift — {longDate(addDays(wk,day))}</h3>
        <select value={day} onChange={e=>setDay(+e.target.value)}>{DAYS.map((x,i)=><option key={x} value={i}>{x} {dLabel(wk,i)}{rainDays&&rainDays[addDays(wk,i)]?" ⛈":""}</option>)}</select>
      </div>
      {rainDays && rainDays[addDays(wk,day)] && <div className="msline" style={{background:"var(--noteIbg)",borderColor:"var(--noteIln)",color:"var(--noteItx)"}}>⛈ This day is marked rained out — the summary below records a rain-out.</div>}
      <div className="loghdr eoslhdr">Email body
        <button className="ghost sm" onClick={()=>setEosMeta(m=>{ const bd={...(m.bodies||{})}; delete bd[day]; return {...m,bodies:bd}; })} title="Discard edits and re-generate this day's summary from the board">↻ Rebuild from board</button>
      </div>
      <textarea className="eosbody" value={body} spellCheck={false}
        onChange={e=>setEosMeta(m=>({...m, bodies:{...(m.bodies||{}), [day]:e.target.value}}))}/>
      <div className="eosgrid"><label className="full">Send to<input value={eosMeta.to} onChange={e=>setEosMeta(m=>({...m,to:e.target.value}))}/></label></div>
      <div className="btnrow">
        <button className="cta" onClick={()=>{navigator.clipboard?.writeText(body); setCopied(true); setTimeout(()=>setCopied(false),1500);}}>{copied?"Copied ✓":"Copy summary"}</button>
        <a className="btn ghost" href={`mailto:${encodeURIComponent(eosMeta.to)}?subject=${encodeURIComponent(`2124013 DPS 01 Watershed - EOS - ${addDays(wk,day).slice(5).replace("-",".")}.${addDays(wk,day).slice(0,4)}`)}&body=${encodeURIComponent(body)}`}>Open in email</a>
        <span className="sp"/><em className="dim2">Cost data is deliberately excluded.</em>
      </div>

      <div className="loghdr eoslhdr">Log production
        <button className="ghost sm" disabled={!active.length} onClick={()=>logPlanned(active.flatMap(c=>dayTasks(c.id)))}>Log whole day as planned ✓</button>
      </div>
      {active.length===0 && <div className="ovnote" style={{margin:"2px 0 6px"}}>No work scheduled for this day.</div>}
      {active.map(c=>{ const ts=dayTasks(c.id); return (
        <div key={c.id} className="eoslgrp">
          <div className="eoslghd"><b>{c.name}</b><span className="eoslcols">qty · MH · done</span><button className="ghost sm" onClick={()=>logPlanned(ts)}>All planned</button></div>
          {ts.map(t=><EosLogRow key={c.id+"_"+t.id+"_"+ver} t={t} it={taskCalc(t).it} saveLog={saveLog} logged={logs[t.id]}/>)}
        </div>); })}
    </Modal>
  );
}

function Trends({crews,tasks,logs,taskCalc,wk}){
  const weeks = useMemo(()=>{
    const set=[...new Set(tasks.map(t=>t.wk))].sort();
    return set.map(w=>{
      const rows = crews.map(c=>{
        let p=0,a=0,e=0;
        tasks.filter(t=>t.wk===w&&t.res===c.id).forEach(t=>{const x=taskCalc(t); p+=x.planMH; a+=x.actMH; e+=x.earnMH;});
        return {c,p,a,e,pf:a>0?e/a:0};
      }).filter(r=>r.p>0||r.a>0);
      return {w,rows};
    });
  },[crews,tasks,logs]);
  return (
    <div className="page">
      <h2>Productivity trends</h2>
      {weeks.map(({w,rows})=>
        <div key={w} className="panel">
          <div className="ph">{wkTitle(w)}{w===wk?" · current":""}</div>
          <table className="dt list">
            <thead><tr><th>Crew</th><th className="r">Plan MH</th><th className="r">Actual MH</th><th className="r">Earned MH</th><th className="r">PF</th><th style={{width:"34%"}}>Earned vs actual</th></tr></thead>
            <tbody>{rows.map(r=>
              <tr key={r.c.id}>
                <td>{r.c.name}{r.c.type==="sub"?" (sub)":""}</td>
                <td className="r">{fmtN(r.p)}</td><td className="r">{fmtN(r.a)}</td><td className="r">{fmtN(r.e)}</td>
                <td className={"r "+(r.pf>=1?"pos":r.pf>0?"neg":"")}>{r.pf?r.pf.toFixed(2):"—"}</td>
                <td><div className="tbar"><i style={{width:Math.min(100,(r.a? r.e/Math.max(r.a,r.e):0)*100)+"%"}}/><u style={{width:Math.min(100,(r.e? r.a/Math.max(r.a,r.e):0)*100)+"%"}}/></div></td>
              </tr>)}
            </tbody>
          </table>
        </div>)}
      <p className="dim2">Weeks accumulate as you schedule and log — use ‹ › on the board to plan ahead; history stays here.</p>
    </div>
  );
}
